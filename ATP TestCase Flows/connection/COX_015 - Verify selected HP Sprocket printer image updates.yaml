# ATP Test Case ID: COX_015
# Excel: PCF-015 | Module: Pre Connection Flow
# Verify selected 'HP Sprocket' printer image updates
# Expected: HP Sprocket printer image should display with the printer name 'HP Sprocket' at 'Select Your Device' screen along with 'Continue with this Printer' button
appId: com.hp.impulse.sprocket
name: "COX_015 - Verify selected HP Sprocket printer image updates"
tags:
  - connection
  - atp-excel
---
- runFlow: subflows/reach_excel_screen.yaml
- assertVisible:
    text: "HP Sprocket"
    optional: true
- assertVisible:
    text: "Select Your Device"
    optional: true
- assertVisible:
    text: "Continue with this Printer"
    optional: true
- assertVisible:
    text: "Printer"
    optional: true
