# ATP Test Case ID: COX_182
# Excel: HP600_CONN_TC020 | Module: Wi-Fi Validation at 'This Printer uses wi-fi' pop up
# Verify that the app remains on the Wi-Fi instruction screen when the phone is not connected to a Wi-Fi network.
# Expected: Should redirect to 'This printer uses wi-fi' screen along with 'Next' button
appId: com.hp.impulse.sprocket
name: "COX_182 - Verify that the app remains on the Wi-Fi instruction screen "
tags:
  - connection
  - atp-excel
---
- runFlow: subflows/reach_excel_screen.yaml
- assertVisible:
    text: "This printer uses wi-fi"
    optional: true
- assertVisible:
    text: "Next"
    optional: true
- assertVisible:
    text: "Printer"
    optional: true
