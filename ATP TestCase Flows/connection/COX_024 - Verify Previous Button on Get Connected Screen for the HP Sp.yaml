# ATP Test Case ID: COX_024
# Excel: PCF_HP200_006 | Module: Pre Connection Flow for HP 200
# Verify 'Previous' Button on 'Get Connected' Screen for the HP Sprocket 200 printer.
# Expected: 1. User should be redirected to the 'Load Paper' screen. 2. Step 2 should be highlighted.
appId: com.hp.impulse.sprocket
name: "COX_024 - Verify Previous Button on Get Connected Screen for the HP Sp"
tags:
  - connection
  - atp-excel
---
- runFlow: subflows/reach_excel_screen.yaml
- assertVisible:
    text: "Load Paper"
    optional: true
- assertVisible:
    text: "Previous"
    optional: true
- assertVisible:
    text: "Get Connected"
    optional: true
- assertVisible:
    text: "Printer"
    optional: true
