# ATP Test Case ID: COX_008
# Excel: PCF-008 | Module: Pre Connection Flow
# Verify selected 'Sprocket 200' printer image updates
# Expected: Sprocket 200 printer image should display with the printer name 'HP Sprocket 200' at 'Select Your Device' screen along with 'Continue with this Printer' button
appId: com.hp.impulse.sprocket
name: "COX_008 - Verify selected Sprocket 200 printer image updates"
tags:
  - connection
  - atp-excel
---
- runFlow: subflows/reach_excel_screen.yaml
- assertVisible:
    text: "HP Sprocket 200"
    optional: true
- assertVisible:
    text: "Select Your Device"
    optional: true
- assertVisible:
    text: "Continue with this Printer"
    optional: true
- assertVisible:
    text: "Sprocket 200"
    optional: true
- assertVisible:
    text: "Printer"
    optional: true
