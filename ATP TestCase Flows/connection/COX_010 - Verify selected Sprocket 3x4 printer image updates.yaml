# ATP Test Case ID: COX_010
# Excel: PCF-010 | Module: Pre Connection Flow
# Verify selected 'Sprocket 3x4' printer image updates
# Expected: Sprocket 3x4 printer image should display with the printer name 'Sprocket 3x4' at 'Select Your Device' screen along with 'Continue with this Printer' button
appId: com.hp.impulse.sprocket
name: "COX_010 - Verify selected Sprocket 3x4 printer image updates"
tags:
  - connection
  - atp-excel
---
- runFlow: subflows/reach_excel_screen.yaml
- assertVisible:
    text: "Sprocket 3x4"
    optional: true
- assertVisible:
    text: "Select Your Device"
    optional: true
- assertVisible:
    text: "Continue with this Printer"
    optional: true
- assertVisible:
    text: "Printer"
    optional: true
