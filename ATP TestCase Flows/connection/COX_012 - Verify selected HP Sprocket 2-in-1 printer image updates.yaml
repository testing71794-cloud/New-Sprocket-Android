# ATP Test Case ID: COX_012
# Excel: PCF-012 | Module: Pre Connection Flow
# Verify selected 'HP Sprocket 2-in-1' printer image updates
# Expected: HP Sprocket 2-in-1 printer image should display with the printer name 'HP Sprocket 2-in-1' at 'Select Your Device' screen along with 'Continue with this Printer' button
appId: com.hp.impulse.sprocket
name: "COX_012 - Verify selected HP Sprocket 2-in-1 printer image updates"
tags:
  - connection
  - atp-excel
---
- runFlow: subflows/reach_excel_screen.yaml
- assertVisible:
    text: "HP Sprocket 2-in-1"
    optional: true
- assertVisible:
    text: "Select Your Device"
    optional: true
- assertVisible:
    text: "Continue with this Printer"
    optional: true
- assertVisible:
    text: "Printer"
    optional: true
