# ATP Test Case ID: COX_030
# Excel: PCF_HP200_012 | Module: Pre Connection Flow for HP 200
# Verify that printer discovery starts automatically after Bluetooth is enabled for HP 200
# Expected: 1. 'Searching for Printers…' screen should be displayed. 2. Search progress indicator should be displayed.
appId: com.hp.impulse.sprocket
name: "COX_030 - Verify that printer discovery starts automatically after Blu"
tags:
  - connection
  - atp-excel
---
- runFlow: subflows/reach_excel_screen.yaml
- assertVisible:
    text: "Searching for Printers…"
    optional: true
- assertVisible:
    text: "Printer"
    optional: true
- assertVisible:
    text: "Searching for Printers"
    optional: true
