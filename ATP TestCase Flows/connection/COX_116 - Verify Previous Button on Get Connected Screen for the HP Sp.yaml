# ATP Test Case ID: COX_116
# Excel: PCF_Sprocket Plus_006 | Module: Pre Connection Flow for Sprocket Plus
# Verify 'Previous' Button on 'Get Connected' Screen for the HP Sprocket Plus printer.
# Expected: 1. User should be redirected to the 'Load Paper' screen. 2. Step 2 should be highlighted.
appId: com.hp.impulse.sprocket
name: "COX_116 - Verify Previous Button on Get Connected Screen for the HP Sp"
tags:
  - connection
  - atp-excel
---
- runFlow: subflows/reach_excel_screen.yaml
- assertVisible:
    text: "Load Paper"
    optional: true
- assertVisible:
    text: "Previous"
    optional: true
- assertVisible:
    text: "Get Connected"
    optional: true
- assertVisible:
    text: "Printer"
    optional: true
