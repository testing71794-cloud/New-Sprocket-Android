# ATP Test Case ID: COX_161
# Excel: General_PCF-013 | Module: 
# Verify Finish Connection behavior after Bluetooth OFF
# Expected: User should navigate to 'Your Printers' list screen, and the connected printer should display as offline along with 'Tap to Connect' option.
appId: com.hp.impulse.sprocket
name: "COX_161 - Verify Finish Connection behavior after Bluetooth OFF"
tags:
  - connection
  - atp-excel
---
- runFlow: subflows/reach_excel_screen.yaml
- assertVisible:
    text: "Your Printers"
    optional: true
- assertVisible:
    text: "Tap to Connect"
    optional: true
- assertVisible:
    text: "Printer"
    optional: true
