# ATP Test Case ID: COX_016
# Excel: PCF-016 | Module: Pre Connection Flow
# Verify selected 'HP Sprocket Panorama' printer image updates
# Expected: The 'Select Your Device' screen should display the HP Sprocket Panorama printer image, the printer name 'HP Sprocket Panorama', the text 'Only available in the HP Sprocket Panorama App', and the 'GET IT ON Google Play' button.
appId: com.hp.impulse.sprocket
name: "COX_016 - Verify selected HP Sprocket Panorama printer image updates"
tags:
  - connection
  - atp-excel
---
- runFlow: subflows/reach_excel_screen.yaml
- assertVisible:
    text: "Select Your Device"
    optional: true
- assertVisible:
    text: "HP Sprocket Panorama"
    optional: true
- assertVisible:
    text: "Only available in the HP Sprocket Panorama App"
    optional: true
- assertVisible:
    text: "GET IT ON Google Play"
    optional: true
- assertVisible:
    text: "Printer"
    optional: true
