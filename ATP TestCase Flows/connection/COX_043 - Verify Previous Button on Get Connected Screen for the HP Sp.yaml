# ATP Test Case ID: COX_043
# Excel: PCF_HP3*4_006 | Module: Pre Connection Flow for Sprocket 3x4
# Verify 'Previous' Button on 'Get Connected' Screen for the HP Sprocket 3x4 printer.
# Expected: 1. User should be redirected to the 'Load Paper' screen. 2. Step 2 should be highlighted.
appId: com.hp.impulse.sprocket
name: "COX_043 - Verify Previous Button on Get Connected Screen for the HP Sp"
tags:
  - connection
  - atp-excel
---
- runFlow: subflows/reach_excel_screen.yaml
- assertVisible:
    text: "Load Paper"
    optional: true
- assertVisible:
    text: "Previous"
    optional: true
- assertVisible:
    text: "Get Connected"
    optional: true
- assertVisible:
    text: "Printer"
    optional: true
