# ATP Test Case ID: COX_129
# Excel: PCF_Sprocket Plus_019 | Module: Pre Connection Flow for Sprocket Plus for iOS
# Verify Printer Found After Retry for HP Sprocket Plus printer
# Expected: 1. The Searching for Printers screen should be displayed. 2. The available printer should appear in the 'Select an Accessory' native pop up list.
appId: com.hp.impulse.sprocket
name: "COX_129 - Verify Printer Found After Retry for HP Sprocket Plus printe"
tags:
  - connection
  - atp-excel
---
- runFlow: subflows/reach_excel_screen.yaml
- assertVisible:
    text: "Select an Accessory"
    optional: true
- assertVisible:
    text: "Printer"
    optional: true
- assertVisible:
    text: "Searching for Printers"
    optional: true
