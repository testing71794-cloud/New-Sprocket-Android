# ATP Test Case ID: COX_013
# Excel: PCF-013 | Module: Pre Connection Flow
# Verify selected 'HP Sprocket Plus' printer image updates
# Expected: HP Sprocket Plus printer image should display with the printer name 'HP Sprocket Plus' at 'Select Your Device' screen along with 'Continue with this Printer' button
appId: com.hp.impulse.sprocket
name: "COX_013 - Verify selected HP Sprocket Plus printer image updates"
tags:
  - connection
  - atp-excel
---
- runFlow: subflows/reach_excel_screen.yaml
- assertVisible:
    text: "HP Sprocket Plus"
    optional: true
- assertVisible:
    text: "Select Your Device"
    optional: true
- assertVisible:
    text: "Continue with this Printer"
    optional: true
- assertVisible:
    text: "Printer"
    optional: true
