# ATP Test Case ID: COX_011
# Excel: PCF-011 | Module: Pre Connection Flow
# Verify selected 'HP Sprocket Select' printer image updates
# Expected: Sprocket Select printer image should display with the printer name 'HP Sprocket Select' at 'Select Your Device' screen along with 'Continue with this Printer' button
appId: com.hp.impulse.sprocket
name: "COX_011 - Verify selected HP Sprocket Select printer image updates"
tags:
  - connection
  - atp-excel
---
- runFlow: subflows/reach_excel_screen.yaml
- assertVisible:
    text: "HP Sprocket Select"
    optional: true
- assertVisible:
    text: "Select Your Device"
    optional: true
- assertVisible:
    text: "Continue with this Printer"
    optional: true
- assertVisible:
    text: "Printer"
    optional: true
