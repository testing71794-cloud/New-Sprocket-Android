# ATP Test Case ID: COX_109
# Excel: PCF_Sprocket_019 | Module: Pre Connection Flow for HP Sprocket For iOS
# Verify Printer Found After Retry for HP Sprocket printer for iOS
# Expected: 1. The Searching for Printers screen should be displayed. 2. The available printer should appear in the 'Select an Accessory' native pop up list.
appId: com.hp.impulse.sprocket
name: "COX_109 - Verify Printer Found After Retry for HP Sprocket printer for"
tags:
  - connection
  - atp-excel
---
- runFlow: subflows/reach_excel_screen.yaml
- assertVisible:
    text: "Select an Accessory"
    optional: true
- assertVisible:
    text: "Printer"
    optional: true
- assertVisible:
    text: "Searching for Printers"
    optional: true
