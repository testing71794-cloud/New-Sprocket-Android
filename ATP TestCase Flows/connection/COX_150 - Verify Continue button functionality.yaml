# ATP Test Case ID: COX_150
# Excel: General_PCF-002 | Module: Pre Connection Flow
# Verify Continue button functionality
# Expected: User should navigate to the setup flow corresponding to the selected printer, for example if we select 'Sprocket 3x4' then it should redirect to "Charge + Power On' screen along with 'Next' button.
appId: com.hp.impulse.sprocket
name: "COX_150 - Verify Continue button functionality"
tags:
  - connection
  - atp-excel
---
- runFlow: subflows/reach_excel_screen.yaml
- assertVisible:
    text: "Sprocket 3x4"
    optional: true
- assertVisible:
    text: "Charge + Power On"
    optional: true
- assertVisible:
    text: "Next"
    optional: true
- assertVisible:
    text: "Printer"
    optional: true
