# ATP Test Case ID: GA_01
# Create / home hub after first-launch permissions (Sprocket).
appId: com.hp.impulse.sprocket
name: "GA_01 - Gallery home screen"
---
- launchApp:
    clearState: true
- runFlow: ../onboarding/subflows/skip_onboarding_to_gallery.yaml
- runFlow:
    when:
      visible: ".*(?i)Create.*"
    commands:
      - tapOn: ".*(?i)Create.*"
- waitForAnimationToEnd:
    timeout: 2000
- assertVisible:
    text: ".*(?i)(Log in|Sign in).*"
    optional: true
# Create hub tiles (labels live in content-desc; Photo ID is below the fold)
- assertVisible: ".*(?i)Quick Print.*"
- assertVisible:
    text: ".*(?i)(Print photos from your gallery|gallery).*"
    optional: true
- assertVisible: ".*(?i)Collage Maker.*"
- assertVisible:
    text: ".*(?i)(Combine multiple photos|multiple photos).*"
    optional: true
- assertVisible: ".*(?i)Pre-?Cut Stickers.*"
- assertVisible:
    text: ".*(?i)(Print stickers|2 photos).*"
    optional: true
- assertVisible: ".*(?i)Tile Print.*"
- assertVisible:
    text: ".*(?i)(multiple sheets|large photo).*"
    optional: true
- assertVisible: ".*(?i)Photobooth.*"
- assertVisible:
    text: ".*(?i)(4-photo|collage).*"
    optional: true
- scrollUntilVisible:
    element: ".*(?i)Photo ID.*"
    direction: DOWN
    timeout: 15000
- assertVisible: ".*(?i)Photo ID.*"
- assertVisible:
    text: ".*(?i)(ID-ready|ID).*"
    optional: true
# Bottom Navigation
- assertVisible: ".*(?i)More.*"
- assertVisible: ".*(?i)Create.*"
- assertVisible: ".*(?i)Printer.*"
