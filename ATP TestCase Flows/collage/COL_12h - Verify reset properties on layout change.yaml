# ATP Test Case ID: COL_12h
# Excel: Collage_12 (h) | Module: Collage maker- Reset Photo Properties When Layout Is Changed
# Verify that changing the collage layout resets Fit/Fill, zoom, and rotation.
appId: com.caglobal.hp.sprocket
name: "COL_12h - Verify reset properties on layout change"
tags:
  - collage
  - atp-excel
  - positive
