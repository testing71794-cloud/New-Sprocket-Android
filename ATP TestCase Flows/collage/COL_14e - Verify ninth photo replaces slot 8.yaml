# ATP Test Case ID: COL_14e
# Excel: Collage_14 (e) | Module: Collage maker- photo selection
# Verify that after selecting 8 photos, the selection indicator remains on the 8th photo and selecting a new photo replaces the 8th photo.
appId: com.caglobal.hp.sprocket
name: "COL_14e - Verify ninth photo replaces slot 8"
tags:
  - collage
  - atp-excel
  - positive
---
- runFlow: subflows/excel_launch_to_large_collage.yaml
- runFlow: subflows/select_eight_photos_fast.yaml
- tapOn:
    point: "82%,84%"
- waitForAnimationToEnd:
    timeout: 400
- runFlow: subflows/swipe_slot_carousel.yaml
- assertVisible: "8"
