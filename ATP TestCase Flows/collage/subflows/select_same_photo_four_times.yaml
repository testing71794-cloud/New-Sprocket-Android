appId: com.caglobal.hp.sprocket
---
# Select the same gallery thumbnail four times (duplicate fill).
- swipe:
    start: "50%,80%"
    end: "50%,52%"
    duration: 400
- waitForAnimationToEnd:
    timeout: 500
- tapOn:
    point: "18%,58%"
- waitForAnimationToEnd:
    timeout: 500
- tapOn:
    point: "18%,58%"
- waitForAnimationToEnd:
    timeout: 500
- tapOn:
    point: "18%,58%"
- waitForAnimationToEnd:
    timeout: 500
- tapOn:
    point: "18%,58%"
- waitForAnimationToEnd:
    timeout: 800
