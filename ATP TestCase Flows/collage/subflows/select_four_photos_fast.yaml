appId: com.hp.impulse.sprocket
---
# Fill all 4 collage slots (Sprocket UI: Select 2 to 4 photos).
- tapOn:
    point: "18%,56%"
- tapOn:
    point: "50%,56%"
- tapOn:
    point: "82%,56%"
- tapOn:
    point: "18%,70%"
- waitForAnimationToEnd:
    timeout: 800
- runFlow:
    when:
      visible: "Select 2 to 4 photos"
    commands:
      - tapOn:
          point: "18%,72%"
          optional: true
      - tapOn:
          point: "50%,72%"
          optional: true
      - tapOn:
          point: "82%,72%"
          optional: true
      - tapOn:
          point: "18%,82%"
          optional: true
