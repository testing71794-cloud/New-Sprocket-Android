appId: com.caglobal.hp.sprocket
---
# Fill all 4 collage slots. Swipe past the top video/date row first.
- swipe:
    start: "50%,80%"
    end: "50%,52%"
    duration: 400
- waitForAnimationToEnd:
    timeout: 500
- tapOn:
    point: "18%,58%"
- tapOn:
    point: "50%,58%"
- tapOn:
    point: "82%,58%"
- tapOn:
    point: "18%,72%"
- waitForAnimationToEnd:
    timeout: 800
- runFlow:
    when:
      visible: "Select 2 to 4 photos"
    commands:
      - tapOn:
          point: "50%,72%"
          optional: true
      - tapOn:
          point: "82%,72%"
          optional: true
      - tapOn:
          point: "18%,84%"
          optional: true
      - waitForAnimationToEnd:
          timeout: 800
