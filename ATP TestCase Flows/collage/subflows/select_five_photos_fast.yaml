appId: com.caglobal.hp.sprocket
---
# Five distinct gallery tiles (large-collage grid).
- swipe:
    start: "50%,80%"
    end: "50%,52%"
    duration: 400
- waitForAnimationToEnd:
    timeout: 500
- tapOn:
    point: "18%,58%"
- waitForAnimationToEnd:
    timeout: 400
- tapOn:
    point: "50%,58%"
- waitForAnimationToEnd:
    timeout: 400
- tapOn:
    point: "82%,58%"
- waitForAnimationToEnd:
    timeout: 400
- tapOn:
    point: "18%,70%"
- waitForAnimationToEnd:
    timeout: 400
- tapOn:
    point: "50%,70%"
- waitForAnimationToEnd:
    timeout: 800
