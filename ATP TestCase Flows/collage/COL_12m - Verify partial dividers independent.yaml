# ATP Test Case ID: COL_12m
# Excel: Collage_12 (m) | Module: Collage maker- Partial Divider Lines Are Controlled Separately
# Verify that partial divider lines are treated as separate dividers and can be adjusted independently.
appId: com.caglobal.hp.sprocket
name: "COL_12m - Verify partial dividers independent"
tags:
  - collage
  - atp-excel
  - positive
