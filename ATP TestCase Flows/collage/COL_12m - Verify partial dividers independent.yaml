- runFlow: subflows/excel_launch_to_collage.yaml
- runFlow: subflows/create_collage_three_photos_sprocket.yaml
- swipe:
    start: "35%,32%"
    end: "50%,32%"
    duration: 600
- swipe:
    start: "70%,55%"
    end: "70%,40%"
    duration: 600
- assertVisible: "Drag & Drop to Reorder"
