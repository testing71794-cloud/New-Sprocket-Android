# ATP Test Case ID: AI_78_replace_object
# Supplied Excel ID:
# AI Tools 78
# Supplied module:
# AI Tools >Replace Object – Gallery Selection
# Supplied description:
# Verify navigation to Replace Object, folder selection, sorting, scrolling, photo selection, and Use This Image flow.
# Supplied steps:
# 1. Install and launch the application.
# 2. Verify the Splash Screen displays the HP logo (hp sprocket) with “sprocket” text.
# 3. Wait for the Splash Screen to complete.
# 4. Swipe through the onboarding screens.
# 5. Tap Get Started.
# 6. Tap Sign Up Later.
# 7. Wait until the Home screen is displayed.
# 8. If the notification permission popup appears, tap Allow.
# 9. Navigate to AI Tools.
# 10. Tap Replace Object.
# 11. Verify the Gallery Listing screen is displayed.
# 12. Tap the Folder option and select any available folder.
# 13. Tap the Sort option and select Newest.
# 14. Verify the gallery photos are sorted from newest to oldest.
# 15. Tap the Sort option and select Oldest.
# 16. Verify the gallery photos are sorted from oldest to newest.
# 17. Scroll through the gallery.
# 18. Select any available photo.
# 19. Verify the selected photo screen displays the Use This Image option.
# 20. Tap Use This Image.
# Supplied type:
# Positive
# Supplied expected result:
# Replace Object opens the Gallery Listing screen.
# Selecting a folder updates the displayed photos.
# Newest and Oldest sorting options are available and sort the photos accordingly.
# Gallery photos can be scrolled.
# Selecting a photo displays the Use This Image option.
# Tapping Use This Image opens the Replace Object editing screen.
# Dependency tags identify only assertions Maestro cannot prove without external evidence.
appId: com.caglobal.hp.sprocket
name: "AI_78_replace_object - Verify navigation to Replace Object, folder selection, sorting, scrolling, photo selection, and Use This Image flow."
tags:
  - ai
  - atp-excel
  - object-tools
  - visual-validation
---
- runFlow: subflows/object_open_replace.yaml
- runFlow: subflows/object_assert_gallery.yaml
- runFlow: subflows/object_change_folder_and_sort.yaml
- runFlow: subflows/object_select_photo.yaml
- assertVisible: ".*(?i)(Describe|description|replacement).*"
- takeScreenshot: AI_78_replace_object_editor
