# Supplied JSON row: AI Tools 67 | Replace Background
# Verify native share sheet
appId: com.caglobal.hp.sprocket
name: "AI_67 - Replace Background Share - Verify native share sheet"
tags:
  - ai
  - atp-supplied
  - network
  - visual-manual
---
- runFlow: subflows/background_apply_preset_to_preview.yaml
- tapOn:
    point: "92%,8%"
- extendedWaitUntil:
    visible: ".*(?i)(Share with|Nearby Share|Quick Share|Bluetooth|More).*"
    timeout: 15000
- assertVisible: ".*(?i)(Share with|Nearby Share|Quick Share|Bluetooth|More).*"
