# ATP Test Case ID: AI_03
# Excel: AI Tools 03 | Module: AI Tools
# Verify UI layout of AI Tools screen
# Expected: Complete AI Tools layout, sections, cards, and persistent bottom navigation.
appId: com.caglobal.hp.sprocket
name: "AI_03 - Verify UI layout of AI Tools screen"
tags:
  - ai
  - atp-supplied
---
- runFlow: subflows/reach_module_screen.yaml
- assertVisible: "Create with AI Tools"
- assertVisible: ".*Text-to-Image.*AI generated images from text prompts.*"
- assertVisible: ".*Image-to-Image.*Change photos into different styles with AI.*"
- assertVisible: "Background Tools"
- assertVisible: "Remove Background"
- assertVisible: "Replace Background"
- assertVisible: "More.*Tab 1 of 3"
- assertVisible: "Create.*Tab 2 of 3"
- assertVisible: "Printer.*Tab 3 of 3"
- takeScreenshot: "AI_03_top_layout"
