    start: "50%,80%"
    end: "50%,30%"
    duration: 500
- assertVisible: "Object Tools"
- assertVisible: "Remove Object"
- assertVisible: "Replace Object"
- assertVisible: "Grab Object"
- assertVisible: "Photo Enhancements"
- assertVisible: "Restore Photo"
- assertVisible: "Enhance Photo"
- assertVisible: "Fix Lighting"
- assertVisible: "Upscale Photo"
- assertVisible: "Generate"
- assertVisible: "Extend Image"
- assertVisible: "Generate Object"
- assertVisible: "More.*Tab 1 of 3"
- assertVisible: "Create.*Tab 2 of 3"
- assertVisible: "Printer.*Tab 3 of 3"
- takeScreenshot: "AI_03_lower_layout"
