# ATP Test Case ID: AI_06e
# Excel: AI Tools 06 (e) | Module: Text-to-Image
# Verify Generate Prompt replaces existing text.
appId: com.caglobal.hp.sprocket
name: "AI_06e - Verify Generate Prompt replaces prompt"
tags:
  - ai
  - atp-supplied
---
- runFlow: subflows/open_text_to_image.yaml
- tapOn:
    text: "Tap here to enter a prompt..."
- inputText: "replace this prompt"
- assertVisible: "replace this prompt"
- tapOn:
    point: "87%,28%"
- extendedWaitUntil:
    notVisible: "replace this prompt"
    timeout: 5000
- takeScreenshot: "AI_06e_replaced_random_prompt"
