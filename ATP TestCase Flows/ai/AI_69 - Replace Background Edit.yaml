# Supplied JSON row: AI Tools 69 | Replace Background
# Verify Print Preview edit retention
appId: com.caglobal.hp.sprocket
name: "AI_69 - Replace Background Edit - Verify Print Preview edit retention"
tags:
  - ai
  - atp-supplied
  - network
  - visual-manual
---
- runFlow: subflows/background_apply_preset_to_preview.yaml
- tapOn:
    point: "84%,84%"
- runFlow:
    when:
      visible: "Allow Sprocket to send you notifications?"
    commands:
      - tapOn: "Don't allow"
- extendedWaitUntil:
    visible: ".*(?i)(Crop|Frame|Done).*"
    timeout: 15000
- tapOn: ".*(?i)Frame.*"
- tapOn:
    id: ".*saveRecentEditImageView.*"
- tapOn:
    id: ".*btnDone.*"
- extendedWaitUntil:
    visible: "Copies"
    timeout: 30000
- assertVisible: "Copies"
