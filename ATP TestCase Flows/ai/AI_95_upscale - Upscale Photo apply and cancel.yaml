# Excel: AI Tools 95
# Module: AI Tools >Upscale Photo> Saved Unsaved Changes Handling
# Description: Verify applying the upscaled photo and handling unsaved changes through Cancel.
# Steps:
# 1. Launch the application and navigate to AI Tools > Photo Enhancements > Upscale Photo.
# 2. Select any photo from the Gallery Listing screen.
# 3. Tap Generate.
# 4. Wait for the upscaled and denoised photo to be displayed.
# 5. Tap Apply.
# 6. Verify that the Print Preview screen is displayed with the upscaled and denoised photo.
# 7. Return to the Upscale Photo result screen.
# 8. Tap Cancel.
# 9. Verify that the Unsaved Changes popup is displayed with Stay and Exit without Saving options.
# 10. Tap Stay.
# 11. Verify that the popup closes and the user remains on the Upscale Photo result screen.
# 12. Tap Cancel again.
# 13. Tap Exit without Saving.
# 14. Verify that the user is redirected to the AI Tools selection screen.
# Type: Positive
# Expected:
# Apply redirects the user to Print Preview with the upscaled and denoised photo.
# Cancel displays the Unsaved Changes popup.
# Stay closes the popup and keeps the user on the Upscale Photo result screen.
# Exit without Saving redirects the user to the AI Tools selection screen.
appId: com.caglobal.hp.sprocket
name: "AI_95_upscale - Upscale Photo apply and cancel"
tags:
  - ai
  - atp-excel
  - provided-ai
  - upscale
---
- runFlow:
    file: subflows/enhancement_prepare_reference.yaml
    env:
      TOOL_NAME: "Upscale Photo" 
- runFlow: subflows/enhancement_generate_result.yaml
- runFlow: subflows/enhancement_apply_print_preview.yaml
- back
- assertVisible: "(?i)Save as new photo.*"
- tapOn: ".*(?i)(Don.?t Save|Do Not Save).*"
- assertVisible: "Show Original"
- runFlow: subflows/enhancement_cancel_unsaved.yaml
