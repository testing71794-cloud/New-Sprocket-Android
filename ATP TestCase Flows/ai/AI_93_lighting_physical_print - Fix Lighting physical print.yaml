# Excel: AI Tools 93
# Module: AI Tools >Fix Lighting – Print Preview
# Description: Verify Save to Gallery, Don't Save, popup dismissal, and printed output after applying the lighting correction.
# Steps:
# 1. Launch the application and navigate to AI Tools > Photo Enhancements > Fix Lighting.
# 2. Select any photo from the Gallery Listing screen.
# 3. Tap Generate.
# 4. Wait for the lighting-corrected photo to be displayed.
# 5. Tap Apply.
# 6. Verify that the Print Preview screen is displayed with the lighting-corrected photo.
# 7. Tap the Back button.
# 8. Verify that the Save as new photo? popup is displayed with Save to Gallery and Don't Save options.
# 9. Tap the Cross icon on the popup.
# 10. Verify that the popup closes and the user remains on the Print Preview screen.
# 11. Tap the Back button again.
# 12. Tap Save to Gallery.
# 13. Verify that the lighting-corrected photo is saved to the gallery and the user returns to the previous screen.
# 14. Repeat the Fix Lighting flow until the Save as new photo? popup is displayed.
# 15. Tap Don't Save.
# 16. Verify that the lighting-corrected photo is not saved to the gallery and the user returns to the previous screen.
# 17. Generate another lighting-corrected photo and tap Apply.
# 18. Send the print command while the printer is connected.
# 19. Verify that the printed output matches the photo displayed in Print Preview.
# Type: Positive
# Expected:
# Apply redirects to Print Preview with the lighting-corrected photo.
# Back displays the Save as new photo? popup with Save to Gallery and Don't Save options.
# Cross closes the popup and keeps the user on Print Preview.
# Save to Gallery saves the lighting-corrected photo and returns to the previous screen.
# Don't Save does not save the lighting-corrected photo and returns to the previous screen.
# Printed output matches the lighting-corrected image displayed in Print Preview.
# Dependency portion: requires physical printer test environment.
appId: com.caglobal.hp.sprocket
name: "AI_93_lighting_physical_print - Fix Lighting physical print"
tags:
  - ai
  - atp-excel
  - provided-ai
  - lighting
  - physical-printer
---
- runFlow:
    file: subflows/enhancement_prepare_reference.yaml
    env:
      TOOL_NAME: "Fix Lighting" 
- runFlow: subflows/enhancement_generate_result.yaml
- runFlow: subflows/enhancement_apply_print_preview.yaml
- runFlow: subflows/enhancement_print_physical.yaml
