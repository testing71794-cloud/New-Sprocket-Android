# ATP Test Case ID: AI_07
# Excel: AI Tools 07
# Module: AI Text to image- Verify Generate Image(s) Button Activation and Navigation to Loader
# Description:
# Verify that the Generate Image(s) button becomes activated after entering a prompt and selecting the required orientation and image quantity, and tapping it navigates to the loader state.
# Steps:
# 1. Install and launch the application.
# 2. Verify the Splash Screen displays the HP logo (hp sprocket) with “sprocket” text.
# 3. Wait for the Splash Screen to complete.
# 4. Swipe through the onboarding screens.
# 5. Tap Get Started.
# 6. Tap Sign Up Later.
# 7. Wait until the Home screen is displayed.
# 8. If the notification permission popup appears, tap Allow.
# 9. Tap the Create tab from the bottom navigation bar.
# 10. Tap Text-to-Image.
# 11. Tap the prompt text box.
# 12. Enter a valid prompt.
# 13. Select an orientation.
# 14. Select an image quantity.
# 15. Tap the Generate Image(s) button.
# Expected:
# The Generate Image(s) button becomes activated after a prompt is entered and the required orientation and image quantity are selected.
# Tapping Generate Image(s) navigates the user to the loader state while the images are being generated.
appId: com.caglobal.hp.sprocket
name: "AI_07 - Verify that the Generate Image(s) button becomes activated after entering a prompt and selecting the required orientation and image quantity, and tapping it navigates to the loader state."
tags:
  - ai
  - atp-supplied
  - network
---
- runFlow: subflows/text_to_image_configure_three.yaml
- assertVisible:
    text: "Generate Image\\(s\\)"
    enabled: true
- tapOn:
    text: "Generate Image\\(s\\)"
    enabled: true
- extendedWaitUntil:
    visible: "Generating..."
    timeout: 15000
