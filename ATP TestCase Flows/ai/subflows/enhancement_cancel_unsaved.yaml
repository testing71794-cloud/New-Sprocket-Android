appId: com.caglobal.hp.sprocket
---
- tapOn: "Cancel"
- assertVisible: "Unsaved Changes"
- assertVisible: "Stay"
- assertVisible: ".*(?i)Exit [Ww]ithout [Ss]aving.*"
- tapOn: "Stay"
- extendedWaitUntil:
    visible: ".*(?i)(Show Original|Restore Photo).*"
    timeout: 15000
- tapOn: "Cancel"
- assertVisible: "Unsaved Changes"
- tapOn: ".*(?i)Exit [Ww]ithout [Ss]aving.*"
- extendedWaitUntil:
    visible: "Create with AI Tools"
    timeout: 15000
- assertVisible: "Create with AI Tools"
