appId: com.caglobal.hp.sprocket
---
- tapOn: "Generate"
- extendedWaitUntil:
    visible: ".*(?i)(Generating|Generate New).*"
    timeout: 15000
- assertVisible: ".*(?i)(Generating|Generate New).*"
- extendedWaitUntil:
    visible: "Generate New"
    timeout: 180000
- assertVisible: "Generate New"
- assertVisible:
    text: "Apply"
    enabled: true
