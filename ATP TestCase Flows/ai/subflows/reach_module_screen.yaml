# Launch through onboarding, open Create, and enter Sprocket AI.
# The Sprocket AI banner is visual but has no accessibility semantics on the
# current Compose screen, so use its stable top-card position.
# See: https://docs.maestro.dev/maestro-flows/flow-control-and-logic/nested-flows
# See: https://docs.maestro.dev/reference/commands-available/extendedwaituntil
appId: com.caglobal.hp.sprocket
---
# Keep app state so a lab pre-connected printer is preserved.
- runFlow: ../../printing/subflows/launch_to_create_keep_state.yaml
- runFlow: ../../common/subflows/dismiss_rate_app_if_visible.yaml
- assertVisible: ".*(?i)Quick Print.*"
- tapOn:
    point: "50%,17%"
- runFlow: ../../common/subflows/dismiss_rate_app_if_visible.yaml
- extendedWaitUntil:
    visible: "Create with AI Tools"
    timeout: 10000
- assertVisible: "Create with AI Tools"
