appId: com.caglobal.hp.sprocket
---
# Compose exposes the visually disabled CTA as enabled=true but clickable=false.
# Verify it cannot leave the editor until both required inputs are provided.
- assertVisible: "Generate"
- tapOn:
    point: "72%,94%"
- assertVisible: "Paint the area you would like to generate."
- swipe:
    start: "38%,42%"
    end: "58%,52%"
    duration: 800
- assertVisible: "Generate"
- tapOn:
    point: "50%,85%"
- inputText: "Add a flower vase"
- hideKeyboard
- assertVisible: "Generate"
