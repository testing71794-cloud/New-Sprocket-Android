appId: com.caglobal.hp.sprocket
---
- assertVisible:
    text: "Generate"
    enabled: true
- tapOn: "Generate"
- extendedWaitUntil:
    visible: ".*(?i)(Generating|Show Original).*"
    timeout: 15000
- extendedWaitUntil:
    notVisible: "Generating..."
    timeout: 180000
- runFlow:
    when:
      visible: "No Internet"
    commands:
      - tapOn: "OK"
      - runFlow: enhancement_enable_internet.yaml
      - tapOn: "Generate"
      - extendedWaitUntil:
          notVisible: "Generating..."
          timeout: 180000
- runFlow:
    when:
      visible: "Try Again"
    commands:
      - tapOn: "Try Again"
      - extendedWaitUntil:
          visible: "Generating..."
          timeout: 15000
      - extendedWaitUntil:
          notVisible: "Generating..."
          timeout: 180000
- runFlow:
    when:
      visible: "Try Again"
    commands:
      - tapOn: "Try Again"
      - extendedWaitUntil:
          visible: "Generating..."
          timeout: 15000
      - extendedWaitUntil:
          notVisible: "Generating..."
          timeout: 180000
- runFlow:
    when:
      visible: "Try Again"
    commands:
      - tapOn: "Try Again"
      - extendedWaitUntil:
          visible: "Generating..."
          timeout: 15000
      - extendedWaitUntil:
          notVisible: "Generating..."
          timeout: 180000
- extendedWaitUntil:
    visible: "Show Original"
    timeout: 180000
- assertVisible: "Show Original"
- assertVisible:
    text: "Apply"
    enabled: true
