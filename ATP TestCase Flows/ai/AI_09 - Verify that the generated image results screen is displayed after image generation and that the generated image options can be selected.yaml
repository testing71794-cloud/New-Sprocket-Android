# ATP Test Case ID: AI_09
# Excel: AI Tools 09
# Module: AI Text to image- Verify Generated Image Results Screen
# Description:
# Verify that the generated image results screen is displayed after image generation and that the generated image options can be selected.
# Steps:
# 1. Install and launch the application.
# 2. Verify the Splash Screen displays the HP logo (hp sprocket) with “sprocket” text.
# 3. Wait for the Splash Screen to complete.
# 4. Swipe through the onboarding screens.
# 5. Tap Get Started.
# 6. Tap Sign Up Later.
# 7. Wait until the Home screen is displayed.
# 8. If the notification permission popup appears, tap Allow.
# 9. Tap the Create tab from the bottom navigation bar.
# 10. Tap Text-to-Image.
# 11. Tap the prompt text box.
# 12. Enter a valid prompt.
# 13. Select an orientation.
# 14. Select an image quantity.
# 15. Tap the Generate Image(s) button.
# 16. Wait for the image generation process to complete.
# Expected:
# The generated image results screen is displayed after image generation is completed.
# At the top-left, a “Cancel” button should be displayed, and at the top-right, an “Apply” button should be displayed.
# The number of generated image options matches the selected Image Quantity.
# Option 1 is selected by default and displayed in the main preview area.
# The remaining generated images are displayed as small thumbnails below the main preview.
# Each thumbnail matches the selected image orientation/aspect ratio.
# Tapping any generated image thumbnail switches the main preview to the corresponding generated image.
# The selected thumbnail is visually highlighted to indicate the currently displayed image.
# The Generate New button is displayed at the bottom of the screen.
appId: com.caglobal.hp.sprocket
name: "AI_09 - Verify that the generated image results screen is displayed after image generation and that the generated image options can be selected."
tags:
  - ai
  - atp-supplied
  - network
  - visual-manual
---
- runFlow: subflows/text_to_image_generate_results.yaml
- assertVisible: "Cancel"
- assertVisible: "Apply"
- assertVisible: "Generate New"
- takeScreenshot: AI_09_generated_results
