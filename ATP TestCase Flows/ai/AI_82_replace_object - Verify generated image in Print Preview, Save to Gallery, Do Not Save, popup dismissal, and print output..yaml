# ATP Test Case ID: AI_82_replace_object
# Supplied Excel ID:
# AI Tools 82
# Supplied module:
# AI Tools >Replace Object – Print Preview
# Supplied description:
# Verify generated image in Print Preview, Save to Gallery, Do Not Save, popup dismissal, and print output.
# Supplied steps:
# 1. Launch the application and navigate to AI Tools > Replace Object.
# 2. Select any photo and tap Use This Image.
# 3. Select or paint an object.
# 4. Enter valid replacement object description text.
# 5. Tap Generate.
# 6. Wait for the generated result.
# 7. Tap Apply.
# 8. Verify that the Print Preview screen displays the generated image.
# 9. Tap the Back arrow.
# 10. Verify that the Save as new photo? popup is displayed with Save to Gallery and Do Not Save options.
# 11. Tap the Cross icon.
# 12. Verify that the popup closes and the user remains on the Print Preview screen.
# 13. Tap the Back arrow again.
# 14. Tap Save to Gallery.
# 15. Verify that the generated image is saved to the gallery and the user returns to the previous screen.
# 16. Repeat the flow until the Save as new photo? popup is displayed.
# 17. Tap Do Not Save.
# 18. Verify that the generated image is not saved to the gallery and the user returns to the previous screen.
# 19. Generate another Replace Object result and tap Apply.
# 20. Send the print command from Print Preview.
# 21. Verify that the printed photo matches the image displayed in Print Preview.
# Supplied type:
# Positive
# Supplied expected result:
# Print Preview displays the generated Replace Object image.
# Back displays the Save as new photo? popup.
# Cross closes the popup and keeps the user on Print Preview.
# Save to Gallery saves the generated image and returns to the previous screen.
# Do Not Save does not save the image and returns to the previous screen.
# The printed output matches the image shown in Print Preview.
# Dependency tags identify only assertions Maestro cannot prove without external evidence.
appId: com.caglobal.hp.sprocket
name: "AI_82_replace_object - Verify generated image in Print Preview, Save to Gallery, Do Not Save, popup dismissal, and print output."
tags:
  - ai
  - atp-excel
  - object-tools
  - gallery-filesystem-validation
  - printer-hardware
---
- runFlow: subflows/object_open_replace.yaml
- runFlow: subflows/object_select_photo.yaml
- runFlow: subflows/object_paint_replace.yaml
- runFlow:
    file: subflows/object_enter_description.yaml
    env:
      OBJECT_PROMPT: "Replace bulb with phone"
- runFlow: subflows/object_generate.yaml
- runFlow: subflows/object_wait_result.yaml
- runFlow: subflows/object_apply_preview.yaml
- runFlow: subflows/object_save_popup.yaml
- runFlow:
    when:
      visible: "Stay"
    commands:
      - tapOn: "Stay"
- runFlow:
    when:
      visible: "Save to Gallery"
    commands:
      - tapOn:
          point: "88%,34%"
- assertNotVisible: ".*(?i)(Save as (a )?new photo|Unsaved Changes).*"
- runFlow: subflows/object_save_popup.yaml
- tapOn: ".*(?i)Save to Gallery.*"
- runFlow: subflows/object_prepare_replace_result.yaml
- runFlow: subflows/object_save_popup.yaml
- tapOn: ".*(?i)(Do Not Save|Don.?t Save|Exit [Ww]ithout [Ss]aving).*"
- extendedWaitUntil:
    notVisible: ".*(?i)(Save as (a )?new photo|Unsaved Changes).*"
    timeout: 10000
- runFlow: subflows/object_prepare_replace_result.yaml
- assertVisible:
    text: "Print"
    enabled: true
- tapOn:
    text: "Print"
    enabled: true
- extendedWaitUntil:
    visible: ".*(?i)(Printing|Sending to printer|Print).*"
    timeout: 30000
