# ATP Test Case ID: AI_14
# Excel: AI Tools 14
# Module: AI Text-to-Image – Print Output Matches Print Preview
# Description:
# Verify that the printed output is generated successfully and matches the image, layout, and selected settings displayed in the Print Preview screen.
# Steps:
# 1. Install and launch the application.
# 2. Verify the Splash Screen displays the HP logo (hp sprocket) with “sprocket” text.
# 3. Wait for the Splash Screen to complete.
# 4. Swipe through the onboarding screens.
# 5. Tap Get Started.
# 6. Tap Sign Up Later.
# 7. Wait until the Home screen is displayed.
# 8. Make sure the printer is connected to the app.
# 9. If the notification permission popup appears, tap Allow.
# 10. Tap Text-to-Image.
# 11. Enter a valid text prompt.
# 12. Tap Generate.
# 13. Wait for the image to be generated.
# 14. Tap Next.
# 15. Wait until the Print Preview screen is displayed.
# 16. Verify the image, orientation, size, copies, and other applicable print settings in Print Preview.
# 17. Tap Print.
# 18. Wait for the print job to complete.
# 19. Collect the printed output from the connected printer.
# 20. Compare the printed output with the Print Preview screen.
# Expected:
# Expected Result:
# 
# The print command is accepted and the print job is sent to the connected printer.
# The image is printed successfully.
# The printed output matches the Print Preview in terms of image content, orientation, layout, selected size, and other applicable print settings.
# No unexpected cropping, rotation, distortion, or missing content is present on the printed output.
appId: com.caglobal.hp.sprocket
name: "AI_14 - Verify that the printed output is generated successfully and matches the image, layout, and selected settings displayed in the Print Preview screen."
tags:
  - ai
  - atp-supplied
  - network
  - visual-manual
  - printer-manual
---
- runFlow: subflows/text_to_image_generate_results.yaml
- tapOn: "Apply"
- extendedWaitUntil:
    visible: "Copies"
    timeout: 30000
- runFlow: ../printing/subflows/assert_print_preview_ui.yaml
- takeScreenshot: AI_14_print_preview_reference
- runFlow: ../quick-print/subflows/ensure_printer_on_print_preview.yaml
- runFlow: ../quick-print/subflows/tap_print_and_assert_complete.yaml
