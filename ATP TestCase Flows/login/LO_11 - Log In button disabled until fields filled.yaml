# ATP Test Case ID: LO_11
# Figma ON_03C — Log In button does not submit until both Email and Password are filled.
appId: com.hp.impulse.sprocket
name: "LO_11 - Log In button disabled until fields filled"
---
- launchApp:
    clearState: true
- runFlow: subflows/reach_login_email_form.yaml
- tapOn: "Log In"
- waitForAnimationToEnd:
    timeout: 2000
- assertVisible: "Log In with Email"
- tapOn: "Email"
- inputText: Niteshmehra56@gmail.com
- tapOn: "Log In"
- waitForAnimationToEnd:
    timeout: 2000
- assertVisible: "Log In with Email"
- assertVisible: "Password"
