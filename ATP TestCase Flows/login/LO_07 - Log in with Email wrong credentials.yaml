# ATP Test Case ID: LO_07
# Figma ON_05F — email login wrong credentials alert
appId: com.hp.impulse.sprocket
name: "LO_07 - Log in with Email wrong credentials"
---
- launchApp:
    clearState: true
- runFlow: subflows/reach_login_email_form.yaml
- tapOn: "Email"
- inputText: Niteshmehra56@gmail.com
- tapOn: "Password"
- inputText: WrongPass999!
- runFlow: subflows/submit_email_login_form.yaml
- waitForAnimationToEnd:
    timeout: 8000
- runFlow: subflows/assert_wrong_credentials_error.yaml
- assertVisible: "Log In with Email"
