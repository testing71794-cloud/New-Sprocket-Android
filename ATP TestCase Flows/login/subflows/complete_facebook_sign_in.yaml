appId: com.hp.impulse.sprocket
---
# Complete Facebook OAuth for signup, login, and Quick Print gallery.
# Covers: Chrome tab, language, Continue as, credentials, save-login, captcha, cookies.
# Credentials: cplusadev@gmail.com / CAglobal@127
# Do NOT use hideKeyboard or pressKey back — they dismiss the WebView.
# See: https://docs.maestro.dev/maestro-flows/flow-control-and-logic/nested-flows
# See: https://docs.maestro.dev/maestro-flows/flow-control-and-logic/loops
# See: https://docs.maestro.dev/maestro-flows/flow-control-and-logic/conditions

- runFlow:
    when:
      visible: ".*(?i)minimi[sz]e tab.*"
    commands:
      - waitForAnimationToEnd:
          timeout: 1000

- waitForAnimationToEnd:
    timeout: 1500

- runFlow: dismiss_facebook_language_picker.yaml

- runFlow:
    when:
      visible: ".*(?i)(m\\.facebook\\.com|minimi[sz]e tab).*"
    commands:
      - waitForAnimationToEnd:
          timeout: 2000

- runFlow: handle_facebook_oauth_screens.yaml

- runFlow:
    when:
      visible: "cplusadev@gmail.com"
    commands:
      - tapOn: "cplusadev@gmail.com"
      - waitForAnimationToEnd:
          timeout: 2000

- runFlow: enter_facebook_credentials.yaml
- runFlow: advance_facebook_after_credentials.yaml
- waitForAnimationToEnd:
    timeout: 2000
