# Assert wrong-credentials feedback when the app exposes it in the tree.
appId: com.hp.impulse.sprocket
---
- runFlow:
    when:
      visible: "You have entered an invalid email id or password"
    commands:
      - assertVisible: "You have entered an invalid email id or password"
      - tapOn:
          text: "Ok"
          optional: true
      - tapOn:
          text: "OK"
          optional: true
- runFlow:
    when:
      visible: "No account found for this email address"
    commands:
      - assertVisible: "No account found for this email address"
- runFlow:
    when:
      visible: ".*(?i)invalid.*email.*password.*"
    commands:
      - assertVisible:
          text: ".*(?i)invalid.*email.*password.*"
