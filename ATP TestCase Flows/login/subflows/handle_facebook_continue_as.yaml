appId: com.hp.impulse.sprocket
---
# Facebook OAuth consent — same Continue / Continue as path as signup SG_03.
# See: https://docs.maestro.dev/maestro-flows/flow-control-and-logic/conditions
# See: https://docs.maestro.dev/reference/commands-available/tapon

- runFlow:
    when:
      visible:
        text: ".*(?i)(would you like to continue|previously logged in).*"
    commands:
      - tapOn:
          text: "Continue as.*"
          retryTapIfNoChange: true
      - waitForAnimationToEnd:
          timeout: 8000

- runFlow:
    when:
      visible: "Continue as"
    commands:
      - tapOn:
          text: "Continue as.*"
          retryTapIfNoChange: true
      - waitForAnimationToEnd:
          timeout: 8000

- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"
      - waitForAnimationToEnd:
          timeout: 3000

- runFlow:
    when:
      visible: "Edit access"
    commands:
      - tapOn:
          text: "Continue as.*"
      - waitForAnimationToEnd:
          timeout: 5000

- runFlow:
    when:
      visible: "Continue as.*"
    commands:
      - tapOn:
          text: "Continue as.*"
          optional: true
      - waitForAnimationToEnd:
          timeout: 5000

- runFlow:
    when:
      visible: "I already have a profile"
    commands:
      - tapOn: "I already have a profile"
      - waitForAnimationToEnd:
          timeout: 3000
