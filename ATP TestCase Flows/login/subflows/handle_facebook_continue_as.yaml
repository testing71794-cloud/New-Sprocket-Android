appId: com.hp.impulse.sprocket
---
# Facebook OAuth consent — SG_03 Continue / Continue as (English, Punjabi, Hindi).
# See: https://docs.maestro.dev/maestro-flows/flow-control-and-logic/conditions
# See: https://docs.maestro.dev/reference/commands-available/tapon

- runFlow:
    when:
      visible:
        text: ".*(?i)(would you like to continue|previously logged in).*"
    commands:
      - tapOn:
          text: "Continue as.*"
          retryTapIfNoChange: true
      - waitForAnimationToEnd:
          timeout: 2500

- runFlow:
    when:
      visible: "Continue as"
    commands:
      - tapOn:
          text: "Continue as.*"
          retryTapIfNoChange: true
      - waitForAnimationToEnd:
          timeout: 2500

- runFlow:
    when:
      visible: "Continue as.*"
    commands:
      - tapOn:
          text: "Continue as.*"
          optional: true
      - waitForAnimationToEnd:
          timeout: 2000

- runFlow:
    when:
      visible: "Edit access"
    commands:
      - tapOn:
          text: "Continue as.*"
          optional: true
      - tapOn: "Continue"
      - waitForAnimationToEnd:
          timeout: 2000

- runFlow:
    when:
      visible: "Continue"
      notVisible:
        id: "m_login_email"
    commands:
      - tapOn: "Continue"
      - waitForAnimationToEnd:
          timeout: 3000

- runFlow:
    when:
      visible: "ਜਾਰੀ ਰੱਖੋ"
    commands:
      - tapOn: "ਜਾਰੀ ਰੱਖੋ"
      - waitForAnimationToEnd:
          timeout: 2500

- runFlow:
    when:
      visible: "जारी रखें"
    commands:
      - tapOn: "जारी रखें"
      - waitForAnimationToEnd:
          timeout: 2500

- runFlow:
    when:
      visible: "I already have a profile"
    commands:
      - tapOn: "I already have a profile"
      - waitForAnimationToEnd:
          timeout: 3000
