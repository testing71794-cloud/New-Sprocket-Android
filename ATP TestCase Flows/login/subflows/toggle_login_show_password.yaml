appId: com.hp.impulse.sprocket
---
# ON_03F — tap visibility toggle once; form remains on email login screen.
- tapOn: "Password"
- inputText: Password123
- hideKeyboard
- waitForAnimationToEnd:
    timeout: 1000
- tapOn:
    rightOf:
      below: "Log In with Email"
      index: 1
    index: 0
- waitForAnimationToEnd:
    timeout: 1000
- assertVisible: "Log In with Email"
- assertVisible: "Forgot password?"
- assertVisible: "Log In"
