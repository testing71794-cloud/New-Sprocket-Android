appId: com.hp.impulse.sprocket
---
# After the login form — remaining Chrome prompts, then primary/secondary buttons.
# See: https://docs.maestro.dev/maestro-flows/flow-control-and-logic/nested-flows
# See: https://docs.maestro.dev/maestro-flows/flow-control-and-logic/conditions
# See: https://docs.maestro.dev/reference/commands-available/tapon

- runFlow: handle_facebook_oauth_screens.yaml
- runFlow: tap_facebook_log_in.yaml

- runFlow:
    when:
      visible: "m.facebook.com"
      notVisible:
        id: "m_login_email"
      notVisible:
        id: "recaptcha-anchor"
    commands:
      - tapOn:
          point: "50%,75%"
      - waitForAnimationToEnd:
          timeout: 2000
      - tapOn:
          point: "50%,83%"
          optional: true
      - waitForAnimationToEnd:
          timeout: 2000
