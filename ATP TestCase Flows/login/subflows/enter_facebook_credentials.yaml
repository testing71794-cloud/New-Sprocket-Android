appId: com.hp.impulse.sprocket
---
# Facebook login form — SG_03 field order; ids work in any language.
# Kodak SE_06: cplusadev@gmail.com / CAglobal@127
# Do NOT use hideKeyboard or pressKey back — they dismiss the WebView.
# See: https://docs.maestro.dev/maestro-flows/flow-control-and-logic/conditions
# See: https://docs.maestro.dev/reference/commands-available/tapon

# Chrome saved-password sheet after focusing the email field.
- runFlow:
    when:
      visible: "Use saved password"
    commands:
      - tapOn: "Sign in"
      - waitForAnimationToEnd:
          timeout: 8000

- runFlow:
    when:
      visible: ".*(?i)^Sign in$"
      notVisible: "Continue as"
    commands:
      - tapOn: "Sign in"
      - waitForAnimationToEnd:
          timeout: 8000

# m.facebook.com form (any language).
- runFlow:
    when:
      visible:
        id: "m_login_email"
      notVisible: "Continue as"
      notVisible: "Use saved password"
    commands:
      - tapOn:
          id: "m_login_email"
      - inputText: "cplusadev@gmail.com"
      - waitForAnimationToEnd:
          timeout: 3000
      - runFlow:
          when:
            visible: "Use saved password"
          commands:
            - tapOn: "Sign in"
            - waitForAnimationToEnd:
                timeout: 8000
      - runFlow:
          when:
            visible:
              id: "m_login_password"
            notVisible: "Use saved password"
          commands:
            - tapOn:
                id: "m_login_password"
            - inputText: "CAglobal@127"
            - waitForAnimationToEnd:
                timeout: 2000
            - tapOn:
                point: "50%,62%"
            - tapOn:
                text: "Log In"
                optional: true
            - tapOn:
                text: "Log in"
                optional: true
            - waitForAnimationToEnd:
                timeout: 8000

# English combined form (SG_03) when ids are not exposed.
- runFlow:
    when:
      visible: "Password"
      notVisible:
        id: "m_login_email"
      notVisible: "Continue as"
      notVisible: "Use saved password"
    commands:
      - runFlow: dismiss_facebook_language_picker.yaml
      - tapOn:
          text: "Email"
          optional: true
      - tapOn:
          text: "Mobile number or email"
          optional: true
      - tapOn:
          text: "Email or phone"
          optional: true
      - inputText: "cplusadev@gmail.com"
      - waitForAnimationToEnd:
          timeout: 2000
      - tapOn:
          text: "Password"
          optional: true
      - inputText: "CAglobal@127"
      - waitForAnimationToEnd:
          timeout: 2000
      - tapOn:
          text: "Log In"
          retryTapIfNoChange: true
      - tapOn:
          text: "Log in"
          optional: true
      - tapOn:
          point: "50%,62%"
          optional: true
      - waitForAnimationToEnd:
          timeout: 8000
