appId: com.hp.impulse.sprocket
---
# ON_03 / CR_01B — after "Continue without Logging In": terms → coachmark → permissions → Create home.
- runFlow: ../../common/subflows/accept_terms_if_visible.yaml
- runFlow: ../../common/subflows/reach_kodak_coachmark_onboarding.yaml
- runFlow:
    when:
      visible: "Skip"
    commands:
      - tapOn: "Skip"
      - waitForAnimationToEnd:
          timeout: 2000
- runFlow: ../../permission/subflows/allow_all_runtime_permissions.yaml
- runFlow: ../../gallery/subflows/dismiss_gallery_coachmark_if_visible.yaml
- waitForAnimationToEnd:
    timeout: 3000
- runFlow:
    when:
      visible: ".*Create.*"
    commands:
      - tapOn: ".*Create.*"
      - waitForAnimationToEnd:
          timeout: 2000
- runFlow:
    when:
      visible: ".*(?i)Quick Print.*"
    commands:
      - swipe:
          direction: DOWN
          duration: 400
- extendedWaitUntil:
    visible: ".*(?i)(Collage Maker|Quick Print|Create|Printer).*"
    timeout: 20000
- assertVisible: ".*(?i)(Collage Maker|Quick Print|Create).*"
- assertVisible:
    text: ".*(?i)(Combine multiple photos|Print photos from your gallery|gallery).*"
    optional: true
