# Land on Sign up options.
# If that screen is already open, do not launch the app again.
# Wipe app data only when this launch is not already on the logged-out Sign up path.
# https://docs.maestro.dev/reference/commands-available/launchapp
# https://docs.maestro.dev/maestro-flows/flow-control-and-logic/conditions
# https://docs.maestro.dev/reference/commands-available/presskey
appId: com.caglobal.hp.sprocket
---
- runFlow:
    when:
      visible: "I don't have an account"
      notVisible: "Sign up with Google"
    commands:
      - tapOn: "I don't have an account"
      - waitForAnimationToEnd:
          timeout: 2000
- runFlow:
    when:
      visible: "SIGN UP"
      notVisible: "Sign up with Google"
    commands:
      - hideKeyboard
      - pressKey: back
      - waitForAnimationToEnd:
          timeout: 2000
- runFlow:
    when:
      notVisible: "Sign up with Google"
    commands:
      - launchApp:
          clearState: false
      - runFlow: ../../common/subflows/wait_after_cold_launch.yaml
      - extendedWaitUntil:
          visible: ".*(?i)(Sign up with Google|Sign up with Email|I already have an account|I don't have an account|Welcome to the new Sprocket|Get Started!|Welcome,|SIGN UP).*"
          timeout: 20000
          optional: true
      - runFlow:
          when:
            visible: "I don't have an account"
            notVisible: "Sign up with Google"
          commands:
            - tapOn: "I don't have an account"
            - waitForAnimationToEnd:
                timeout: 2000
      - runFlow:
          when:
            visible: "SIGN UP"
            notVisible: "Sign up with Google"
          commands:
            - hideKeyboard
            - pressKey: back
            - waitForAnimationToEnd:
                timeout: 2000
      - runFlow:
          when:
            visible: ".*(?i)(Welcome to the new Sprocket|Get Started!|AI Editing).*"
            notVisible: "Sign up with Google"
          commands:
            - runFlow: ../../common/subflows/reach_signup_screen.yaml
      - runFlow:
          when:
            visible: "Welcome,"
            notVisible: "Sign up with Google"
          commands:
            - launchApp:
                clearState: true
            - runFlow: open_signup_screen.yaml
      - runFlow:
          when:
            notVisible: "Sign up with Google"
          commands:
            - launchApp:
                clearState: true
            - runFlow: open_signup_screen.yaml
- extendedWaitUntil:
    visible: "Sign up with Google"
    timeout: 20000
- runFlow: ../../common/subflows/assert_signup_options_screen.yaml
