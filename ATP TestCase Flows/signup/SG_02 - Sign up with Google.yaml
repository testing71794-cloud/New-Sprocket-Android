# ATP Test Case ID: SG_02
# HP Sprocket — tap Sign up with Google
appId: com.hp.impulse.sprocket
name: "SG_02 - Sign up with Google"
---
- launchApp:
    clearState: true
- runFlow: subflows/open_signup_screen.yaml
- tapOn: "Sign up with Google"
- waitForAnimationToEnd:
    timeout: 5000
- runFlow: ../login/subflows/complete_google_sign_in.yaml
- runFlow:
    when:
      visible: "I agree"
    commands:
      - tapOn: "I agree"
- runFlow:
    when:
      visible: "Google services: Back up your device"
    commands:
      - tapOn: "Don't back up"
- extendedWaitUntil:
    visible: "Welcome,\nC Plus A Dev :)"
    timeout: 20000
