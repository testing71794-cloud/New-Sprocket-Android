# ATP Test Case ID: ON_04
# Complete carousel via Get Started — or Sign up when carousel is skipped.
appId: com.hp.impulse.sprocket
name: "ON_04 - Complete onboarding via Get Started"
---
- launchApp:
    clearState: true
- runFlow: ../common/subflows/wait_after_cold_launch.yaml
- runFlow:
    when:
      visible: "Welcome to the new Sprocket!"
    commands:
      - runFlow: ../common/subflows/advance_sprocket_carousel.yaml
      - swipe:
          direction: LEFT
      - extendedWaitUntil:
          visible: "Get Started!"
          timeout: 8000
      - assertVisible: "Unleash Your Creativity"
      - tapOn: "Get Started!"
      - waitForAnimationToEnd:
          timeout: 5000
- extendedWaitUntil:
    visible: "Sign up"
    timeout: 15000
- assertVisible: "Sign up"
