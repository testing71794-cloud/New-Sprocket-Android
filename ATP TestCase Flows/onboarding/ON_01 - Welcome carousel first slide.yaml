# ATP Test Case ID: ON_01
# Excel: Sp_03 | Welcome — Sense copy is correct on current builds.
# Docs: https://docs.maestro.dev/
appId: com.caglobal.hp.sprocket
name: "ON_01 - Welcome carousel first slide"
tags:
  - onboarding
  - atp-excel
---
- launchApp:
    clearState: true
- runFlow: ../common/subflows/wait_after_cold_launch.yaml
- runFlow:
    when:
      visible: ".*(?i)Welcome to Sprocket Sense!.*"
    commands:
      - assertVisible: ".*(?i)Welcome to Sprocket Sense!.*"
      - assertVisible: ".*(?i)Discover an all-new experience with more ways to print, create, and personalize\\.?.*"
      - assertVisible: ".*(?i)Swipe to continue\\.?.*"
- runFlow:
    when:
      visible: "Welcome to the new Sprocket!"
      notVisible: ".*(?i)Welcome to Sprocket Sense!.*"
    commands:
      - assertVisible: "Welcome to the new Sprocket!"
      - assertVisible: "Enjoy the revamped Sprocket experience with intuitive navigation."
      - assertVisible: "Swipe to continue."
- runFlow:
    when:
      visible: ".*(?i)^Sign up$"
      notVisible: ".*(?i)(Welcome to Sprocket Sense|Welcome to the new Sprocket|Swipe to continue).*"
    commands:
      - assertVisible: ".*(?i)^Sign up$"
      - assertVisible: ".*(?i)(I.ll do it later|Sign Up Later).*"
