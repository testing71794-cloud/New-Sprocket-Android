# ATP Test Case ID: ON_02
# AI Editing carousel slide — skipped when build opens Sign up directly.
appId: com.hp.impulse.sprocket
name: "ON_02 - AI Editing carousel slide"
---
- launchApp:
    clearState: true
- runFlow: ../common/subflows/wait_after_cold_launch.yaml
- runFlow:
    when:
      visible: "Welcome to the new Sprocket!"
    commands:
      - swipe:
          direction: LEFT
      - extendedWaitUntil:
          visible: "AI Editing & Generation"
          timeout: 8000
      - assertVisible: "With powerful AI tools, what you can create and print is only limited by your imagination."
      - assertVisible: "Swipe to continue."
- runFlow:
    when:
      visible: "Sign up"
    commands:
      - assertVisible: "Sign up"
