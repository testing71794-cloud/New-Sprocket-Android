# ATP: QUICK PRINT_08 (c) | Facebook Cancel Unlink
# Cancel closes popup and stays signed in.
# See: https://docs.maestro.dev/
appId: com.hp.impulse.sprocket
name: "QP_008c - Cancel unlink stays signed in"
tags:
  - quick-print
  - atp-excel
  - negative
---
- launchApp:
    clearState: true
- runFlow: subflows/reach_facebook_signed_in.yaml
- runFlow: subflows/open_facebook_overflow.yaml
- tapOn: ".*(?i)Unlink.*"
- extendedWaitUntil:
    visible: "Cancel"
    timeout: 8000
- tapOn: "Cancel"
- waitForAnimationToEnd:
    timeout: 2000
- assertNotVisible: ".*(?i)Are you sure you want to sign out.*"
- assertVisible: ".*(?i)Facebook.*"
