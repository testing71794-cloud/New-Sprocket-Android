# ATP Test Case ID: QP_013
# Matrix: Selection | Verify numbering updates after deselection
# Expected: Remaining photos are renumbered after one item is deselected.
appId: com.hp.impulse.sprocket
name: "QP_013 - Verify numbering updates after deselection"
tags:
  - quick-print
  - matrix
  - selection
---
- launchApp:
    clearState: true
- runFlow: subflows/reach_quick_print_gallery.yaml
- runFlow: subflows/enter_select_mode.yaml
- assertVisible: ".*Selected.*"
- tapOn:
    point: "50%,28%"
- waitForAnimationToEnd:
    timeout: 1000
- assertVisible: "2"
- assertVisible: ".*Selected.*"
- tapOn:
    point: "15%,28%"
- waitForAnimationToEnd:
    timeout: 1500
- assertVisible: "1"
- assertVisible: ".*Selected.*"
- assertVisible: "Print Preview"
