# ATP: QUICK PRINT_07 (a) | Facebook Gallery
# Facebook login → album list (Photos / Mobile uploads). Overflow is an icon, not text.
# See: https://docs.maestro.dev/
appId: com.hp.impulse.sprocket
name: "QP_007a - Facebook Gallery folders after login"
tags:
  - quick-print
  - atp-excel
  - positive
---
- launchApp:
    clearState: true
- runFlow: subflows/reach_facebook_signed_in.yaml
- assertVisible: ".*(?i)Facebook.*"
- assertVisible: ".*(?i)(Photos|Mobile uploads|album).*"
