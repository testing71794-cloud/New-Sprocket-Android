# ATP: QUICK PRINT_006 (d) | Gallery - Unselect Photos
# Unselect all → 0 Photos Selected; Print Preview disabled (do not open preview / print).
# See: https://docs.maestro.dev/
appId: com.hp.impulse.sprocket
name: "QP_006d - Unselect all photos and videos"
tags:
  - quick-print
  - atp-excel
  - positive
---
- launchApp:
    clearState: true
- runFlow: subflows/reach_gallery_allow_all.yaml
- runFlow: subflows/enter_select_mode.yaml
- tapOn:
    point: "50%,28%"
- waitForAnimationToEnd:
    timeout: 1000
- tapOn:
    point: "80%,28%"
- waitForAnimationToEnd:
    timeout: 1000
- assertVisible: ".*Selected.*"
- tapOn:
    point: "15%,28%"
- waitForAnimationToEnd:
    timeout: 800
- tapOn:
    point: "50%,28%"
- waitForAnimationToEnd:
    timeout: 800
- tapOn:
    point: "80%,28%"
- waitForAnimationToEnd:
    timeout: 1500
- assertVisible: ".*(?i)0 Photos Selected.*"
- assertVisible: "Print Preview"
