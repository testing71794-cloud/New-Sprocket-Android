# ATP: QUICK PRINT_003 (d) | Gallery Permission
# Don't allow → Open Settings → grant photos → return to app.
# See: https://docs.maestro.dev/
appId: com.hp.impulse.sprocket
name: "QP_003d - Open Settings grant permission"
tags:
  - quick-print
  - atp-excel
  - negative
---
- launchApp:
    clearState: true
    permissions:
      all: deny
- runFlow: subflows/reach_home_keep_photos.yaml
- runFlow: subflows/revoke_photos_if_needed.yaml
- runFlow: subflows/tap_quick_print.yaml
- extendedWaitUntil:
    visible: ".*(?i)(photos and videos|Don't allow).*"
    timeout: 15000
- runFlow: subflows/deny_photos_permission.yaml
- waitForAnimationToEnd:
    timeout: 4000
- assertVisible: ".*(?i)Open Settings.*"
- runFlow: subflows/grant_photos_from_open_settings.yaml
- runFlow:
    when:
      visible: "(?i)Quick Print.*"
    commands:
      - tapOn: "(?i)Quick Print.*"
      - waitForAnimationToEnd:
          timeout: 3000
      - runFlow: subflows/allow_photos_all_and_os.yaml
- extendedWaitUntil:
    visible: ".*(?i)(Recent|Open Settings|photos and videos).*"
    timeout: 15000
- assertVisible: ".*(?i)(Recent|Open Settings|photos and videos).*"
