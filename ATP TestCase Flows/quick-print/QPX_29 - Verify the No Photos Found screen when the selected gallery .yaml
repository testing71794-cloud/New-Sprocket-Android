# ATP Test Case ID: QPX_29
# Excel: QUICK PRINT 29 | Module: Gallery - No Photos Found
# Verify the No Photos Found screen when the selected gallery folder does not contain any photos.
# Expected: When a folder contains no photos, the application displays the No Photos Found illustration and message. When the user selects another folder that contains photos, the message disappears and the photo thumbnails are displayed correctly.
appId: com.hp.impulse.sprocket
name: "QPX_29 - Verify the No Photos Found screen when the selected gallery "
tags:
  - quick-print
  - atp-excel
---
- runFlow: subflows/reach_excel_screen.yaml
- assertVisible:
    text: ".*(?i)(Create|Collage Maker|Quick Print|Printer|Settings|Recent|Welcome|Sign up).*"
    optional: true
