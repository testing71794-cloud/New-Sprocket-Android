# ATP Test Case ID: QP_047
# Matrix: Empty State | Open gallery with no local photos
# Expected: No Photos screen when selected local folder is empty (device-dependent).
appId: com.hp.impulse.sprocket
name: "QP_047 - Open gallery with no local photos"
tags:
  - quick-print
  - matrix
  - empty-state
---
- launchApp:
    clearState: true
- runFlow: subflows/reach_quick_print_gallery.yaml
- runFlow: subflows/open_select_gallery.yaml
- runFlow: subflows/open_device_album.yaml
- assertVisible:
    text: ".*(?i)No photos found\\.?"
    optional: true
- assertVisible:
    text: ".*(?i)No Photos.*"
    optional: true
- assertVisible:
    text: "(?i)(Camera|Pictures|Movies|Screenshots|Recent).*"
- assertVisible: ".*Create.*"
