# ATP: QUICK PRINT_006 (e) | Gallery - Maximum Selection Limit
# Verify the maximum selection limit of 10 photos.
# 11th tap → "Maximum of 10 photos allowed."; count stays 10.
# See: https://docs.maestro.dev/reference/commands-available/launchapp
# See: https://docs.maestro.dev/reference/commands-available/tapon
# See: https://docs.maestro.dev/reference/commands-available/waitforanimationtoend
# See: https://docs.maestro.dev/reference/commands-available/extendedwaituntil
# See: https://docs.maestro.dev/reference/commands-available/asserttrue
# See: https://docs.maestro.dev/reference/commands-available/runscript
# See: https://docs.maestro.dev/maestro-flows/javascript/make-http-requests
# See: https://docs.maestro.dev/maestro-flows/flow-control-and-logic/conditions
# See: https://docs.maestro.dev/maestro-flows/flow-control-and-logic/nested-flows
appId: com.caglobal.hp.sprocket
name: "QP_006e - Maximum selection limit of 10"
tags:
  - quick-print
  - atp-excel
  - negative
---
- runFlow: subflows/ensure_quick_print_gallery.yaml
- runFlow: subflows/enter_select_mode.yaml
- runScript:
    file: subflows/select_until.js
- assertVisible: ".*(?i)10 Photos Selected.*"
- evalScript: ${output.qpOcrOk = '0'}
- runScript:
    file: subflows/tap_max_limit.js
    env:
      OCR_NEEDLE: "maximum of 10 photos allowed,maximum of 10,10 photos allowed"
      OCR_SECONDS: "3.5"
- assertTrue:
    condition: ${output.qpOcrOk == '1'}
    label: Maximum of 10 photos allowed toast
- assertVisible: ".*(?i)10 Photos Selected.*"
- assertVisible: "Print Preview"

