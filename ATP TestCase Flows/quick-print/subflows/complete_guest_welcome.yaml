# 3.0.2871+ after I'll do it later: Welcome → Explore → privacy → data → notifications.
# Legacy builds skip this and already show Quick Print.
# See: https://docs.maestro.dev/reference/commands-available/tapon
# See: https://docs.maestro.dev/reference/commands-available/extendedwaituntil
# See: https://docs.maestro.dev/maestro-flows/flow-control-and-logic/conditions
appId: com.caglobal.hp.sprocket
---
- runFlow:
    when:
      visible: ".*(?i)(I.ll do it later|Sign Up Later).*"
    commands:
      - tapOn: ".*(?i)(I.ll do it later|Sign Up Later).*"
      - waitForAnimationToEnd:
          timeout: 3000
      - runFlow: ../../common/subflows/ensure_sprocket_foreground.yaml
      - extendedWaitUntil:
          notVisible: ".*(?i)(I.ll do it later|Sign Up Later).*"
          timeout: 15000
- runFlow:
    when:
      visible: ".*(?i)explore sprocket.*"
    commands:
      - tapOn: ".*(?i)explore sprocket.*"
- runFlow:
    when:
      visible: ".*(?i)^Get Started$"
    commands:
      - tapOn: ".*(?i)^Get Started$"
- runFlow:
    when:
      visible: ".*(?i)(Help us improve|Automatically collect).*"
    commands:
      - tapOn: ".*(?i)^Continue$"
- runFlow:
    when:
      visible: ".*(?i)Yes, I.?m Sure.*"
    commands:
      - tapOn: ".*(?i)Yes, I.?m Sure.*"
# This device blocks pm grant — auto-allow via UI taps (do not Don't allow).
- runFlow: ../../common/subflows/grant_all_permissions_via_ui.yaml
- runFlow: ../../common/subflows/dismiss_rate_app_if_visible.yaml
