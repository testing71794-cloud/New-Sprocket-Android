# Select Mode → Print Preview → Print (printer must already be connected).
# See: https://docs.maestro.dev/
appId: com.caglobal.hp.sprocket
---
- assertVisible: "Print Preview"
- tapOn: "Print Preview"
- waitForAnimationToEnd:
    timeout: 800
- extendedWaitUntil:
    visible: ".*(?i)(^Print$|Copies|Print Preview).*"
    timeout: 20000
- runFlow: ensure_printer_on_print_preview.yaml
- runFlow: tap_print_and_assert_complete.yaml
