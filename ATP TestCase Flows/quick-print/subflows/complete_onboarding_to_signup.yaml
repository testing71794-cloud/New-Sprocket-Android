# QP TCs — optional carousel → Sign up. Wait for the screen, not a fixed delay.
# See: https://docs.maestro.dev/reference/commands-available/extendedwaituntil
appId: com.hp.impulse.sprocket
---
- runFlow: wait_after_cold_launch_fast.yaml
- extendedWaitUntil:
    visible: ".*(?i)(Sign up|I already have (an )?account|I.ll do it later|Sign Up Later|Get Started!|Welcome to the new Sprocket).*"
    timeout: 20000
- runFlow: ../../common/subflows/complete_sprocket_carousel_if_visible.yaml
- extendedWaitUntil:
    visible: ".*(?i)(Sign up|I already have (an )?account|I.ll do it later|Sign Up Later).*"
    timeout: 20000
- assertVisible: ".*(?i)(I.ll do it later|Sign Up Later|I already have (an )?account).*"
