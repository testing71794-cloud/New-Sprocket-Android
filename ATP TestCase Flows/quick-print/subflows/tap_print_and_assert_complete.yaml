# After printer connection is ready (CTA = Print), tap Print and wait for Print Complete.
# See: https://docs.maestro.dev/api-reference/commands/extendedwaituntil
# See: https://docs.maestro.dev/maestro-flows/flow-control-and-logic/conditions
# See: https://docs.maestro.dev/api-reference/commands/tapon
appId: com.caglobal.hp.sprocket
---
# Resolve Reconnect / Add Printer → Sense 5D:6C until Print CTA is ready
- runFlow: resolve_print_preview_printer_cta.yaml
# Connection established successfully → try to print
- extendedWaitUntil:
    visible: ".*(?i)^Print$"
    timeout: 60000
- assertVisible: ".*(?i)^Print$"
- tapOn: ".*(?i)^Print$"
- waitForAnimationToEnd:
    timeout: 3000
- runFlow: ../../common/subflows/dismiss_rate_app_if_visible.yaml
- runFlow:
    when:
      visible: "Allow"
    commands:
      - tapOn: "Allow"
      - waitForAnimationToEnd:
          timeout: 2000
# If still on Print Preview with Print, tap again
- runFlow:
    when:
      visible: ".*(?i)^Print$"
      notVisible: ".*(?i)(Printing|Print Complete|Sending).*"
    commands:
      - tapOn: ".*(?i)^Print$"
      - waitForAnimationToEnd:
          timeout: 2000
- runFlow:
    when:
      visible: ".*(?i)You are out of paper.*"
    commands:
      - tapOn: ".*(?i)(Ok|OK|Dismiss).*"
- extendedWaitUntil:
    visible: ".*(?i)(Printing|Print Complete|Sending|Outstanding).*"
    timeout: 120000
- runFlow:
    when:
      visible: ".*(?i)Printing.*"
      notVisible: ".*(?i)Print Complete.*"
    commands:
      - extendedWaitUntil:
          visible: ".*(?i)(Print Complete|Done).*"
          timeout: 420000
- extendedWaitUntil:
    visible: ".*(?i)(Print Complete|Done).*"
    timeout: 120000
- runFlow:
    when:
      visible: ".*(?i)^Done$"
    commands:
      - tapOn: ".*(?i)^Done$"
      - waitForAnimationToEnd:
          timeout: 3000
