# Open Newest / Oldest sort menu (top-right icon). Do not require "Dismiss menu".
# See: https://docs.maestro.dev/
appId: com.hp.impulse.sprocket
---
- tapOn:
    point: "93%,10%"
- waitForAnimationToEnd:
    timeout: 2500
- runFlow:
    when:
      notVisible: ".*(?i)(Newest|Oldest).*"
    commands:
      - tapOn:
          point: "90%,10%"
      - waitForAnimationToEnd:
          timeout: 2500
- extendedWaitUntil:
    visible: ".*(?i)(Newest|Oldest).*"
    timeout: 8000
