appId: com.hp.impulse.sprocket
---
# Open Select Gallery (legacy Recent chip) or already on Gallery/Facebook tabs.
# See: https://docs.maestro.dev/reference/commands-available/tapon
# See: https://docs.maestro.dev/maestro-flows/flow-control-and-logic/conditions
- runFlow:
    when:
      visible: ".*(?i)Recent.*"
      notVisible: ".*(?i)^Facebook$"
    commands:
      - tapOn: ".*(?i)Recent.*"
      - waitForAnimationToEnd:
          timeout: 800
- extendedWaitUntil:
    visible: ".*(?i)Facebook.*"
    timeout: 10000
- assertVisible: ".*(?i)Facebook.*"
- assertVisible: ".*(?i)(Select Gallery|Gallery|Recent|^All$).*"
