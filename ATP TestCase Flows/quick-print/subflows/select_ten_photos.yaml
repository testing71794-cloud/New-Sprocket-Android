# Fill Select Mode to "10 Photos Selected" without keeping videos (they count toward the cap).
# First-page lattice only. Do not Maestro-swipe here: video thumbnails never settle.
# See: https://docs.maestro.dev/reference/commands-available/tapon
# See: https://docs.maestro.dev/maestro-flows/flow-control-and-logic/conditions
appId: com.hp.impulse.sprocket
---
- runFlow:
    when:
      visible: ".*(?i)\\d+\\s*Videos? Selected.*"
    commands:
      - tapOn:
          point: "18%,24%"
          waitToSettleTimeoutMs: 0
- evalScript: ${output.qpPoint = '50%,26%'}
- runFlow: tap_photo_cell.yaml
- evalScript: ${output.qpPoint = '83%,26%'}
- runFlow: tap_photo_cell.yaml
- evalScript: ${output.qpPoint = '17%,40%'}
- runFlow: tap_photo_cell.yaml
- evalScript: ${output.qpPoint = '50%,40%'}
- runFlow: tap_photo_cell.yaml
- evalScript: ${output.qpPoint = '83%,40%'}
- runFlow: tap_photo_cell.yaml
- evalScript: ${output.qpPoint = '17%,54%'}
- runFlow: tap_photo_cell.yaml
- evalScript: ${output.qpPoint = '50%,54%'}
- runFlow: tap_photo_cell.yaml
- evalScript: ${output.qpPoint = '83%,54%'}
- runFlow: tap_photo_cell.yaml
- evalScript: ${output.qpPoint = '17%,66%'}
- runFlow: tap_photo_cell.yaml
- evalScript: ${output.qpPoint = '50%,66%'}
- runFlow: tap_photo_cell.yaml
- evalScript: ${output.qpPoint = '83%,66%'}
- runFlow: tap_photo_cell.yaml
