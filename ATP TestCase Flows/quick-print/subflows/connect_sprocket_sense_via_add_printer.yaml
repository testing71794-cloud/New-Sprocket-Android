# Add Printer CTA path: Skip to Connection → HP Sprocket Sense (5D:6C).
# See: https://docs.maestro.dev/maestro-flows/flow-control-and-logic/conditions
# See: https://docs.maestro.dev/reference/commands-available/extendedwaituntil
appId: com.caglobal.hp.sprocket
---
- runFlow: ../../common/subflows/dismiss_rate_app_if_visible.yaml
- runFlow: ../../printing/subflows/dismiss_optional_firmware_update.yaml
- extendedWaitUntil:
    visible: ".*(?i)(Skip to Connection|Set Up My Printer|Searching for Printers).*"
    timeout: 20000
- runFlow:
    when:
      visible: ".*(?i)Skip to Connection.*"
    commands:
      - tapOn: ".*(?i)Skip to Connection.*"
      - waitForAnimationToEnd:
          timeout: 2000
- runFlow: ../../common/subflows/grant_all_permissions_via_ui.yaml
- runFlow:
    when:
      visible: ".*(?i)Enable Bluetooth.*"
    commands:
      - tapOn: ".*(?i)Enable Bluetooth.*"
      - waitForAnimationToEnd:
          timeout: 1500
- repeat:
    times: 3
    commands:
      - runFlow:
          when:
            visible: ".*(?i)No Printers Found.*"
          commands:
            - tapOn: ".*(?i)Try Again.*"
            - waitForAnimationToEnd:
                timeout: 8000
- scrollUntilVisible:
    element: ".*(?i)(HP Sprocket Sense|5D:6C|5D-6C).*"
    direction: DOWN
    timeout: 90000
    visibilityPercentage: 40
    centerElement: true
- tapOn: ".*(?i)(HP Sprocket Sense.*5D[:\\-]6C|5D[:\\-]6C|HP Sprocket Sense).*"
- waitForAnimationToEnd:
    timeout: 3000
- runFlow:
    when:
      visible: ".*(?i)^Pair$"
    commands:
      - tapOn: ".*(?i)^Pair$"
      - waitForAnimationToEnd:
          timeout: 8000
- runFlow:
    when:
      visible: "Allow"
    commands:
      - tapOn: "Allow"
      - waitForAnimationToEnd:
          timeout: 3000
- repeat:
    times: 6
    commands:
      - runFlow:
          when:
            visible: ".*(?i)^Next$"
          commands:
            - tapOn: ".*(?i)^Next$"
            - waitForAnimationToEnd:
                timeout: 800
      - runFlow:
          when:
            visible: ".*(?i)(Finish Connection|Finish Setup).*"
          commands:
            - tapOn: ".*(?i)(Finish Connection|Finish Setup).*"
            - waitForAnimationToEnd:
                timeout: 2000
- runFlow: ../../printing/subflows/dismiss_optional_firmware_update.yaml
- runFlow:
    when:
      visible: ".*(?i)^Done$"
    commands:
      - tapOn: ".*(?i)^Done$"
      - waitForAnimationToEnd:
          timeout: 2000
- repeat:
    times: 4
    commands:
      - runFlow:
          when:
            visible: ".*(?i)(Searching for Printers|Skip to Connection|Set Up My Printer).*"
            notVisible: ".*(?i)(^Print$|Copies|Reconnect Printer|Quick Print).*"
          commands:
            - pressKey: back
            - waitForAnimationToEnd:
                timeout: 1500
