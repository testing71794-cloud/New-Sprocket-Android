- tapOn:
    text: ".*(?i)Don.?t [Aa]llow.*"
    optional: true
- tapOn:
    text: ".*(?i)Don.?t [Aa]llow.*"
    optional: true
- tapOn:
    text: ".*(?i)^Deny$"
