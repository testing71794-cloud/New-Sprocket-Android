appId: com.hp.impulse.sprocket
---
# Continue without Logging In → Create home (Quick Print tile).
# Current build label: "I already have account" (no "an").
- tapOn: ".*(?i)I already have (an )?account.*"
- waitForAnimationToEnd:
    timeout: 3000
- extendedWaitUntil:
    visible: ".*(?i)Continue without Logging In.*"
    timeout: 15000
- tapOn: ".*(?i)Continue without Logging In.*"
- waitForAnimationToEnd:
    timeout: 5000
- runFlow: ../../common/subflows/accept_terms_if_visible.yaml
- runFlow: ../../common/subflows/reach_kodak_coachmark_onboarding.yaml
- runFlow:
    when:
      visible: "Skip"
    commands:
      - tapOn: "Skip"
      - waitForAnimationToEnd:
          timeout: 2000
- runFlow: ../../permission/subflows/allow_all_runtime_permissions.yaml
- runFlow: ../../gallery/subflows/dismiss_gallery_coachmark_if_visible.yaml
- waitForAnimationToEnd:
    timeout: 3000
- runFlow:
    when:
      visible: ".*Create.*"
    commands:
      - tapOn: ".*Create.*"
      - waitForAnimationToEnd:
          timeout: 2000
- runFlow:
    when:
      visible: ".*(?i)Quick Print.*"
    commands:
      - swipe:
          direction: DOWN
          duration: 400
- extendedWaitUntil:
    visible: ".*(?i)Quick Print.*"
    timeout: 15000
- assertVisible: ".*(?i)Quick Print.*"
- assertVisible:
    text: ".*(?i)(Print photos from your gallery|gallery).*"
    optional: true
