# Tap Quick Print from Create home. Does not handle the photos popup.
# See: https://docs.maestro.dev/reference/commands-available/extendedwaituntil
# See: https://docs.maestro.dev/reference/commands-available/tapon
appId: com.hp.impulse.sprocket
---
- runFlow:
    when:
      visible: "(?i)Quick Print.*"
    commands:
      - tapOn: "(?i)Quick Print.*"
- runFlow:
    when:
      notVisible: "(?i)Quick Print.*"
      visible: ".*(?i)(Allow all|Allow limited access|Open Settings|photos and videos).*"
    commands:
      - assertVisible: ".*(?i)(Allow all|Open Settings|photos and videos).*"
