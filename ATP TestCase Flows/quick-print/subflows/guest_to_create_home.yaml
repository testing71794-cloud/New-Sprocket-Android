# Sign-up → guest Create home. Wait after Sign Up Later so the next tap
# does not hit Create-hub tiles (Photobooth) during the transition.
# See: https://docs.maestro.dev/reference/commands-available/tapon
# See: https://docs.maestro.dev/reference/commands-available/extendedwaituntil
# See: https://docs.maestro.dev/maestro-flows/flow-control-and-logic/conditions
appId: com.hp.impulse.sprocket
---
- runFlow:
    when:
      visible: ".*(?i)(I.ll do it later|Sign Up Later).*"
    commands:
      - tapOn: ".*(?i)(I.ll do it later|Sign Up Later).*"
      - extendedWaitUntil:
          notVisible: ".*(?i)(I.ll do it later|Sign Up Later).*"
          timeout: 10000
- runFlow:
    when:
      visible: ".*(?i)I already have (an )?account.*"
      notVisible: "(?i)(Quick Print|Collage Maker).*"
    commands:
      - tapOn: ".*(?i)I already have (an )?account.*"
- runFlow:
    when:
      visible: ".*(?i)Continue without Logging In.*"
    commands:
      - tapOn: ".*(?i)Continue without Logging In.*"
- runFlow: ../../common/subflows/accept_terms_if_visible.yaml
- runFlow:
    when:
      visible: "Skip"
    commands:
      - tapOn: "Skip"
- runFlow: dismiss_runtime_fast.yaml
- runFlow: ../../gallery/subflows/dismiss_gallery_coachmark_if_visible.yaml
- runFlow:
    when:
      visible: "(?i)^Photobooth$"
      notVisible: "(?i)Quick Print.*"
    commands:
      - tapOn:
          point: "7%,10%"
- runFlow:
    when:
      visible: ".*(?i)^Create$"
    commands:
      - tapOn: ".*(?i)^Create$"
- extendedWaitUntil:
    visible: "(?i)Quick Print.*"
    timeout: 20000
- assertVisible: "(?i)Quick Print.*"
