appId: com.hp.impulse.sprocket
---
# Open Quick Print from Create home; allow photo access when prompted.
# Prefer reach_gallery_allow_all.yaml for Excel-aligned tests.
# Real UI: folder chip is "Recent" (content-desc), date headers, bottom Create tab.
- extendedWaitUntil:
    visible: "(?i)Quick Print.*"
    timeout: 20000
- tapOn: "(?i)Quick Print.*"
- waitForAnimationToEnd:
    timeout: 800
- runFlow: ../../permission/subflows/allow_photos_all_permission.yaml
- tapOn:
    text: "Allow all"
    optional: true
- tapOn:
    text: "Allow"
    optional: true
- waitForAnimationToEnd:
    timeout: 800
- extendedWaitUntil:
    visible: ".*(?i)(Recent|Photos|^All$|Select).*"
    timeout: 15000
- assertVisible: ".*(?i)(Recent|Photos|^All$|Select).*"
