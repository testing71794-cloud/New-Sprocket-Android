# ATP: QUICK PRINT_003 (c) | Gallery Permission
# Don't allow → Open Settings → enable Photos → Gallery shows images.
# See: https://docs.maestro.dev/reference/commands-available/launchapp
# See: https://docs.maestro.dev/reference/commands-available/extendedwaituntil
# See: https://docs.maestro.dev/reference/commands-available/assertvisible
# See: https://docs.maestro.dev/reference/commands-available/assertnotvisible
appId: com.hp.impulse.sprocket
name: "QP_003c - Dont allow restricts Gallery"
tags:
  - quick-print
  - atp-excel
  - negative
---
- launchApp:
    clearState: true
    permissions:
      all: deny
- runFlow: subflows/reach_home_keep_photos.yaml
- runFlow: subflows/revoke_photos_if_needed.yaml
- runFlow: subflows/tap_quick_print.yaml
- extendedWaitUntil:
    visible: ".*(?i)(photos and videos|Don.?t allow|Allow all).*"
    timeout: 15000
- runFlow: subflows/deny_photos_permission.yaml
- extendedWaitUntil:
    visible: ".*(?i)Open Settings.*"
    timeout: 10000
- assertVisible: ".*(?i)Open Settings.*"
- assertNotVisible: ".*(?i)^Recent$"
- runFlow: subflows/grant_photos_from_open_settings.yaml
- extendedWaitUntil:
    visible: "Recent"
    timeout: 12000
- assertVisible: "Recent"
- assertVisible: ".*Create.*"
- assertNotVisible: ".*(?i)No photos found.*"
- assertNotVisible: ".*(?i)Open Settings.*"
