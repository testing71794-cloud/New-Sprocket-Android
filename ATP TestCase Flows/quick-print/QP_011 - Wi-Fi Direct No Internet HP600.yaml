# ATP: QUICK PRINT_11 | Facebook Gallery - Wi-Fi Direct
# HP600 via Wi-Fi Direct → Facebook → No Internet (mobile data) popup → OK.
# Requires HP 600 nearby. See: https://docs.maestro.dev/
appId: com.hp.impulse.sprocket
name: "QP_011 - Wi-Fi Direct No Internet HP600"
tags:
  - quick-print
  - atp-excel
  - negative
---
- launchApp:
    clearState: true
- runFlow: subflows/reach_home_keep_photos.yaml
- runFlow: subflows/connect_hp600_wifi_direct.yaml
- runFlow: subflows/tap_quick_print.yaml
- runFlow: subflows/allow_photos_all_and_os.yaml
- extendedWaitUntil:
    visible: ".*(?i)(Recent|Photos|^All$|Select).*"
    timeout: 15000
- runFlow: subflows/open_select_gallery.yaml
- tapOn: ".*Facebook.*"
- waitForAnimationToEnd:
    timeout: 800
- assertVisible: ".*(?i)No Internet.*"
- assertVisible: ".*(?i)Wi-Fi Direct.*"
- assertVisible: "OK"
- tapOn: "OK"
- waitForAnimationToEnd:
    timeout: 2000
- assertNotVisible: ".*(?i)When connected to printer via Wi-Fi Direct.*"
