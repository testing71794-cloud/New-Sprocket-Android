# ATP: QUICK PRINT_08 (b) | Facebook Sign Out
# Sign Out → back on Select Gallery.
# See: https://docs.maestro.dev/
appId: com.hp.impulse.sprocket
name: "QP_008b - Sign out from Facebook"
tags:
  - quick-print
  - atp-excel
  - positive
---
- launchApp:
    clearState: true
- runFlow: subflows/reach_facebook_signed_in.yaml
- runFlow: subflows/open_facebook_overflow.yaml
- tapOn: ".*(?i)Unlink.*"
- extendedWaitUntil:
    visible: ".*(?i)Sign Out.*"
    timeout: 8000
- tapOn: "Sign Out"
- waitForAnimationToEnd:
    timeout: 4000
- assertVisible: "Select Gallery"
- assertVisible: ".*Facebook.*"
