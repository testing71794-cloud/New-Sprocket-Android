# ATP Test Case ID: QP_037
# Matrix: Tag Search | Submit empty search
# Expected: Validation message displayed when search is submitted empty.
appId: com.hp.impulse.sprocket
name: "QP_037 - Submit empty search validation"
tags:
  - quick-print
  - matrix
  - tag-search
---
- launchApp:
    clearState: true
- runFlow: subflows/reach_facebook_album.yaml
- runFlow: subflows/open_tag_search_screen.yaml
- runFlow:
    when:
      visible: "Done"
    commands:
      - tapOn: "Done"
- runFlow:
    when:
      visible: "Search"
    commands:
      - tapOn: "Search"
- waitForAnimationToEnd:
    timeout: 2000
- assertVisible:
    text: ".*(?i)(enter|required|empty|tag|search).*"
    optional: true
- assertVisible:
    text: ".*(?i)(Search|Tag|#).*"
    optional: true
