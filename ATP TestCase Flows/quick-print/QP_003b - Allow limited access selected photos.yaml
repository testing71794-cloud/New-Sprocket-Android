# ATP: QUICK PRINT_003 (b) | Gallery Permission
# Allow limited access → pick photos in the OS picker → those photos show in Gallery.
# See: https://docs.maestro.dev/reference/commands-available/launchapp
# See: https://docs.maestro.dev/reference/commands-available/extendedwaituntil
appId: com.hp.impulse.sprocket
name: "QP_003b - Allow limited access selected photos"
tags:
  - quick-print
  - atp-excel
  - positive
---
- launchApp:
    clearState: true
    permissions:
      all: deny
- runFlow: subflows/reach_home_keep_photos.yaml
- runFlow: subflows/revoke_photos_if_needed.yaml
- runFlow: subflows/tap_quick_print.yaml
- extendedWaitUntil:
    visible: ".*(?i)(photos and videos|Allow limited access).*"
    timeout: 20000
- tapOn: "Allow limited access"
- waitForAnimationToEnd:
    timeout: 3000
- runFlow:
    when:
      visible: ".*(?i)Allow limited access.*"
    commands:
      - tapOn: ".*(?i)Allow limited access.*"
      - waitForAnimationToEnd:
          timeout: 3000
- runFlow: subflows/pick_limited_access_photos.yaml
- runFlow: subflows/assert_limited_gallery_shows_photos.yaml
