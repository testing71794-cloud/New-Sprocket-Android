# ATP Test Case ID: PR_75
# Excel: Print Preview Screen 75 | Module: Print Queue
# Verify Print State Does Not Show Invalid or Conflicting Status
# Expected: The system must NOT display invalid, blank, or conflicting states. Only one valid status is shown at any time: In Queue / Printing / Completed / Paused. No UI corruption or mixed states should appear.
appId: com.hp.impulse.sprocket
name: "PR_75 - Verify Print State Does Not Show Invalid or Conflicting Stat"
tags:
  - printing
  - atp-excel
---
- runFlow: subflows/reach_module_screen.yaml
- assertVisible:
    text: ".*(?i)(Create|Collage Maker|Quick Print|Printer|Settings|Recent|Welcome|Sign up).*"
    optional: true
