# ATP Test Case ID: PR_72
# Excel: Print Preview Screen 72 | Module: Print Queue
# Verify Queue Skipping for Multiple Copies
# Expected: First copy shows "In Queue". Remaining copies skip UI queue screen and go directly to background processing while first print continues.
appId: com.hp.impulse.sprocket
name: "PR_72 - Verify Queue Skipping for Multiple Copies"
tags:
  - printing
  - atp-excel
---
- runFlow: subflows/reach_module_screen.yaml
- assertVisible:
    text: "In Queue"
    optional: true
- assertVisible:
    text: "Copies"
    optional: true
- assertVisible:
    text: "Skip"
    optional: true
