# Compose Print Preview: AI chip left of Add Printer (no preview_txt_edit id).
appId: com.caglobal.hp.sprocket
---
- runFlow:
    when:
      visible:
        id: ".*preview_txt_edit.*"
    commands:
      - tapOn:
          id: ".*preview_txt_edit.*"
- runFlow:
    when:
      notVisible:
        id: ".*preview_txt_edit.*"
    commands:
      - tapOn:
          point: "16%,85%"
