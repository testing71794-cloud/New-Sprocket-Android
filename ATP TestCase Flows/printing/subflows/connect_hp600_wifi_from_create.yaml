# HP600 setup uses the supplied CAGlobal test-network password.
appId: com.caglobal.hp.sprocket
---
- tapOn:
    text: "Printer\nTab 3 of 3"
    optional: true
- tapOn:
    point: "84%,90%"
- waitForAnimationToEnd:
    timeout: 2500
- runFlow:
    when:
      visible: ".*(?i)Add (a )?New Printer.*"
    commands:
      - tapOn: ".*(?i)Add (a )?New Printer.*"
- runFlow:
    when:
      visible: ".*(?i)Enable Bluetooth.*"
    commands:
      - tapOn: ".*(?i)Enable Bluetooth.*"
- runFlow: allow_bluetooth_enable_dialog.yaml
- extendedWaitUntil:
    visible: ".*(?i)(Skip to Connection|Searching for Printers).*"
    timeout: 15000
- runFlow:
    when:
      visible: ".*(?i)Skip to Connection.*"
    commands:
      - tapOn: ".*(?i)Skip to Connection.*"
- runFlow: ../../permission/subflows/allow_all_runtime_permissions.yaml
- runFlow:
    when:
      visible: ".*(?i)Enable Bluetooth.*"
    commands:
      - tapOn: ".*(?i)Enable Bluetooth.*"
      - waitForAnimationToEnd:
          timeout: 3000
- runFlow: allow_bluetooth_enable_dialog.yaml
- runFlow:
    when:
      visible: ".*(?i)Add (a )?New Printer.*"
    commands:
      - tapOn: ".*(?i)Add (a )?New Printer.*"
      - waitForAnimationToEnd:
          timeout: 2500
- runFlow:
    when:
      visible: ".*(?i)Skip to Connection.*"
    commands:
      - tapOn: ".*(?i)Skip to Connection.*"
      - waitForAnimationToEnd:
          timeout: 3000
- runFlow: ../../permission/subflows/allow_all_runtime_permissions.yaml
- repeat:
    times: 4
    commands:
      - runFlow:
          when:
            visible: ".*(?i)No Printers Found.*"
          commands:
            - tapOn: ".*(?i)Try Again.*"
            - waitForAnimationToEnd:
                timeout: 8000
- extendedWaitUntil:
    visible: ".*(?i)(HP.?600|Studio Plus).*"
    timeout: 120000
- repeat:
    times: 3
    commands:
      - runFlow:
          when:
            visible: ".*(?i)(HP.?600|Studio Plus).*"
          commands:
            - tapOn: ".*(?i)(HP.?600|Studio Plus).*"
            - waitForAnimationToEnd:
                timeout: 5000
- runFlow: dismiss_optional_firmware_update.yaml
- extendedWaitUntil:
    visible: ".*(?i)This Printer Uses Wi-Fi.*"
    timeout: 30000
- tapOn: ".*(?i)^Next$"
- runFlow:
    when:
      visible: ".*(?i)CAGlobal.*"
    commands:
      - tapOn: ".*(?i)CAGlobal.*"
- runFlow:
    when:
      visible: ".*(?i)(password|Enter the password).*"
    commands:
      - tapOn: ".*(?i)(password|Enter the password).*"
      - inputText: "Caglobal@127"
      - tapOn: ".*(?i)^Next$"
- runFlow: ../../permission/subflows/allow_all_runtime_permissions.yaml
- extendedWaitUntil:
    visible: ".*(?i)(Finish Connection|Finish Setup).*"
    timeout: 120000
- tapOn: ".*(?i)^(Finish Connection|Finish Setup)$"
- extendedWaitUntil:
    visible: ".*(?i)(Your Printers|Quick Print|Create).*"
    timeout: 30000
- tapOn:
    text: ".*(?i)^Create$"
    optional: true
- runFlow:
    when:
      notVisible: ".*(?i)Quick Print.*"
    commands:
      - tapOn:
          point: "50%,90%"
- waitForAnimationToEnd:
    timeout: 2500
