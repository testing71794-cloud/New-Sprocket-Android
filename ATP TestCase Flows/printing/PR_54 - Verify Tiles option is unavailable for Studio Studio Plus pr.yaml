# ATP Test Case ID: PR_54
# Excel: Print Preview Screen 54 | Module: Print Preview
# Verify Tiles option is unavailable for Studio / Studio Plus / Sprocket 3x4 printer
# Expected: Tiles tab or print attempt shows incompatible toast; app remains stable.
appId: com.hp.impulse.sprocket
name: "PR_54 - Verify Tiles option is unavailable for Studio Studio Plus pr"
tags:
  - printing
  - atp-excel
  - tiles-unsupported-printer
---
- runFlow: subflows/reach_module_screen.yaml
- runFlow:
    when:
      visible: ".*(?i)(Sprocket 3x4|Studio Plus|Sprocket Studio Plus|HP Sprocket Studio).*"
    commands:
      - runFlow: ../tile-print/subflows/assert_tiles_incompatible_on_print_attempt.yaml
- assertVisible:
    text: "Copies"
    optional: true
- assertVisible:
    text: "Printer"
    optional: true
