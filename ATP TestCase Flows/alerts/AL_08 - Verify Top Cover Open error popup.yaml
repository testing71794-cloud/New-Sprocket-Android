# ATP Test Case ID: AL_08
# Excel: Blockers Error Pop up Android   08 | Module: Cover
# Verify "Top Cover Open" error popup
# Expected: "Top Cover Open" popup is displayed on the Print Preview screen. The popup displays the bold title "Top Cover Open", followed by the message "Close the cover and try printing again." The popup includes an "OK" button at the bottom and a Clo
appId: com.hp.impulse.sprocket
name: "AL_08 - Verify Top Cover Open error popup"
tags:
  - alerts
  - atp-excel
---
- runFlow: subflows/reach_module_screen.yaml
- assertVisible:
    text: "Top Cover Open"
    optional: true
- assertVisible:
    text: "Close the cover and try printing again."
    optional: true
- assertVisible:
    text: "OK"
    optional: true
