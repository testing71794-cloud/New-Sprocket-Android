# ATP Test Case ID: AL_09
# Excel: Blockers Error Pop up Android    09 | Module: System
# Verify "System Error Occurred" error popup
# Expected: "System Error Occurred" popup is displayed on the Print Preview screen. The popup displays the bold title "System Error Occurred", followed by the message "Restart your printer and try printing again." The popup includes an "OK" button at t
appId: com.hp.impulse.sprocket
name: "AL_09 - Verify System Error Occurred error popup"
tags:
  - alerts
  - atp-excel
---
- runFlow: subflows/reach_module_screen.yaml
- assertVisible:
    text: "System Error Occurred"
    optional: true
- assertVisible:
    text: "Restart your printer and try printing again."
    optional: true
- assertVisible:
    text: "OK"
    optional: true
- assertVisible:
    text: "Printer"
    optional: true
