# ATP Test Case ID: AL_41
# Excel: Stoppers Error Pop up Ios   20 | Module: Print
# Verify "Print Error" popup
# Expected: "Print Error" popup is displayed . The popup displays the bold title "Print Error", followed by the message "Restart your Sprocket and try printing again." The popup includes an "OK" button at the bottom and a Close (X) icon in the top-righ
appId: com.hp.impulse.sprocket
name: "AL_41 - Verify Print Error popup"
tags:
  - alerts
  - atp-excel
---
- runFlow: subflows/reach_module_screen.yaml
- assertVisible:
    text: "Print Error"
    optional: true
- assertVisible:
    text: "Restart your Sprocket and try printing again."
    optional: true
- assertVisible:
    text: "OK"
    optional: true
