# ATP Test Case ID: AL_42
# Excel: Stoppers Error Pop up Ios  21 | Module: Temperature
# Verify "High Temperature" popup
# Expected: "High Temperature" popup is displayed. The popup displays the bold title "High Temperature", followed by the message "Printer overheated! Please wait a few minutes for the printer to cool down." Below the message, the text "Once cooled down
appId: com.hp.impulse.sprocket
name: "AL_42 - Verify High Temperature popup"
tags:
  - alerts
  - atp-excel
---
- runFlow: subflows/reach_module_screen.yaml
- assertVisible:
    text: "High Temperature"
    optional: true
- assertVisible:
    text: "Printer overheated! Please wait a few minutes for the printer to cool down."
    optional: true
- assertVisible:
    text: "Once cooled down, try printing again."
    optional: true
- assertVisible:
    text: "OK"
    optional: true
- assertVisible:
    text: "Printer"
    optional: true
