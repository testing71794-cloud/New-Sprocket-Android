# ATP Test Case ID: AL_04
# Excel: Blockers Error Pop up Android   04 | Module: Print Error
# Verify "Print Error" popup during printing
# Expected: "Print Error" popup is displayed on the Print Preview screen. The popup displays the bold title "Print Error", followed by the message "Restart your Sprocket and try printing again." The popup includes an "OK" button at the bottom and a Clo
appId: com.hp.impulse.sprocket
name: "AL_04 - Verify Print Error popup during printing"
tags:
  - alerts
  - atp-excel
---
- runFlow: subflows/reach_module_screen.yaml
- assertVisible:
    text: "Print Error"
    optional: true
- assertVisible:
    text: "Restart your Sprocket and try printing again."
    optional: true
- assertVisible:
    text: "OK"
    optional: true
