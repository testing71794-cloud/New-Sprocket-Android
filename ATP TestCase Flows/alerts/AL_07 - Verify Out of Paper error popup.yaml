# ATP Test Case ID: AL_07
# Excel: Blockers Error Pop up Android    07 | Module: Paper
# Verify "Out of Paper" error popup
# Expected: "Out of Paper" popup is displayed on the Print Preview screen. The popup displays the bold title "Out of Paper", followed by the message "Please load paper and try printing again." A TIP is displayed: "Load the colored card with each new pa
appId: com.hp.impulse.sprocket
name: "AL_07 - Verify Out of Paper error popup"
tags:
  - alerts
  - atp-excel
---
- runFlow: subflows/reach_module_screen.yaml
- assertVisible:
    text: "Out of Paper"
    optional: true
- assertVisible:
    text: "Please load paper and try printing again."
    optional: true
- assertVisible:
    text: "Load the colored card with each new pack of paper for best print quality."
    optional: true
- assertVisible:
    text: "OK"
    optional: true
