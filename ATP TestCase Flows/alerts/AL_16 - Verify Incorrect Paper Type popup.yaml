# ATP Test Case ID: AL_16
# Excel: Blockers Error Pop up Android  16 | Module: Paper
# Verify "Incorrect Paper Type" popup
# Expected: "Incorrect Paper Type" popup is displayed on the Print Preview screen. The popup displays the bold title "Incorrect Paper Type", followed by the message "Load HP branded paper and try again." The popup includes an "OK" button at the bottom 
appId: com.hp.impulse.sprocket
name: "AL_16 - Verify Incorrect Paper Type popup"
tags:
  - alerts
  - atp-excel
---
- runFlow: subflows/reach_module_screen.yaml
- assertVisible:
    text: "Incorrect Paper Type"
    optional: true
- assertVisible:
    text: "Load HP branded paper and try again."
    optional: true
- assertVisible:
    text: "OK"
    optional: true
