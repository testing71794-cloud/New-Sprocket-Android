# ATP Test Case ID: AL_02
# Excel: Blockers Error Pop up Android  02 | Module: Transmit Error
# Verify "Transmit Error" popup during printing
# Expected: A "Transmit Error" popup is displayed  with the bold title "Transmit Error",the Print Preview screen.  followed by the message "Data transmission error! Please try printing again." A TIP is displayed: "Make sure to keep the app open during 
appId: com.hp.impulse.sprocket
name: "AL_02 - Verify Transmit Error popup during printing"
tags:
  - alerts
  - atp-excel
---
- runFlow: subflows/reach_module_screen.yaml
- assertVisible:
    text: "Transmit Error"
    optional: true
- assertVisible:
    text: "Data transmission error! Please try printing again."
    optional: true
- assertVisible:
    text: "Make sure to keep the app open during printing."
    optional: true
- assertVisible:
    text: "OK"
    optional: true
- assertVisible:
    text: "Printer"
    optional: true
