# ATP Test Case ID: AL_01
# Excel: Blockers Error Pop up Android   01 | Module: Memory Error
# Verify "Memory Error" popup during printing
# Expected: A "Memory Error" popup is displayed on the Print Preview screen. The popup displays the bold title "Memory Error", followed by the message "Restart your Sprocket and try printing again." It includes an "OK" button at the bottom and a Close 
appId: com.hp.impulse.sprocket
name: "AL_01 - Verify Memory Error popup during printing"
tags:
  - alerts
  - atp-excel
---
- runFlow: subflows/reach_module_screen.yaml
- assertVisible:
    text: "Memory Error"
    optional: true
- assertVisible:
    text: "Restart your Sprocket and try printing again."
    optional: true
- assertVisible:
    text: "OK"
    optional: true
