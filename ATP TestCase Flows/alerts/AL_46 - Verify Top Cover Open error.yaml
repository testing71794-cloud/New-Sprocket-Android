# ATP Test Case ID: AL_46
# Excel: Stoppers Error Pop up Ios  25 | Module: Cover
# Verify "Top Cover Open" error
# Expected: "Top Cover Open" popup is displayed . The popup displays the bold title "Top Cover Open", followed by the message "Close the cover and try printing again." The popup includes an "OK" button at the bottom and a Close (X) icon in the top-righ
appId: com.hp.impulse.sprocket
name: "AL_46 - Verify Top Cover Open error"
tags:
  - alerts
  - atp-excel
---
- runFlow: subflows/reach_module_screen.yaml
- assertVisible:
    text: "Top Cover Open"
    optional: true
- assertVisible:
    text: "Close the cover and try printing again."
    optional: true
- assertVisible:
    text: "OK"
    optional: true
