# ATP Test Case ID: AL_39
# Excel: Stoppers Error Pop up Ios    18 | Module: Transmit
# Verify "Transmit Error" popup
# Expected: "Transmit Error" popup is displayed with the bold title "Transmit Error", followed by the message "Data transmission error! Please try printing again." A TIP is displayed: "Make sure to keep the app open during printing." The popup includes
appId: com.hp.impulse.sprocket
name: "AL_39 - Verify Transmit Error popup"
tags:
  - alerts
  - atp-excel
---
- runFlow: subflows/reach_module_screen.yaml
- assertVisible:
    text: "Transmit Error"
    optional: true
- assertVisible:
    text: "Data transmission error! Please try printing again."
    optional: true
- assertVisible:
    text: "Make sure to keep the app open during printing."
    optional: true
- assertVisible:
    text: "OK"
    optional: true
- assertVisible:
    text: "Printer"
    optional: true
