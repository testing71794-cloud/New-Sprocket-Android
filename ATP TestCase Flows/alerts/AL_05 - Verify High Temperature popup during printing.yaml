# ATP Test Case ID: AL_05
# Excel: Blockers Error Pop up Android   05 | Module: High Temperature
# Verify "High Temperature" popup during printing
# Expected: "High Temperature" popup is displayed on the Print Preview screen. The popup displays the bold title "High Temperature", followed by the message "Printer overheated! Please wait a few minutes for the printer to cool down." Below the message
appId: com.hp.impulse.sprocket
name: "AL_05 - Verify High Temperature popup during printing"
tags:
  - alerts
  - atp-excel
---
- runFlow: subflows/reach_module_screen.yaml
- assertVisible:
    text: "High Temperature"
    optional: true
- assertVisible:
    text: "Printer overheated! Please wait a few minutes for the printer to cool down."
    optional: true
- assertVisible:
    text: "Once cooled down, try printing again."
    optional: true
- assertVisible:
    text: "OK"
    optional: true
- assertVisible:
    text: "Printer"
    optional: true
