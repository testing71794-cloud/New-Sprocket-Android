# ATP Test Case ID: AL_11
# Excel: Blockers Error Pop up Android   11 | Module: Battery
# Verify "Battery Error" popup
# Expected: "Battery Error" popup is displayed on the Print Preview screen. The popup displays the bold title "Battery Error", followed by the message "Restart your printer and try printing again." The popup includes an "OK" button at the bottom and a 
appId: com.hp.impulse.sprocket
name: "AL_11 - Verify Battery Error popup"
tags:
  - alerts
  - atp-excel
---
- runFlow: subflows/reach_module_screen.yaml
- assertVisible:
    text: "Battery Error"
    optional: true
- assertVisible:
    text: "Restart your printer and try printing again."
    optional: true
- assertVisible:
    text: "OK"
    optional: true
- assertVisible:
    text: "Printer"
    optional: true
