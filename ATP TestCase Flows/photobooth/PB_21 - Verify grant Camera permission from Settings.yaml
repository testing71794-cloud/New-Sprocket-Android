# ATP Test Case ID: PB_21
# Excel: Photobooth 21 | Module: Photobooth- granting Camera permission
# Verify behavior after granting Camera permission from device settings.
# Expected: Denied screen gone; Photobooth Capture screen and live preview available.
appId: com.hp.impulse.sprocket
name: "PB_21 - Verify grant Camera permission from Settings"
tags:
  - photobooth
  - atp-excel
  - negative
---
- runFlow: subflows/excel_launch_to_home.yaml
- runFlow: subflows/open_photobooth.yaml
- runFlow: subflows/deny_camera.yaml
- extendedWaitUntil:
    visible: ".*(?i)Open Settings.*"
    timeout: 15000
- tapOn: ".*(?i)Open Settings.*"
- waitForAnimationToEnd:
    timeout: 4000
- setPermissions:
    permissions:
      camera: allow
- back
- launchApp:
    stopApp: false
- waitForAnimationToEnd:
    timeout: 4000
- runFlow: subflows/allow_camera_while_using.yaml
- extendedWaitUntil:
    visible: "(?i)Photobooth.*"
    timeout: 15000
- assertVisible: "(?i)Photobooth.*"
- runFlow: subflows/assert_photobooth_capture_ui.yaml
