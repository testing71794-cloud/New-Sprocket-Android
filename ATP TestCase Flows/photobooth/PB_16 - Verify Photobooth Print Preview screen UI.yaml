# ATP Test Case ID: PB_16
# Excel: Photobooth 16 | Module: Photobooth – Result Screen
# Verify the Print Preview screen UI for Photobooth mode.
# Expected: Collage preview, Back, Print, Save to Gallery, Share. Tiles is not displayed.
appId: com.hp.impulse.sprocket
name: "PB_16 - Verify Photobooth Print Preview screen UI"
tags:
  - photobooth
  - atp-excel
  - positive
---
- runFlow: subflows/reach_module_screen.yaml
- assertVisible: "(?i)Photobooth.*"
- runFlow: subflows/tap_capture.yaml
- runFlow: subflows/wait_print_preview.yaml
- assertVisible: "(?i)Copies.*"
- assertNotVisible: "Tiles"
