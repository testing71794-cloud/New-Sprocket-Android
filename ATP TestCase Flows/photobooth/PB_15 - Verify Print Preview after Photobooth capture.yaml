# ATP Test Case ID: PB_15
# Excel: Photobooth 15 | Module: Photobooth – Result Screen
# Verify navigation to Print Preview after completing the Photobooth capture sequence.
# Expected: Print Preview with 4-photo collage, Print, Copies default 1.
appId: com.caglobal.hp.sprocket
name: "PB_15 - Verify Print Preview after Photobooth capture"
tags:
  - photobooth
  - atp-excel
  - positive
---
- runFlow: subflows/ensure_photobooth_with_printer.yaml
- assertVisible: "(?i)Photobooth.*"
- runFlow: subflows/tap_capture.yaml
- runFlow: subflows/wait_print_preview.yaml
- assertVisible:
    text: "(?i)Copies.*"
- assertVisible:
    text: "1"
    optional: true
