# ATP Test Case ID: PB_10
# Excel: Photobooth 10 | Module: Photobooth – Capture process
# Verify that the Capture button changes to a Stop button after capture starts.
# Expected: Capture changes to Stop (square); Stop remains during sequence.
appId: com.hp.impulse.sprocket
name: "PB_10 - Verify Capture button changes to Stop"
tags:
  - photobooth
  - atp-excel
  - positive
---
- runFlow: subflows/reach_module_screen.yaml
- assertVisible: "(?i)Photobooth.*"
- runFlow: subflows/tap_capture.yaml
- extendedWaitUntil:
    visible: "3"
    timeout: 8000
- assertVisible: "(?i)Photobooth.*"
- runFlow: subflows/tap_stop.yaml
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible: "(?i)Photobooth.*"
