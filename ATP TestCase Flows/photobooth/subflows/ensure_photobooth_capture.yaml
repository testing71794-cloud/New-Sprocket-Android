# Reuse Photobooth capture when it is already open.
# Cold launch only when Create hub cannot be reached.
# https://docs.maestro.dev/maestro-flows/flow-control-and-logic/conditions
# https://docs.maestro.dev/reference/commands-available/presskey
appId: com.caglobal.hp.sprocket
---
- runFlow:
    when:
      visible: "(?i)Save as new photo.*"
    commands:
      - tapOn: ".*(?i)(Don.?t Save|Do Not Save).*"
      - waitForAnimationToEnd:
          timeout: 1500
- repeat:
    times: 3
    commands:
      - runFlow:
          when:
            visible: ".*(?i)(Print|Copies|Save to Gallery).*"
            notVisible: ".*(?i)(Collage Maker|Quick Print).*"
          commands:
            - tapOn:
                point: "7%,10%"
            - waitForAnimationToEnd:
                timeout: 1500
      - runFlow:
          when:
            visible: "(?i)Save as new photo.*"
          commands:
            - tapOn: ".*(?i)(Don.?t Save|Do Not Save).*"
            - waitForAnimationToEnd:
                timeout: 1500
- runFlow:
    when:
      visible: ".*(?i)(Collage Maker|Quick Print).*"
    commands:
      - runFlow: open_photobooth.yaml
- runFlow:
    when:
      notVisible: "(?i)Photobooth.*"
    commands:
      - runFlow: excel_launch_to_home.yaml
      - runFlow: open_photobooth.yaml
- runFlow: allow_camera_while_using.yaml
- extendedWaitUntil:
    visible: "(?i)Photobooth.*"
    timeout: 20000
- assertVisible: "(?i)Photobooth.*"
