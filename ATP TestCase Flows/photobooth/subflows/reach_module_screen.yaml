appId: com.hp.impulse.sprocket
---
# Excel Photobooth positive path: launch through Sign Up Later to Home, open Photobooth, allow camera.
- runFlow: excel_launch_to_home.yaml
- runFlow: open_photobooth.yaml
- runFlow: allow_camera_while_using.yaml
- extendedWaitUntil:
    visible: "(?i)Photobooth.*"
    timeout: 15000
- assertVisible: "(?i)Photobooth.*"
