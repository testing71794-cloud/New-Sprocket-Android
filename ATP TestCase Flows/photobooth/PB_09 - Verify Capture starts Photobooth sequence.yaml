# ATP Test Case ID: PB_09
# Excel: Photobooth 09 | Module: Photobooth – Capture process
# Verify that tapping the Capture button starts the Photobooth capture sequence.
# Expected: Capture starts; four photos; 3-second countdown; progress updates.
appId: com.hp.impulse.sprocket
name: "PB_09 - Verify Capture starts Photobooth sequence"
tags:
  - photobooth
  - atp-excel
  - positive
---
- runFlow: subflows/reach_module_screen.yaml
- assertVisible: "(?i)Photobooth.*"
- runFlow: subflows/tap_capture.yaml
- extendedWaitUntil:
    visible: "3"
    timeout: 8000
- assertVisible: "3"
- runFlow: subflows/wait_print_preview.yaml
