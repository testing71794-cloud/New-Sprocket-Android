# ATP Test Case ID: PB_03
# Excel: Photobooth 03 | Module: Photobooth
# Verify the functionality of the Back button on the Photobooth screen.
# Expected: User is navigated back to the Home/Dashboard screen.
appId: com.hp.impulse.sprocket
name: "PB_03 - Verify Back button on Photobooth screen"
tags:
  - photobooth
  - atp-excel
  - positive
---
- runFlow: subflows/reach_module_screen.yaml
- runFlow: subflows/assert_photobooth_capture_ui.yaml
- runFlow: subflows/tap_in_app_back.yaml
- scrollUntilVisible:
    element: "(?i)(Collage Maker|Quick Print).*"
    direction: UP
    timeout: 15000
- assertVisible: "(?i)(Collage Maker|Quick Print).*"
