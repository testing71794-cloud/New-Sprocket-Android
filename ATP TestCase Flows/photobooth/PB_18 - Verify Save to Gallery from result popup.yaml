# ATP Test Case ID: PB_18
# Excel: Photobooth 18 | Module: Photobooth – Result Screen
# Verify that tapping Save to Gallery saves the photobooth result as a single image.
# Expected: Popup closes; collage saved; returns to Photobooth camera screen.
appId: com.hp.impulse.sprocket
name: "PB_18 - Verify Save to Gallery from result popup"
tags:
  - photobooth
  - atp-excel
  - positive
---
- runFlow: subflows/reach_module_screen.yaml
- assertVisible: "(?i)Photobooth.*"
- runFlow: subflows/tap_capture.yaml
- runFlow: subflows/wait_print_preview.yaml
- runFlow: subflows/tap_in_app_back.yaml
- waitForAnimationToEnd:
    timeout: 3000
- extendedWaitUntil:
    visible: "(?i)Save as new photo.*"
    timeout: 10000
- tapOn: "(?i)Save to Gallery.*"
- waitForAnimationToEnd:
    timeout: 8000
- extendedWaitUntil:
    visible: "(?i)Photobooth.*"
    timeout: 15000
- assertVisible: "(?i)Photobooth.*"
