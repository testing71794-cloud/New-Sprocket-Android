# ATP Test Case ID: PS_16
# Excel: Print_State_16
# Automatic Gallery redirect after completion
# Expected: When the queue is empty, "Print Complete" remains about one second, then Gallery opens with the prior album and scroll position.
appId: com.caglobal.hp.sprocket
name: "PS_16 - Automatic Gallery redirect after completion"
tags:
  - print-state
  - atp-excel
  - positive
  - physical-printer
  - timing-sensitive
  - gallery-state
---
- runFlow: subflows/open_single_print_state.yaml
- extendedWaitUntil:
    visible: "Print Complete"
    timeout: 420000
- extendedWaitUntil:
    visible: ".*(?i)(Recent|^Select$|^All$).*"
    timeout: 5000
- takeScreenshot: PS_16_gallery_after_automatic_redirect
