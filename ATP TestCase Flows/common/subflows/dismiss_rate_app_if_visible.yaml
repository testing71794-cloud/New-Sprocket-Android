# Rate App popup — tap No Thanks when shown (single pass; keep fast).
# See: https://docs.maestro.dev/maestro-flows/flow-control-and-logic/conditions
appId: com.caglobal.hp.sprocket
---
- runFlow:
    when:
      visible: ".*(?i)No Thanks.*"
    commands:
      - tapOn: ".*(?i)No Thanks.*"
      - waitForAnimationToEnd:
          timeout: 1500
- runFlow:
    when:
      visible: ".*(?i)(Rate App|Rate this app|Enjoying|Love (this|the) app).*"
    commands:
      - tapOn:
          text: ".*(?i)(No Thanks|Not now|Maybe later).*"
          optional: true
      - waitForAnimationToEnd:
          timeout: 1500
