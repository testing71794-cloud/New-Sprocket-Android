# One-time suite setup: Create hub → select HP Sprocket Sense 5D:6C → Create.
# See: https://docs.maestro.dev/maestro-flows/flow-control-and-logic/conditions
appId: com.caglobal.hp.sprocket
---
- launchApp:
    clearState: false
    permissions:
      all: allow
- runFlow: dismiss_rate_app_if_visible.yaml
- runFlow: grant_all_permissions_via_ui.yaml
- runFlow:
    when:
      visible: ".*(?i)(Welcome to Sprocket Sense|Swipe to continue).*"
      notVisible: ".*(?i)Quick Print.*"
    commands:
      - runFlow: complete_sprocket_carousel_if_visible.yaml
      - runFlow: ../../quick-print/subflows/complete_guest_welcome.yaml
      - runFlow: ../../quick-print/subflows/guest_to_create_home.yaml
- repeat:
    times: 3
    commands:
      - runFlow:
          when:
            notVisible: ".*(?i)(Quick Print|Collage Maker).*"
          commands:
            - tapOn:
                point: "50%,90%"
                optional: true
            - waitForAnimationToEnd:
                timeout: 1000
- extendedWaitUntil:
    visible: ".*(?i)(Quick Print|Collage Maker|Pre-Cut|Photobooth).*"
    timeout: 25000
    optional: true
# Force Sense select (ignore SKIP_SENSE from parent CLI)
- tapOn:
    text: "Printer\nTab 3 of 3"
    optional: true
- tapOn:
    point: "84%,90%"
    optional: true
- waitForAnimationToEnd:
    timeout: 1500
- extendedWaitUntil:
    visible: ".*(?i)(HP Sprocket Sense|5D:6C|5D-6C|Your Printers|Add Printer).*"
    timeout: 12000
    optional: true
- runFlow:
    when:
      visible: ".*(?i)(HP Sprocket Sense|5D[:\\-]6C).*"
    commands:
      - tapOn: ".*(?i)(HP Sprocket Sense.*5D[:\\-]6C|5D[:\\-]6C|HP Sprocket Sense).*"
      - waitForAnimationToEnd:
          timeout: 3000
      - runFlow:
          when:
            visible: ".*(?i)^Pair$"
          commands:
            - tapOn: ".*(?i)^Pair$"
            - waitForAnimationToEnd:
                timeout: 6000
      - runFlow:
          when:
            visible: ".*(?i)Finish Connection.*"
          commands:
            - tapOn: ".*(?i)Finish Connection.*"
            - waitForAnimationToEnd:
                timeout: 3000
- tapOn:
    text: "Create\nTab 2 of 3"
    optional: true
- tapOn:
    point: "50%,90%"
    optional: true
- waitForAnimationToEnd:
    timeout: 1500
- extendedWaitUntil:
    visible: ".*(?i)(Quick Print|Collage Maker|Pre-Cut|Photobooth).*"
    timeout: 15000
    optional: true
