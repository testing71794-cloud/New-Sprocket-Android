appId: com.caglobal.hp.sprocket
---
# Video onboarding carousel — Sense + legacy copy (content-desc on newer builds).
# Docs: https://docs.maestro.dev/api-reference/commands/swipe
# Docs: https://docs.maestro.dev/api-reference/commands/extendedwaituntil
- extendedWaitUntil:
    visible: ".*(?i)(Welcome to Sprocket Sense!|Welcome to the new Sprocket!).*"
    timeout: 20000
- assertVisible: ".*(?i)Swipe to continue\\.?.*"
- swipe:
    start: "90%,45%"
    end: "10%,45%"
    duration: 900
- extendedWaitUntil:
    visible: ".*(?i)AI Editing & Generation.*"
    timeout: 10000
- swipe:
    start: "90%,45%"
    end: "10%,45%"
    duration: 900
- extendedWaitUntil:
    visible: ".*(?i)Inkless & Seamless.*"
    timeout: 10000
