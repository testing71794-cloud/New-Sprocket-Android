appId: com.hp.impulse.sprocket
---
# First-launch carousel. Same LEFT swipe as ON_02 / ON_04 (90%→10% at 50%).
# Footer-hint swipes and short mid-card swipes do not move this pager.
# See: https://docs.maestro.dev/reference/commands-available/swipe
# See: https://docs.maestro.dev/maestro-flows/flow-control-and-logic/conditions
# See: https://docs.maestro.dev/reference/commands-available/extendedwaituntil
- runFlow:
    when:
      visible: ".*(?i)Get Started!?.*"
    commands:
      - tapOn: ".*(?i)Get Started!?.*"
      - waitForAnimationToEnd:
          timeout: 2000
- runFlow:
    when:
      visible: "Welcome to the new Sprocket!"
    commands:
      - swipe:
          direction: LEFT
          duration: 800
      - extendedWaitUntil:
          visible: ".*(?i)(AI Editing|Inkless|Get Started|Unleash).*"
          timeout: 8000
- runFlow:
    when:
      visible: "AI Editing & Generation"
    commands:
      - swipe:
          direction: LEFT
          duration: 800
      - extendedWaitUntil:
          visible: ".*(?i)(Inkless|Get Started|Unleash).*"
          timeout: 8000
- runFlow:
    when:
      visible: "Inkless & Seamless"
    commands:
      - swipe:
          direction: LEFT
          duration: 800
      - extendedWaitUntil:
          visible: ".*(?i)(Get Started|Unleash Your Creativity).*"
          timeout: 8000
- runFlow:
    when:
      visible: ".*(?i)Get Started!?.*"
    commands:
      - tapOn: ".*(?i)Get Started!?.*"
      - waitForAnimationToEnd:
          timeout: 2000
