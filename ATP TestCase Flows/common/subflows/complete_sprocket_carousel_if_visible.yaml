# First-launch carousel. Copy uses content-desc on newer builds
# ("Welcome to Sprocket Sense!" / "Swipe to continue.").
# Full-width LEFT swipe moves the pager (footer-only swipes do not).
# See: https://docs.maestro.dev/api-reference/commands/swipe
# See: https://docs.maestro.dev/maestro-flows/flow-control-and-logic/conditions
# See: https://docs.maestro.dev/api-reference/commands/extendedwaituntil
appId: com.caglobal.hp.sprocket
---
- runFlow:
    when:
      visible: ".*(?i)Get Started!?.*"
    commands:
      - tapOn: ".*(?i)Get Started!?.*"
      - waitForAnimationToEnd:
          timeout: 2000
# Advance through carousel pages (Sense + legacy copy)
- repeat:
    times: 6
    commands:
      - runFlow:
          when:
            visible: ".*(?i)(Welcome to the new Sprocket|Welcome to Sprocket Sense|Swipe to continue|AI Editing|Inkless|Unleash Your Creativity).*"
            notVisible: ".*(?i)(Get Started!?|Sign up|I already have|I.ll do it later|Sign Up Later|Quick Print).*"
          commands:
            - swipe:
                start: "90%,50%"
                end: "10%,50%"
                duration: 800
            - waitForAnimationToEnd:
                timeout: 1200
- runFlow:
    when:
      visible: ".*(?i)Get Started!?.*"
    commands:
      - tapOn: ".*(?i)Get Started!?.*"
      - waitForAnimationToEnd:
          timeout: 2000
