appId: com.hp.impulse.sprocket
---
# Current Sprocket build: "I'll do it later". Older builds / options screen: "Sign Up Later".
- runFlow:
    when:
      visible: ".*(?i)(I.ll do it later|Sign Up Later).*"
    commands:
      - tapOn: ".*(?i)(I.ll do it later|Sign Up Later).*"
- waitForAnimationToEnd:
    timeout: 2000
