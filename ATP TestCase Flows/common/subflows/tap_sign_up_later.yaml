appId: com.hp.impulse.sprocket
---
# Current Sprocket build: "I'll do it later". Older builds / options screen: "Sign Up Later".
- runFlow:
    when:
      visible: "I'll do it later"
    commands:
      - tapOn: "I'll do it later"
- runFlow:
    when:
      visible: "Sign Up Later"
    commands:
      - tapOn: "Sign Up Later"
- waitForAnimationToEnd:
    timeout: 2000
