appId: com.hp.impulse.sprocket
---
# HP Sprocket Sign up screen after splash (carousel optional).
# Current build: email form + "I'll do it later". Older: social options + "Sign Up Later".
- assertVisible: "Sign up"
- assertVisible:
    text: ".*(?i)(Style your pictures|Get your best photo|filters).*"
    optional: true
- assertVisible:
    text: ".*(?i)(I already have (an )?account).*"
    optional: true
- assertVisible:
    text: ".*(?i)(I.ll do it later|Sign Up Later).*"
