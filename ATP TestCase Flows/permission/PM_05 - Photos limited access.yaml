# ATP Test Case ID: PM_05
# PERM_002/036: Photos limited access — gallery reachable with limited grant.
appId: com.hp.impulse.sprocket
name: "PM_05 - Photos limited access"
---
- launchApp:
    permissions:
      all: deny
- runFlow: subflows/pm01_onboarding_single_launch.yaml
- runFlow: subflows/allow_all_permissions_sequence.yaml
- runFlow: subflows/ensure_create_hub_visible.yaml
- runFlow: subflows/enable_gallery_limited_access.yaml
- runFlow: subflows/return_to_create_hub.yaml
- assertNotVisible: ".*(?i)(Permission Required|some permissions are needed).*"
