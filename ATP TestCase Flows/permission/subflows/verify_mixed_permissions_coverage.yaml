appId: com.hp.impulse.sprocket
---
# Mixed allow/deny: gallery + Photobooth work without Permission Required.
- runFlow: ensure_create_hub_visible.yaml
- tapOn: ".*Quick Print.*"
- waitForAnimationToEnd:
    timeout: 5000
- runFlow:
    when:
      visible: ".*(?i)(access (more )?photos and videos|photos and videos on this device|allow limited access|allow all).*"
    commands:
      - tapOn: "Allow all"
      - waitForAnimationToEnd:
          timeout: 3000
- extendedWaitUntil:
    visible: ".*(?i)(Recent|Select 2 to 4 photos|Select Gallery).*"
    timeout: 20000
- assertVisible: ".*(?i)(Recent|Select 2 to 4 photos|Select Gallery).*"
- runFlow: return_to_create_hub.yaml
- runFlow: revoke_camera_before_photobooth.yaml
- tapOn: ".*(?i)(Photobooth|Photo Booth).*"
- waitForAnimationToEnd:
    timeout: 4000
- extendedWaitUntil:
    visible: ".*(?i)(take pictures and record video|While using the app|Only this time).*"
    timeout: 45000
- runFlow: allow_camera_permission.yaml
- runFlow: capture_and_verify_photobooth_preview.yaml
- assertNotVisible: ".*(?i)(Permission Required|some permissions are needed).*"
