appId: com.hp.impulse.sprocket

---

# Strict allow on the Camera runtime dialog.

- assertVisible: ".*(?i)(take pictures and record video|While using the app|Only this time).*"

- runFlow:

    when:

      visible: "While using the app"

    commands:

      - tapOn: "While using the app"

- runFlow:

    when:

      visible: "Only this time"

      notVisible: "While using the app"

    commands:

      - tapOn: "Only this time"

- runFlow:

    when:

      visible: "Allow"

      notVisible: "While using the app"

    commands:

      - tapOn: "Allow"

- extendedWaitUntil:

    notVisible: ".*(?i)(take pictures and record video|While using the app|Only this time).*"

    timeout: 15000

