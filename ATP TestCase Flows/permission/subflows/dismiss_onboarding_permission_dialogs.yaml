appId: com.hp.impulse.sprocket
---
# Deny stacked runtime dialogs after Sign Up Later (notification often blocks Create hub).
# Button copy varies by Android version: "Don't allow" / "Don't Allow" / "Deny".
- repeat:
    times: 6
    commands:
      - runFlow:
          when:
            visible: ".*(?i)send you notifications.*"
          commands:
            - tapOn:
                text: ".*(?i)Don.?t [Aa]llow.*"
                optional: true
            - tapOn:
                text: ".*(?i)^Deny$"
                optional: true
            - waitForAnimationToEnd:
                timeout: 1500
      - runFlow:
          when:
            visible: ".*(?i)access this device.*location.*"
          commands:
            - tapOn:
                text: ".*(?i)Don.?t [Aa]llow.*"
                optional: true
            - tapOn:
                text: ".*(?i)^Deny$"
                optional: true
            - waitForAnimationToEnd:
                timeout: 1500
      - runFlow:
          when:
            visible: ".*(?i)nearby devices.*"
          commands:
            - tapOn:
                text: ".*(?i)Don.?t [Aa]llow.*"
                optional: true
            - tapOn:
                text: ".*(?i)^Deny$"
                optional: true
            - waitForAnimationToEnd:
                timeout: 1500
      - runFlow:
          when:
            visible: ".*(?i)photos and videos.*"
          commands:
            - tapOn:
                text: ".*(?i)Don.?t [Aa]llow.*"
                optional: true
            - tapOn:
                text: ".*(?i)^Deny$"
                optional: true
            - waitForAnimationToEnd:
                timeout: 1500
      - waitForAnimationToEnd:
          timeout: 500
