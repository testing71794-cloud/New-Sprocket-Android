appId: com.hp.impulse.sprocket
---
# Negative coverage: deny Photos + Camera via features; assert Permission Required and blocked UI.
- runFlow: ensure_create_hub_visible.yaml
- tapOn: ".*Quick Print.*"
- waitForAnimationToEnd:
    timeout: 5000
- runFlow:
    when:
      visible: ".*(?i)(access (more )?photos and videos|photos and videos on this device|allow limited access|allow all).*"
    commands:
      - tapOn: "Don't allow"
      - waitForAnimationToEnd:
          timeout: 2000
- assertNotVisible: ".*(?i)(Recent|Select 2 to 4 photos|Select Gallery).*"
- pressKey: back
- waitForAnimationToEnd:
    timeout: 2000
- runFlow: ensure_create_hub_visible.yaml
- tapOn: ".*(?i)(Photobooth|Photo Booth).*"
- waitForAnimationToEnd:
    timeout: 4000
- runFlow:
    when:
      visible: ".*(?i)(take pictures and record video|While using the app|Only this time).*"
    commands:
      - tapOn: "Don't allow"
      - waitForAnimationToEnd:
          timeout: 2000
- runFlow:
    when:
      visible: ".*(?i)Permission Required.*"
    commands:
      - assertVisible: "Permission Required"
      - assertVisible: ".*(?i)some permissions are needed.*"
      - tapOn: "OK"
      - waitForAnimationToEnd:
          timeout: 2000
      - pressKey: back
      - waitForAnimationToEnd:
          timeout: 2000
- runFlow: ensure_create_hub_visible.yaml
- tapOn: ".*(?i)(Photobooth|Photo Booth).*"
- waitForAnimationToEnd:
    timeout: 4000
- runFlow:
    when:
      visible: ".*(?i)(take pictures and record video|While using the app|Only this time).*"
    commands:
      - tapOn: "Don't allow"
      - waitForAnimationToEnd:
          timeout: 2000
- runFlow:
    when:
      visible: ".*(?i)Permission Required.*"
    commands:
      - assertVisible: "Permission Required"
      - assertVisible: ".*(?i)some permissions are needed.*"
- assertNotVisible: "Copies"
