appId: com.hp.impulse.sprocket
---
# Deny every runtime permission dialog — handles adaptive order (Camera, Location, Nearby, Notification, Photos).
- repeat:
    times: 10
    commands:
      - runFlow:
          when:
            visible: ".*(?i)take pictures and record video.*"
          commands:
            - tapOn: "Don't allow"
            - extendedWaitUntil:
                notVisible: ".*(?i)take pictures and record video.*"
                timeout: 15000
      - runFlow:
          when:
            visible: ".*(?i)access this device.*location.*"
          commands:
            - tapOn: "Don't allow"
            - extendedWaitUntil:
                notVisible: ".*(?i)access this device.*location.*"
                timeout: 15000
      - runFlow:
          when:
            visible: ".*(?i)(nearby devices|relative position of nearby).*"
          commands:
            - tapOn: "Don't allow"
            - extendedWaitUntil:
                notVisible: ".*(?i)(nearby devices|relative position of nearby).*"
                timeout: 15000
      - runFlow:
          when:
            visible: ".*(?i)send you notifications.*"
          commands:
            - tapOn: "Don't allow"
            - extendedWaitUntil:
                notVisible: ".*(?i)send you notifications.*"
                timeout: 15000
      - runFlow:
          when:
            visible: ".*(?i)(access (more )?photos and videos|photos and videos on this device|allow limited access|allow all).*"
          commands:
            - tapOn: "Don't allow"
            - extendedWaitUntil:
                notVisible: ".*(?i)(access (more )?photos and videos|photos and videos on this device|allow limited access|allow all).*"
                timeout: 15000
      - waitForAnimationToEnd:
          timeout: 1000
