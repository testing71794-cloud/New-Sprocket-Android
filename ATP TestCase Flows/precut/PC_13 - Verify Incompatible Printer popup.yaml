# Canonical merged PC_13. Full incompatible-printer coverage: error on entry when
# possible, otherwise selection -> preview -> print error. Includes both legacy PC_10/PC_11
# printer-error flows that used conflicting IDs.
appId: com.hp.impulse.sprocket
name: "PC_13 - Incompatible Printer behavior"
tags: [precut, atp-excel, optimized, negative]
---
- launchApp:
    clearState: false
- runFlow: subflows/pc10_ensure_unsupported_printer_and_create_hub.yaml
- runFlow: subflows/assert_precut_incompatible_on_entry_tap.yaml
- runFlow:
    when:
      visible: ".*(?i)(Select|Next|photo).*"
      notVisible: ".*(?i)Incompatible Printer.*"
    commands:
      - runFlow: subflows/reach_precut_print_preview.yaml
      - runFlow: subflows/assert_precut_incompatible_on_print_tap.yaml
- assertVisible: ".*(?i)Incompatible Printer.*"
