# ATP Test Case ID: PC_08
# Excel: Precut_08 | Module: Permission Handling
# Deny Photos at Pre-Cut entry — expect Open Settings / permission UI.
appId: com.hp.impulse.sprocket
name: "PC_08 - Verify UI when gallery permission is denied"
tags:
  - precut
  - atp-excel
---
- launchApp:
    clearState: true
    permissions:
      all: deny
- runFlow: ../common/subflows/wait_after_cold_launch.yaml
- runFlow: ../common/subflows/complete_sprocket_carousel_if_visible.yaml
- extendedWaitUntil:
    visible: ".*(?i)(Sign up|I.ll do it later|Sign Up Later|Get Started!).*"
    timeout: 25000
- runFlow:
    when:
      visible: "Get Started!"
    commands:
      - tapOn: "Get Started!"
      - waitForAnimationToEnd:
          timeout: 4000
- runFlow: ../common/subflows/tap_sign_up_later.yaml
- runFlow: ../common/subflows/accept_terms_if_visible.yaml
- runFlow:
    when:
      visible: "Skip"
    commands:
      - tapOn: "Skip"
- runFlow: ../permission/subflows/dismiss_onboarding_permission_dialogs.yaml
- runFlow: ../gallery/subflows/dismiss_gallery_coachmark_if_visible.yaml
- runFlow:
    when:
      visible: ".*(?i)Create.*"
    commands:
      - tapOn: ".*(?i)Create.*"
- extendedWaitUntil:
    visible: ".*(?i)(Collage Maker|Quick Print|Pre-?Cut).*"
    timeout: 25000
- scrollUntilVisible:
    element: ".*(?i)(Pre-?Cut Stickers|Pre-?Cut|Precut).*"
    direction: DOWN
    timeout: 15000
- tapOn:
    text: ".*(?i)(Pre-?Cut Stickers|Pre-?Cut|Precut).*"
    retryTapIfNoChange: true
- waitForAnimationToEnd:
    timeout: 4000
- runFlow:
    when:
      visible: ".*(?i)(photos and videos|Allow all|Don.?t [Aa]llow|Deny).*"
    commands:
      - tapOn:
          text: ".*(?i)Don.?t [Aa]llow.*"
          optional: true
      - tapOn:
          text: ".*(?i)^Deny$"
          optional: true
      - waitForAnimationToEnd:
          timeout: 2000
- extendedWaitUntil:
    visible: ".*(?i)(Open Settings|Allow|photos and videos|permission|Select 2 [Pp]hotos).*"
    timeout: 15000
- assertVisible: ".*(?i)(Open Settings|Allow|photos and videos|permission|Select 2 [Pp]hotos).*"

