# ATP Test Case ID: PC_13a
# Excel: Precut_13 (a) | Module: Pre-Cut Stickers – Printer Compatibility
# Compatible: HP Sprocket 2×3 only → print proceeds (no Incompatible message).
# Incompatible: 3×4 / Studio / Studio Plus / Select / Plus → Incompatible Printer popup/toast.
# This flow uses the compatible 2×3 path; PC_13 covers incompatible 3×4 (00FE).
appId: com.hp.impulse.sprocket
name: "PC_13a - Verify Pre-Cut printer compatibility behavior"
tags:
  - precut
  - atp-excel
  - positive
---
- runFlow: subflows/reach_selection_got_it_with_printer.yaml
- runFlow: subflows/select_two_photos.yaml
- runFlow: subflows/tap_next.yaml
- runFlow: subflows/wait_print_preview.yaml
- runFlow: subflows/tap_print.yaml
# With 2×3 connected: must NOT show incompatible toast/popup.
- assertNotVisible: ".*(?i)(Incompatible Printer|not compatible|unsupported printer).*"
- assertVisible: ".*(?i)(Print|Printing|Copies|Cancel|Share).*"
