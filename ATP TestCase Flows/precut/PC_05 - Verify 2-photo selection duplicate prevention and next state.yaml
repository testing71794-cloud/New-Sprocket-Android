# ATP Test Case ID: PC_05
# Excel: Precut_05 | Module: Selection Logic
# Two unique photos, then re-tap first gallery cell.
appId: com.hp.impulse.sprocket
name: "PC_05 - Verify 2-photo selection duplicate prevention and next state"
tags:
  - precut
  - atp-excel
---
- runFlow: subflows/reach_module_screen.yaml
- runFlow: subflows/select_two_unique_precut_photos.yaml
- assertVisible: "Next"
- tapOn:
    point: "19%,75%"
- waitForAnimationToEnd:
    timeout: 1500
- assertVisible: ".*(?i)Select 2 [Pp]hotos.*"
- assertVisible: "Next"
