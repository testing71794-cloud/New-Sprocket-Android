appId: com.hp.impulse.sprocket
---
# Focus selected slot, collapse gallery, tap Edit.
# On Vivo 720x1600 hierarchy: action icons are on the RIGHT of the paper (~93% x).
- tapOn:
    point: "28%,28%"
- waitForAnimationToEnd:
    timeout: 1200
- swipe:
    start: "50%,55%"
    end: "50%,95%"
    duration: 700
- waitForAnimationToEnd:
    timeout: 1500
- tapOn:
    point: "28%,28%"
- waitForAnimationToEnd:
    timeout: 1000
- tapOn:
    text: "(?i)^Edit$"
    optional: true
- tapOn:
    text: "(?i)Edit.*"
    optional: true
- extendedWaitUntil:
    visible: ".*(?i)(Done|Crop|Filter|Filters|Adjust|Stickers|Auto|Frames|Retouch).*"
    timeout: 4000
    optional: true
# Right-side action stack (Vivo hierarchy: Edit opens at ~93%,32%).
- runFlow:
    when:
      notVisible: ".*(?i)(Done|Crop|Filter|Filters|Adjust|Stickers|Auto|Frames|Retouch).*"
    commands:
      - tapOn:
          point: "93%,32%"
      - extendedWaitUntil:
          visible: ".*(?i)(Done|Crop|Filter|Filters|Adjust|Stickers|Auto|Frames|Retouch).*"
          timeout: 5000
          optional: true
- runFlow:
    when:
      notVisible: ".*(?i)(Done|Crop|Filter|Filters|Adjust|Stickers|Auto|Frames|Retouch).*"
    commands:
      - tapOn:
          point: "93%,37%"
      - extendedWaitUntil:
          visible: ".*(?i)(Done|Crop|Filter|Filters|Adjust|Stickers|Auto|Frames|Retouch).*"
          timeout: 5000
          optional: true
# Fallbacks for Pixel / other layouts (center action row).
- runFlow:
    when:
      notVisible: ".*(?i)(Done|Crop|Filter|Filters|Adjust|Stickers|Auto|Frames|Retouch).*"
    commands:
      - tapOn:
          point: "48%,24%"
      - extendedWaitUntil:
          visible: ".*(?i)(Done|Crop|Filter|Filters|Adjust|Stickers|Auto|Frames|Retouch).*"
          timeout: 4000
          optional: true
- runFlow:
    when:
      notVisible: ".*(?i)(Done|Crop|Filter|Filters|Adjust|Stickers|Auto|Frames|Retouch).*"
    commands:
      - tapOn:
          point: "55%,24%"
      - waitForAnimationToEnd:
          timeout: 3000
