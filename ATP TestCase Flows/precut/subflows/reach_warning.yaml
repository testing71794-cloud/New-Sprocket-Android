appId: com.caglobal.hp.sprocket
---
# Reach the Pre-Cut warning. Re-enter from the current screen when it is already
# in the app. Cold launch only when the warning cannot be opened that way.
# https://docs.maestro.dev/maestro-flows/flow-control-and-logic/conditions
# https://docs.maestro.dev/reference/commands-available/presskey
- runFlow:
    when:
      notVisible: "(?i)Got It.*"
    commands:
      - runFlow:
          when:
            visible: ".*(?i)Sharing .* (image|item).*"
          commands:
            - pressKey: back
            - waitForAnimationToEnd:
                timeout: 1500
      - runFlow:
          when:
            visible: ".*(?i)Select 2 photos.*"
          commands:
            - runFlow: tap_in_app_back.yaml
            - waitForAnimationToEnd:
                timeout: 2000
      - runFlow:
          when:
            notVisible: ".*(?i)(Collage Maker|Quick Print).*"
          commands:
            - runFlow: recover_to_create_hub.yaml
      - runFlow:
          when:
            visible: ".*(?i)(Collage Maker|Quick Print|Pre-?cut).*"
          commands:
            - runFlow: tap_precut.yaml
            - runFlow: allow_photos_if_visible.yaml
      - runFlow:
          when:
            notVisible: "(?i)Got It.*"
          commands:
            - runFlow: excel_launch_to_home.yaml
            - runFlow: tap_precut.yaml
            - runFlow: allow_photos_if_visible.yaml
- runFlow: wait_warning_popup.yaml
