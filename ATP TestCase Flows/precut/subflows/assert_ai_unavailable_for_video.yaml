# Excel Precut_08 (a) — AI disabled for video; toast is often missing from a11y tree.
appId: com.hp.impulse.sprocket
---
- waitForAnimationToEnd:
    timeout: 1500
- extendedWaitUntil:
    visible: ".*(?i)(AI Edit is not available|not available for [Vv]ideo).*"
    timeout: 6000
    optional: true
- runFlow:
    when:
      visible: ".*(?i)(AI Edit is not available|not available for [Vv]ideo).*"
    commands:
      - assertVisible: ".*(?i)(AI Edit is not available|not available for [Vv]ideo).*"
# Fallback: remain on Pre-Cut selection and do not enter AI editor.
- runFlow:
    when:
      notVisible: ".*(?i)(AI Edit is not available|not available for [Vv]ideo).*"
    commands:
      - assertVisible: ".*(?i)Select 2 photos.*"
      - assertNotVisible: ".*(?i)(Enhance|Magic|Change Photo|Crop Photo).*"
