# Lab: launch keep-state → select HP Sprocket Sense (5D:6C) → open Pre-Cut.
# Do NOT Skip to Connection / Add Printer / Searching for Printers.
# Do not tap Got It on the Incompatible Printer dialog.
# See: https://docs.maestro.dev/maestro-flows/flow-control-and-logic/conditions
appId: com.caglobal.hp.sprocket
---
- runFlow: ../../printing/subflows/launch_to_create_keep_state.yaml
- runFlow:
    when:
      notVisible: ".*(?i)Select 2 photos.*"
    commands:
      - runFlow: tap_precut.yaml
      - runFlow: allow_photos_if_visible.yaml
      - runFlow:
          when:
            visible: "(?i)Got It.*"
            notVisible: ".*(?i)Incompatible Printer.*"
          commands:
            - tapOn: "(?i)Got It.*"
            - waitForAnimationToEnd:
                timeout: 2000
- runFlow: wait_selection_screen.yaml
