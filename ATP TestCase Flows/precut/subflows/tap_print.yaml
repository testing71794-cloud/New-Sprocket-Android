# Once Print Preview shows Print (connection ready), tap Print.
# Resolve Reconnect / Add Printer → Sense 5D:6C first if needed.
# See: https://docs.maestro.dev/maestro-flows/flow-control-and-logic/conditions
# See: https://docs.maestro.dev/api-reference/commands/tapon
appId: com.caglobal.hp.sprocket
---
- runFlow: ../../common/subflows/dismiss_rate_app_if_visible.yaml
- runFlow:
    when:
      visible: ".*(?i)(Reconnect Printer|^Add Printer$).*"
    commands:
      - runFlow: ../../quick-print/subflows/resolve_print_preview_printer_cta.yaml
- extendedWaitUntil:
    visible: ".*(?i)(^Print$|Incompatible Printer).*"
    timeout: 60000
    optional: true
- runFlow:
    when:
      visible: ".*(?i)^Print$"
    commands:
      - tapOn: ".*(?i)^Print$"
      - waitForAnimationToEnd:
          timeout: 3000
- runFlow:
    when:
      notVisible: ".*(?i)^Print$"
      visible: ".*(?i)(Copies|Save to Gallery).*"
      notVisible: ".*(?i)Incompatible Printer.*"
    commands:
      - tapOn:
          point: "50%,82%"
