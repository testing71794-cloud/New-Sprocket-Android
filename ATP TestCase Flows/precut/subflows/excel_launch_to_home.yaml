appId: com.hp.impulse.sprocket
---
# Excel Photobooth steps 1–8 — proven on Pixel 5; camera unset for Pre-Cut permission cases.
- launchApp:
    clearState: true
    permissions:
      camera: unset
      storage: unset
      medialibrary: unset
- runFlow: ../../common/subflows/wait_after_cold_launch.yaml
- runFlow: ../../common/subflows/complete_sprocket_carousel_if_visible.yaml
- repeat:
    times: 6
    commands:
      - runFlow:
          when:
            visible: "Swipe to continue."
          commands:
            - swipe:
                direction: LEFT
            - waitForAnimationToEnd:
                timeout: 2000
      - runFlow:
          when:
            visible: "Get Started!"
          commands:
            - tapOn: "Get Started!"
            - waitForAnimationToEnd:
                timeout: 5000
      - runFlow:
          when:
            visible: "Welcome to the new Sprocket!"
            notVisible: "Sign up"
          commands:
            - swipe:
                direction: LEFT
            - waitForAnimationToEnd:
                timeout: 2000
- extendedWaitUntil:
    visible: "Sign up"
    timeout: 60000
- runFlow:
    when:
      visible: ".*(?i)I already have account.*"
    commands:
      - tapOn:
          id: "com.hp.impulse.sprocket:id/tv_login"
          optional: true
      - tapOn: ".*(?i)I already have account.*"
      - waitForAnimationToEnd:
          timeout: 3000
      - extendedWaitUntil:
          visible: ".*(?i)Continue without Logging In.*"
          timeout: 20000
      - tapOn: ".*(?i)Continue without Logging In.*"
      - waitForAnimationToEnd:
          timeout: 5000
- runFlow:
    when:
      visible: ".*(?i)(Sign up|Sign Up Later|I'll do it later).*"
    commands:
      - runFlow: ../../common/subflows/tap_sign_up_later.yaml
- runFlow: ../../common/subflows/accept_terms_if_visible.yaml
- runFlow: ../../common/subflows/dismiss_privacy_consent_if_visible.yaml
- runFlow: ../../common/subflows/reach_kodak_coachmark_onboarding.yaml
- runFlow:
    when:
      visible: "Skip"
    commands:
      - tapOn: "Skip"
- runFlow: ../../permission/subflows/allow_all_runtime_permissions.yaml
- runFlow: ../../permission/subflows/allow_camera_permission.yaml
- runFlow: ../../common/subflows/dismiss_privacy_consent_if_visible.yaml
- runFlow: ../../gallery/subflows/dismiss_gallery_coachmark_if_visible.yaml
- waitForAnimationToEnd:
    timeout: 4000
- runFlow:
    when:
      visible: ".*(?i)(take pictures and record video|take photos and videos).*"
    commands:
      - runFlow: ../../permission/subflows/allow_camera_permission.yaml
- runFlow:
    when:
      notVisible: ".*(?i)(Collage Maker|Quick Print|Photobooth|Pre-?cut).*"
    commands:
      - tapOn:
          text: ".*(?i)Create.*"
          optional: true
      - tapOn:
          point: "50%,90%"
          optional: true
      - waitForAnimationToEnd:
          timeout: 2500
- extendedWaitUntil:
    visible: ".*(?i)(Collage Maker|Quick Print|Photobooth|Photo ID|Create|Printer|More).*"
    timeout: 25000
- repeat:
    times: 4
    commands:
      - runFlow:
          when:
            notVisible: ".*(?i)(Collage Maker|Quick Print|Photobooth|Pre-?cut).*"
          commands:
            - runFlow: ../../permission/subflows/allow_camera_permission.yaml
            - tapOn:
                text: ".*(?i)^Create$"
                optional: true
            - tapOn:
                text: ".*(?i)Create.*"
                optional: true
            - tapOn:
                point: "50%,90%"
                optional: true
            - tapOn:
                point: "50%,93%"
                optional: true
            - waitForAnimationToEnd:
                timeout: 2500
- extendedWaitUntil:
    visible: ".*(?i)(Collage Maker|Quick Print|Pre-?cut|Photobooth|Photo ID).*"
    timeout: 20000
- assertVisible: ".*(?i)(Collage Maker|Quick Print|Pre-?cut|Photobooth|Photo ID).*"
