appId: com.hp.impulse.sprocket
---
# Unsupported printer → tap Pre-Cut.
# Dismiss info popup first (Don't Show Again) — its body also says "exclusively with the Sprocket".
# Path A: "Incompatible Printer" on entry.
# Path B: selection → Next → "Incompatible Printer".
- tapOn:
    text: ".*(?i)(Pre-?Cut Stickers|Pre-?Cut|Precut).*"
    retryTapIfNoChange: true
- waitForAnimationToEnd:
    timeout: 2000
- runFlow: allow_gallery_if_prompted.yaml
- runFlow: dismiss_precut_info_popup_if_visible.yaml
- waitForAnimationToEnd:
    timeout: 1500
# Path A — error on entry tap.
- runFlow:
    when:
      visible: ".*(?i)Incompatible Printer.*"
    commands:
      - runFlow: assert_precut_incompatible_dialog.yaml
      - assertNotVisible: ".*(?i)Select 2 [Pp]hotos.*"
# Path B — entry allowed; error after Next (or Print).
- runFlow:
    when:
      notVisible: ".*(?i)Incompatible Printer.*"
      visible: ".*(?i)Select 2 [Pp]hotos.*"
    commands:
      - runFlow: select_two_unique_precut_photos.yaml
      - tapOn: "Next"
      - waitForAnimationToEnd:
          timeout: 4000
      - runFlow:
          when:
            visible: ".*(?i)Incompatible Printer.*"
          commands:
            - runFlow: assert_precut_incompatible_dialog.yaml
      - runFlow:
          when:
            notVisible: ".*(?i)Incompatible Printer.*"
          commands:
            - runFlow: assert_precut_print_preview.yaml
            - runFlow: assert_precut_incompatible_on_print_tap.yaml
# Final confirmation (Path A or B must have shown the dialog).
- assertVisible:
    text: ".*(?i)Incompatible Printer.*"
    label: "PC_10 expected Incompatible Printer on entry or after Next."
