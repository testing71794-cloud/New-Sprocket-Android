appId: com.hp.impulse.sprocket
name: "PC_13 assert incompatible (keep state)"
---
- launchApp:
    clearState: false
- waitForAnimationToEnd:
    timeout: 3000
- runFlow: ../../common/subflows/dismiss_rate_app_if_visible.yaml
- runFlow:
    when:
      visible: ".*(?i)Got It.*"
      notVisible: ".*(?i)Incompatible Printer.*"
    commands:
      - tapOn: "(?i)Got It.*"
- runFlow: ensure_incompatible_printer_connected.yaml
- runFlow: tap_precut.yaml
- runFlow: allow_photos_if_visible.yaml
- extendedWaitUntil:
    visible: ".*(?i)(Incompatible Printer|Got It|Pre-Cut Stickers|Select.*photo).*"
    timeout: 25000
- runFlow: assert_incompatible_printer_message.yaml
- assertVisible: "(?i)Got It.*"
