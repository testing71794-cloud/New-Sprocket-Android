appId: com.hp.impulse.sprocket
---
# Fresh Pre-Cut selection screen. Cold launch only when the Create hub is not already visible.
- runFlow:
    when:
      notVisible: ".*(?i)(Collage Maker|Quick Print|Pre-?cut).*"
    commands:
      - runFlow: recover_to_create_hub.yaml
- runFlow:
    when:
      notVisible: ".*(?i)(Collage Maker|Quick Print|Pre-?cut).*"
    commands:
      - runFlow: excel_launch_to_home.yaml
- runFlow: open_precut_to_selection.yaml
