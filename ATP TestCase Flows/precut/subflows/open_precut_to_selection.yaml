appId: com.hp.impulse.sprocket
---
# From Create hub: open Pre-Cut selection. Warning is dismissed only if it appears.
- runFlow: tap_precut.yaml
- runFlow: allow_photos_if_visible.yaml
- runFlow:
    when:
      visible: "(?i)Got It.*"
      notVisible: ".*(?i)Incompatible Printer.*"
    commands:
      - tapOn: "(?i)Got It.*"
      - waitForAnimationToEnd:
          timeout: 2000
- runFlow: wait_selection_screen.yaml
