# Incompatible Pre-Cut printer: Skip to Connection → HP Sprocket Plus (82:57).
# Same path as Tile Print. Then return to the Create hub Pre-Cut tile.
# https://docs.maestro.dev/maestro-flows/flow-control-and-logic/conditions
appId: com.caglobal.hp.sprocket
---
- runFlow: ../../tile-print/subflows/connect_sprocket_plus_skip_core.yaml
- runFlow: ../../common/subflows/dismiss_rate_app_if_visible.yaml
- runFlow: dismiss_printer_setup_chrome.yaml
- scrollUntilVisible:
    element: ".*(?i)(Pre-?Cut Stickers|Pre-?Cut|Precut).*"
    direction: DOWN
    timeout: 20000
    centerElement: true
- assertVisible: ".*(?i)(Pre-?Cut Stickers|Pre-?Cut|Precut).*"
