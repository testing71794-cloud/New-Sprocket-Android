# ATP Test Case ID: PC_05
# Excel: Precut_05 | Module: Pre-Cut Stickers – Select an Image
# Verify that the user can select an image for the Pre-Cut slot.
# Expected: First image fills slot 1; next empty slot is highlighted; continue filling slots.
appId: com.hp.impulse.sprocket
name: "PC_05 - Verify select an image for Pre-Cut slot"
tags:
  - precut
  - atp-excel
  - positive
---
- runFlow: subflows/reach_selection_got_it.yaml
- runFlow: subflows/select_first_gallery_photo.yaml
- assertVisible:
    text: "1"
    optional: true
- runFlow: subflows/select_second_gallery_photo.yaml
- assertVisible:
    text: "2"
    optional: true
- assertVisible: ".*(?i)Select 2 photos.*"
