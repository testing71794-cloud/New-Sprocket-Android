# ATP Test Case ID: PC_08c
# Excel: Precut_08 (c) | Module: Pre-Cut Stickers – Edit Photo
# Verify that tapping the Edit icon opens the Custom SDK editor and the edited image is updated in the same selected slot.
# Expected: Custom SDK editor; after apply, still on Select 2 photos with the same slot assigned.
appId: com.hp.impulse.sprocket
name: "PC_08c - Verify Edit opens Custom SDK and updates slot"
tags:
  - precut
  - atp-excel
  - positive
---
- runFlow: subflows/reach_selection_got_it.yaml
- runFlow: subflows/select_first_gallery_photo.yaml
- assertVisible: "1"
- runFlow: subflows/tap_edit.yaml
- extendedWaitUntil:
    visible: ".*(?i)(Done|Crop|Filter|Filters|Adjust|Stickers|Auto|Frames|Retouch).*"
    timeout: 30000
- runFlow:
    when:
      visible: ".*(?i)(Done|Apply).*"
    commands:
      - tapOn: ".*(?i)(Done|Apply).*"
- runFlow:
    when:
      visible: ".*(?i)Cancel.*"
    commands:
      - tapOn:
          text: ".*(?i)(Done|Apply).*"
          optional: true
- extendedWaitUntil:
    visible: ".*(?i)Select 2 photos.*"
    timeout: 20000
- assertVisible: ".*(?i)Select 2 photos.*"
- tapOn:
    point: "28%,28%"
- waitForAnimationToEnd:
    timeout: 1000
- assertVisible:
    text: "1"
    optional: true
- assertVisible: "Next"
