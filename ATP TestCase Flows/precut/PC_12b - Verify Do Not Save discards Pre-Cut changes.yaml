# ATP Test Case ID: PC_12b
# Excel: Precut_12 (b) | Module: Pre-Cut Stickers – Save Changes Popup
# Verify that tapping “Do Not Save” discards the Pre-Cut photo changes.
# Expected: Popup closes; user exits Pre-Cut without saving.
appId: com.hp.impulse.sprocket
name: "PC_12b - Verify Do Not Save discards Pre-Cut changes"
tags:
  - precut
  - atp-excel
  - positive
---
- runFlow: subflows/reach_selection_got_it.yaml
- runFlow: subflows/select_two_photos.yaml
- runFlow: subflows/gesture_edit_slot.yaml
- runFlow: subflows/tap_in_app_back.yaml
- runFlow: subflows/wait_save_popup.yaml
- tapOn: "(?i)Do Not Save.*"
- extendedWaitUntil:
    visible: ".*(?i)(Collage Maker|Quick Print|Pre-?cut).*"
    timeout: 15000
- assertVisible: ".*(?i)(Collage Maker|Quick Print|Pre-?cut).*"
- assertNotVisible: "(?i)Save as new photo.*"
