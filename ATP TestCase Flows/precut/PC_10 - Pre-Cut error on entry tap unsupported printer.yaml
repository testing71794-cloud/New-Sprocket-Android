# ATP Test Case ID: PC_10
# Unsupported (non-2x3) printer → Pre-Cut "Incompatible Printer" dialog.
# Prefer dialog on Pre-Cut entry tap; if entry still opens, select 2 photos → Next → dialog
# (app currently shows the dialog after Next; Print only if dialog not yet shown).
# Setup: listed Studio Plus / 3x4 / Plus / 600 (Wi-Fi password via WIFI_PASSWORD when needed).
appId: com.hp.impulse.sprocket
name: "PC_10 - Pre-Cut error on entry tap unsupported printer"
tags:
  - precut
  - precut-unsupported-printer
  - precut-entry-error
  - atp-supplementary
---
- launchApp:
    clearState: false
- runFlow: ../common/subflows/wait_after_cold_launch.yaml
- runFlow: ../common/subflows/ensure_sprocket_foreground.yaml
- runFlow: ../common/subflows/dismiss_rate_app_if_visible.yaml
- runFlow: subflows/pc10_ensure_unsupported_printer_and_create_hub.yaml
- runFlow: subflows/assert_precut_incompatible_on_entry_tap.yaml
