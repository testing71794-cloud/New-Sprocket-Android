# ATP Test Case ID: PC_03
# Excel: Precut_03 | Module: Duplicate Restriction
# Select same gallery image for both slots — expect block / stay on selection.
appId: com.hp.impulse.sprocket
name: "PC_03 - Verify duplicate selection error"
tags:
  - precut
  - atp-excel
---
- runFlow: subflows/reach_module_screen.yaml
- tapOn:
    text: "1"
    optional: true
- tapOn:
    point: "19%,75%"
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    text: "2"
    optional: true
- tapOn:
    point: "19%,75%"
- waitForAnimationToEnd:
    timeout: 2000
- runFlow:
    when:
      visible: ".*(?i)(already selected|duplicate|same photo|cannot select).*"
    commands:
      - assertVisible: ".*(?i)(already selected|duplicate|same photo|cannot select).*"
- assertVisible: ".*(?i)Select 2 [Pp]hotos.*"
- assertVisible: "Next"
