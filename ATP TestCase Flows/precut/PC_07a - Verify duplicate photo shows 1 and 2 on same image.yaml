# Canonical merged PC_07a. Full coverage: same image in both slots and duplicate restriction.
appId: com.hp.impulse.sprocket
name: "PC_07a - Duplicate photo selection and indicators"
tags: [precut, atp-excel, optimized]
---
- runFlow: subflows/reach_selection_got_it.yaml
- runFlow: subflows/select_same_photo_twice.yaml
- runFlow: subflows/assert_both_slots_filled.yaml
- assertVisible:
    text: "Next"
    enabled: true
# Re-check the duplicate-selection guard if the build exposes it.
- runFlow:
    when:
      visible: ".*(?i)(already selected|duplicate|same photo|cannot select).*"
    commands:
      - assertVisible: ".*(?i)(already selected|duplicate|same photo|cannot select).*"
- assertVisible: ".*(?i)Select 2 [Pp]hotos.*"
- assertVisible: "Next"
