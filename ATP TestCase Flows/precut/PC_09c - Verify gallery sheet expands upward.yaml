# ATP Test Case ID: PC_09c
# Excel: Precut_09 (c) | Module: Pre-Cut Stickers – Gallery Sheet Expanded View
# Verify that the gallery sheet can be expanded upward to browse more photos and the Pre-Cut image slots resize smoothly.
# Expected: Sheet snaps expanded; more photos visible; selections remain.
appId: com.hp.impulse.sprocket
name: "PC_09c - Verify gallery sheet expands upward"
tags:
  - precut
  - atp-excel
  - positive
---
- runFlow: subflows/reach_selection_got_it.yaml
- runFlow: subflows/select_two_photos.yaml
- runFlow: subflows/drag_gallery_up.yaml
- assertVisible: ".*(?i)Select 2 photos.*"
- runFlow: subflows/assert_both_slots_filled.yaml
