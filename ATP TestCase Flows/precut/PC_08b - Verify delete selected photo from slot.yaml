# ATP Test Case ID: PC_08b
# Excel: Precut_08 (b) | Module: Pre-Cut Stickers – Delete Photo
# Verify that the user can delete a selected photo from the Pre-Cut photo slot.
# Expected: Slot emptied; Next disabled if required slots are no longer filled.
appId: com.hp.impulse.sprocket
name: "PC_08b - Verify delete selected photo from slot"
tags:
  - precut
  - atp-excel
  - positive
---
- runFlow: subflows/reach_selection_got_it.yaml
- runFlow: subflows/select_first_gallery_photo.yaml
- assertVisible: "1"
- runFlow: subflows/tap_delete.yaml
- tapOn: "Next"
- assertVisible: ".*(?i)Select 2 photos.*"
