# ATP Test Case ID: PC_09
# Excel: Precut_09 | Module: Exit & Save Logic
# Print Preview → Back → save prompt (when shown).
appId: com.hp.impulse.sprocket
name: "PC_09 - Verify exit flow after editing selection"
tags:
  - precut
  - atp-excel
---
- runFlow: subflows/reach_module_screen.yaml
- runFlow: subflows/select_two_unique_precut_photos.yaml
- tapOn: "Next"
- waitForAnimationToEnd:
    timeout: 4000
- runFlow: subflows/assert_precut_print_preview.yaml
- runFlow:
    when:
      visible: ".*(?i)^Edit$"
    commands:
      - tapOn: ".*(?i)^Edit$"
      - waitForAnimationToEnd:
          timeout: 3000
- pressKey: back
- waitForAnimationToEnd:
    timeout: 2000
- runFlow:
    when:
      visible: ".*(?i)(Save as new photo|Do Not Save|Save to Gallery).*"
    commands:
      - assertVisible: ".*(?i)Do Not Save.*"
      - tapOn: ".*(?i)Do Not Save.*"
      - waitForAnimationToEnd:
          timeout: 3000
- extendedWaitUntil:
    visible: ".*(?i)(Select 2 [Pp]hotos|Pre-?Cut|Collage Maker|Quick Print|Copies|Print|Share).*"
    timeout: 15000
- assertVisible: ".*(?i)(Select 2 [Pp]hotos|Pre-?Cut|Collage Maker|Quick Print|Copies|Print|Share).*"
