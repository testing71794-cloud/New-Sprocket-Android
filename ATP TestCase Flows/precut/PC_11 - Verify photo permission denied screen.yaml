# ATP Test Case ID: PC_11
# Excel: Precut_11 | Module: Pre-Cut Stickers – Gallery Permission Denied
# Verify that the photo permission screen is displayed when Gallery permission is denied.
# Expected: Grant photo permissions message, Open settings, Next disabled.
appId: com.hp.impulse.sprocket
name: "PC_11 - Verify photo permission denied screen"
tags:
  - precut
  - atp-excel
  - positive
---
- runFlow: subflows/excel_launch_to_home_no_photos.yaml
- runFlow: subflows/tap_precut.yaml
- extendedWaitUntil:
    visible: ".*(?i)(photos and videos|photos and media|Allow all|ALLOW|Open [Ss]ettings|grant photo|Got It|Select 2 photos).*"
    timeout: 20000
- runFlow: subflows/deny_photos_if_visible.yaml
- runFlow:
    when:
      visible: "(?i)Got It.*"
    commands:
      - tapOn: "(?i)Got It.*"
- extendedWaitUntil:
    visible: ".*(?i)(Open [Ss]ettings|grant photo).*"
    timeout: 20000
- assertVisible: ".*(?i)(Go to device settings to grant photo permissions|grant photo permissions).*"
- assertVisible: ".*(?i)Open [Ss]ettings.*"
- assertVisible: "Next"
