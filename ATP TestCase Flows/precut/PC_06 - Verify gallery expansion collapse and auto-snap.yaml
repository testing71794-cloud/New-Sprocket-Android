# ATP Test Case ID: PC_06
# Excel: Precut_06 | Module: Gallery Interaction
# Gallery drawer swipe expand/collapse (best-effort on Compose).
appId: com.hp.impulse.sprocket
name: "PC_06 - Verify gallery expansion collapse and auto-snap"
tags:
  - precut
  - atp-excel
---
- runFlow: subflows/reach_module_screen.yaml
- assertVisible: ".*(?i)Select 2 Photos.*"
- swipe:
    start: "50%,85%"
    end: "50%,55%"
    duration: 400
- waitForAnimationToEnd:
    timeout: 2000
- assertVisible: ".*(?i)(Recent|Select 2 [Pp]hotos|All Photos).*"
- swipe:
    start: "50%,55%"
    end: "50%,85%"
    duration: 400
- waitForAnimationToEnd:
    timeout: 2000
- assertVisible: ".*(?i)Select 2 [Pp]hotos.*"
