# ATP Test Case ID: PC_02b
# Excel: Precut_02 (b) | Module: Pre-Cut Stickers- “Don’t Show Again” Button Functionality
# Verify that tapping “Don’t Show Again” prevents the warning popup from appearing when re-entering Pre-Cut.
# Expected: Selection screen after Don't Show Again; warning not shown on second Pre-cut entry.
appId: com.hp.impulse.sprocket
name: "PC_02b - Verify Dont Show Again hides warning"
tags:
  - precut
  - atp-excel
  - positive
---
- runFlow: subflows/reach_warning.yaml
- runFlow: subflows/tap_dont_show_again.yaml
- runFlow: subflows/wait_selection_screen.yaml
- runFlow: subflows/tap_in_app_back.yaml
- extendedWaitUntil:
    visible: ".*(?i)(Collage Maker|Quick Print|Pre-?cut).*"
    timeout: 15000
- runFlow: subflows/tap_precut.yaml
- extendedWaitUntil:
    visible: ".*(?i)Select 2 photos.*"
    timeout: 20000
- assertVisible: ".*(?i)Select 2 photos.*"
- assertNotVisible: "(?i)Don't Show Again.*"
