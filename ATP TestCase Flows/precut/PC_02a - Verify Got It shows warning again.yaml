# ATP Test Case ID: PC_02a
# Excel: Precut_02 (a) | Module: Pre-Cut Stickers – “Got It” Button Functionality
# Verify that tapping “Got It” closes the warning popup and displays it again when re-entering Pre-Cut.
# Expected: Selection screen after Got It; warning shown again on second Pre-cut entry.
appId: com.hp.impulse.sprocket
name: "PC_02a - Verify Got It shows warning again"
tags:
  - precut
  - atp-excel
  - positive
---
- runFlow: subflows/reach_warning.yaml
- runFlow: subflows/tap_got_it.yaml
- runFlow: subflows/wait_selection_screen.yaml
- runFlow: subflows/tap_in_app_back.yaml
- extendedWaitUntil:
    visible: ".*(?i)(Collage Maker|Quick Print|Pre-?cut).*"
    timeout: 15000
- runFlow: subflows/tap_precut.yaml
- runFlow: subflows/wait_warning_popup.yaml
- runFlow: subflows/assert_warning_popup.yaml
