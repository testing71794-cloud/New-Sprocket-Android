# ATP Test Case ID: PC_12
# Excel: Precut_12 | Module: Pre-Cut Stickers – Save Changes Popup
# Verify that the “Save as new photo?” popup is displayed when changes are made using gestures.
# Expected: Save as new photo? with Save to Gallery and Do Not Save.
appId: com.hp.impulse.sprocket
name: "PC_12 - Verify Save as new photo popup after gesture edit"
tags:
  - precut
  - atp-excel
  - positive
---
- runFlow: subflows/reach_selection_got_it.yaml
- runFlow: subflows/select_two_photos.yaml
- runFlow: subflows/gesture_edit_slot.yaml
- runFlow: subflows/tap_in_app_back.yaml
- runFlow: subflows/wait_save_popup.yaml
- assertVisible: "(?i)Save to Gallery.*"
- assertVisible: "(?i)Do Not Save.*"
