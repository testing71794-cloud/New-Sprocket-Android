appId: com.caglobal.hp.sprocket
---
# Photo ID toolbar Back is an unlabeled ImageView at top-left.
- tapOn:
    point: "7%,8%"
- waitForAnimationToEnd:
    timeout: 2500
# Land on Create hub (scrollable tile list).
- runFlow:
    when:
      visible: ".*(?i)Create.*"
    commands:
      - tapOn:
          text: ".*(?i)Create.*"
          optional: true
- extendedWaitUntil:
    visible: ".*(?i)(Collage Maker|Quick Print|Photobooth|Photo ID).*"
    timeout: 15000
