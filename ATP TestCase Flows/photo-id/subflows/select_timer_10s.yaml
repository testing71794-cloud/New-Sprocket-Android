appId: com.caglobal.hp.sprocket
---
- runFlow:
    when:
      visible: ".*(?i)(10s|10 sec).*"
    commands:
      - tapOn: ".*(?i)(10s|10 sec).*"
- runFlow:
    when:
      notVisible: ".*(?i)(10s|10 sec).*"
    commands:
      - tapOn:
          point: "85%,46%"
- waitForAnimationToEnd:
    timeout: 2000
- runFlow:
    when:
      notVisible: ".*(?i)2.?x.?2.*"
    commands:
      - tapOn:
          point: "20%,40%"
      - waitForAnimationToEnd:
          timeout: 1500
