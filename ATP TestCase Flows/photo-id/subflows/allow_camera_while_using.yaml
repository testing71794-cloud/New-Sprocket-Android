appId: com.caglobal.hp.sprocket
---
# Excel: If camera permission appears, tap While using the app (Vivo: WHILE USING THE APP).
- extendedWaitUntil:
    visible: ".*(?i)(take pictures|record video|While using the app|WHILE USING THE APP|Don't allow|Don.t allow|ONLY THIS TIME|Photo ID Mode|Open Settings|grant camera permission).*"
    timeout: 12000
    optional: true
- runFlow:
    when:
      visible: ".*(?i)(take pictures|record video|While using the app|WHILE USING THE APP|ONLY THIS TIME).*"
    commands:
      - tapOn:
          text: "(?i)WHILE USING THE APP"
          optional: true
      - tapOn:
          text: "(?i)While using the app"
          optional: true
      - tapOn:
          text: "(?i)ONLY THIS TIME"
          optional: true
      - tapOn:
          id: ".*permission_allow_foreground_only_button.*"
          optional: true
      - tapOn:
          id: ".*permission_allow_button.*"
          optional: true
      - waitForAnimationToEnd:
          timeout: 2000
- runFlow:
    when:
      visible: ".*(?i)(Open Settings|grant camera permission).*"
    commands:
      - runFlow: recover_camera_deny_screen.yaml
