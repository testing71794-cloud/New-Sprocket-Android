# ATP Test Case ID: PID_02c
# Excel: PhotoID_02 (c) | Module: Photo ID – Don't Show Again Functionality
# Verify that the Photo ID Mode popup does not appear again after the user selects Don't Show Again.
# Expected: Popup dismissed; on re-entry Photo ID opens directly without Mode popup.
appId: com.caglobal.hp.sprocket
name: "PID_02c - Dont Show Again Functionality"
tags:
  - photo-id
  - atp-excel
  - positive
---
- runFlow: subflows/excel_launch_to_home.yaml
- runFlow: subflows/open_photo_id.yaml
- runFlow: subflows/allow_camera_while_using.yaml
- runFlow: subflows/wait_mode_popup.yaml
- runFlow: subflows/assert_mode_popup.yaml
- runFlow: subflows/dismiss_mode_popup_dont_show_again.yaml
- runFlow: subflows/wait_capture_screen.yaml
- runFlow: subflows/tap_in_app_back.yaml
- extendedWaitUntil:
    visible: ".*(?i)(Collage Maker|Quick Print|Photo ID).*"
    timeout: 15000
- runFlow: subflows/open_photo_id.yaml
- runFlow: subflows/allow_camera_while_using.yaml
- waitForAnimationToEnd:
    timeout: 3000
- assertNotVisible: "(?i)Photo ID Mode.*"
- assertVisible: "(?i)Photo ID.*"
