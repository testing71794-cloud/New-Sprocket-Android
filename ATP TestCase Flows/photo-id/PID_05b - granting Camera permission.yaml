# ATP Test Case ID: PID_05b
# Excel: Photo ID_05 (b) | Module: Photo ID- granting Camera permission
# Verify the application behavior after granting Camera permission from the device settings.
# Expected: Denied screen gone; Photo ID Mode popup then capture screen after OK.
appId: com.caglobal.hp.sprocket
name: "PID_05b - granting Camera permission"
tags:
  - photo-id
  - atp-excel
  - negative
---
- runFlow: subflows/excel_launch_to_home.yaml
- runFlow: subflows/open_photo_id.yaml
- runFlow: subflows/deny_camera.yaml
- extendedWaitUntil:
    visible: ".*(?i)Open Settings.*"
    timeout: 15000
- tapOn: ".*(?i)Open Settings.*"
- waitForAnimationToEnd:
    timeout: 4000
- setPermissions:
    permissions:
      camera: allow
- back
- launchApp:
    stopApp: false
- waitForAnimationToEnd:
    timeout: 4000
- runFlow: subflows/allow_camera_while_using.yaml
- runFlow: subflows/wait_mode_popup.yaml
- runFlow: subflows/dismiss_mode_popup_ok.yaml
- runFlow: subflows/wait_capture_screen.yaml
