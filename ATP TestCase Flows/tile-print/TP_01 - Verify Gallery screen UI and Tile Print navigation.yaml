# Source: Tiles modules 01 | Gallery (Tile Print) | Positive
# Gallery opens in Recents with its required chrome; selecting one photo opens Tile Print.
appId: com.caglobal.hp.sprocket
name: "TP_01 - Verify Gallery screen UI and Tile Print navigation"
tags:
  - tile-print
  - atp-excel
  - positive
---
- runFlow: subflows/reach_module_screen.yaml
- runFlow: subflows/assert_gallery_ui.yaml
- tapOn:
    point: "19%,24%"
- extendedWaitUntil:
    visible: ".*(?i)(Copies|Tiles|^Print$|Add Printer).*"
    timeout: 20000
- runFlow: subflows/assert_tile_print_preview_ui.yaml
