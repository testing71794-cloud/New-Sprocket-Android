# Source: Tiles modules 15 | Create > Copies | Positive
appId: com.caglobal.hp.sprocket
name: "TP_15 - Verify Copies screen and printing"
tags:
  - tile-print
  - atp-excel
  - positive
  - physical-printer
---
- runFlow: subflows/open_tile_print_preview.yaml
- runFlow: subflows/assert_default_2x2.yaml
- runFlow: subflows/increase_copy_count_to_two.yaml
- runFlow:
    when:
      visible:
        id: ".*remove_copies.*"
    commands:
      - tapOn:
          id: ".*remove_copies.*"
- runFlow:
    when:
      notVisible:
        id: ".*remove_copies.*"
    commands:
      - tapOn:
          traits: square
          width: 80
          height: 80
          tolerance: 20
          leftOf: "^(?:[1-9]|10)$"
          below: "Copies"
- assertVisible: "0?1"
- runFlow: subflows/increase_copy_count_to_two.yaml
- runFlow: subflows/assert_tile_print_preview_ui.yaml
- runFlow: ../quick-print/subflows/tap_print_and_assert_complete.yaml
