appId: com.caglobal.hp.sprocket
---
- longPressOn:
    point: "19%,24%"
- assertVisible: "Multi-select is not available in Tile Print."
- takeScreenshot: tile_print_multiselect_blocked_toast
- tapOn:
    id: ".*(?i)(close|dismiss).*"
    optional: true
- runFlow:
    when:
      visible: "Multi-select is not available in Tile Print."
    commands:
      - tapOn:
          point: "94%,88%"
- assertNotVisible: "Multi-select is not available in Tile Print."
