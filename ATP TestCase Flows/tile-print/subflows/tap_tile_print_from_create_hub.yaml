# Gallery home (Create hub): tap Tile Print — toast is verified by extendedWaitUntil only (auto-dismisses fast).
appId: com.caglobal.hp.sprocket
---
- tapOn:
    text: ".*(?i)Tile Print.*"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: ".*(?i)(Sorry.*Tiles feature is not compatible with this printer|not compatible with this printer).*"
    timeout: 5000
