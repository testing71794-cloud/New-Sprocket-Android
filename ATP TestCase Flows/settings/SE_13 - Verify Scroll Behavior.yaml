# ATP Test Case ID: SE_13
# Excel: Hamburger Menu  13 | Module: UI/UX
# Verify Scroll Behavior
# Expected: Menu scrolls smoothly and all menu items remain accessible.
appId: com.hp.impulse.sprocket
name: "SE_13 - Verify Scroll Behavior"
tags:
  - settings
  - atp-excel
---
- runFlow: subflows/reach_module_screen.yaml
- swipe:
    start: "50%,80%"
    end: "50%,25%"
    duration: 400
- waitForAnimationToEnd:
    timeout: 1500
- assertVisible:
    text: ".*(?i)Legal.*Privacy.*"
- swipe:
    start: "50%,25%"
    end: "50%,80%"
    duration: 400
- waitForAnimationToEnd:
    timeout: 1500
- assertVisible:
    text: ".*(?i)App Settings.*"
