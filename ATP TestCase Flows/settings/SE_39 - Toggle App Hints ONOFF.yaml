# ATP Test Case ID: SE_39
# Excel: Hamburger Menu 44 | Module: Display
# Toggle App Hints ON/OFF
# Expected: Display App Hints toggle enables and disables app hints correctly.
appId: com.hp.impulse.sprocket
name: "SE_39 - Toggle App Hints ONOFF"
tags:
  - settings
  - atp-excel
---
- runFlow: subflows/reach_app_settings_screen.yaml
- runFlow: subflows/tap_display_app_hints_toggle.yaml
- assertVisible:
    text: ".*(?i)Display App Hints.*"
- runFlow: subflows/tap_display_app_hints_toggle.yaml
- runFlow: subflows/assert_app_settings_screen.yaml
