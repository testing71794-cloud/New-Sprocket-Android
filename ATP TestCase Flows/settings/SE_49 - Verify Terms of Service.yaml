# ATP Test Case ID: SE_49
# Excel: Hamburger Menu 54 | Module: Legal
# Verify Terms of Service
# Expected: Terms of Service opens successfully in in-app browser.
appId: com.hp.impulse.sprocket
name: "SE_49 - Verify Terms of Service"
tags:
  - settings
  - atp-excel
  - legal-privacy
---
- runFlow: subflows/reach_legal_privacy_screen.yaml
- tapOn: ".*(?i)Terms of Service.*"
- waitForAnimationToEnd:
    timeout: 5000
- runFlow: subflows/assert_terms_of_service_screen.yaml
