# ATP Test Case ID: SE_41
# Excel: Hamburger Menu 46 | Module: Data
# Toggle Low Data Mode Functionality
# Expected: Low Data Mode toggle enables and disables reduced data usage correctly.
appId: com.hp.impulse.sprocket
name: "SE_41 - Toggle Low Data Mode Functionality"
tags:
  - settings
  - atp-excel
---
- runFlow: subflows/reach_app_settings_screen.yaml
- runFlow: subflows/tap_low_data_mode_toggle.yaml
- assertVisible:
    text: ".*(?i)Low Data Mode.*"
- runFlow: subflows/tap_low_data_mode_toggle.yaml
- runFlow: subflows/assert_app_settings_screen.yaml
