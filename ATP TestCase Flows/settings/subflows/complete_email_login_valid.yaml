# Fill and submit email login form — assumes Log In with Email screen is open.
appId: com.hp.impulse.sprocket
---
- runFlow: ../../login/subflows/enter_email_credentials.yaml
- hideKeyboard
- waitForAnimationToEnd:
    timeout: 2000
- tapOn: "Log In"
- waitForAnimationToEnd:
    timeout: 5000
- extendedWaitUntil:
    visible: ".*(?i)(Collage Maker|Welcome).*"
    timeout: 20000
- assertNotVisible:
    text: "Log In with Email"
