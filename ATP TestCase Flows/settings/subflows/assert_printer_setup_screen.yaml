# Printer Setup (screen 3) — Charge + Power On onboarding step.
appId: com.caglobal.hp.sprocket
---
- extendedWaitUntil:
    visible: ".*(?i)Charge \\+ Power On.*"
    timeout: 10000
- assertVisible:
    text: ".*(?i)Charge \\+ Power On.*"
- assertVisible:
    text: ".*(?i)Next.*"
- assertVisible:
    text: ".*(?i)(USB cord|power button).*"
    optional: true
