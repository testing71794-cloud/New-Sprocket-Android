# Change Password screen — from Account Settings.
appId: com.hp.impulse.sprocket
---
- extendedWaitUntil:
    visible: ".*(?i)Change Password.*"
    timeout: 10000
- assertVisible:
    text: ".*(?i)Change Password.*"
- assertVisible:
    text: ".*(?i)Current Password.*"
- assertVisible:
    text: ".*(?i)New Password.*"
- assertVisible:
    text: ".*(?i)Confirm.*Password.*"
