# Submit change password with wrong current password — password must not change.
appId: com.hp.impulse.sprocket
---
- runFlow: reach_change_password_screen.yaml
- tapOn: ".*(?i)Current Password.*"
- inputText: WrongPassword123!
- tapOn: ".*(?i)New Password.*"
- inputText: NewValidPass123!
- tapOn: ".*(?i)Confirm.*Password.*"
- inputText: NewValidPass123!
- hideKeyboard
- waitForAnimationToEnd:
    timeout: 1500
- tapOn: ".*(?i)Save.*"
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible:
    text: ".*(?i)Change Password.*"
- assertVisible:
    text: ".*(?i)Current Password.*"
- runFlow:
    when:
      visible: ".*(?i)incorrect.*"
    commands:
      - assertVisible:
          text: ".*(?i)incorrect.*"
- runFlow:
    when:
      visible: "Password change failed. Please try again."
    commands:
      - assertVisible:
          text: "Password change failed. Please try again."
