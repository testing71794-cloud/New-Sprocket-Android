# Create hub → More → Hamburger → Log In → Log In options screen (same as LO_01 assertions).
appId: com.hp.impulse.sprocket
---
- runFlow: reach_hamburger_menu.yaml
- tapOn: ".*(?i)Log In.*"
- waitForAnimationToEnd:
    timeout: 3000
- extendedWaitUntil:
    visible: "Log In"
    timeout: 15000
- runFlow: ../../common/subflows/assert_login_options_screen.yaml
