# Submit change password with mismatched confirm — expect validation error.
appId: com.hp.impulse.sprocket
---
- runFlow: reach_change_password_screen.yaml
- tapOn: ".*(?i)Current Password.*"
- inputText: 252546Nm#
- tapOn: ".*(?i)New Password.*"
- inputText: NewValidPass123!
- tapOn: ".*(?i)Confirm.*Password.*"
- inputText: DifferentPass123!
- hideKeyboard
- waitForAnimationToEnd:
    timeout: 1500
- tapOn: ".*(?i)Save.*"
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible:
    text: "Passwords do not match"
