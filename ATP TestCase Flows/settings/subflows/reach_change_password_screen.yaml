# Account Settings → Change Password.
appId: com.hp.impulse.sprocket
---
- runFlow: reach_module_screen_logged_in.yaml
- tapOn: ".*(?i)Account Settings.*"
- waitForAnimationToEnd:
    timeout: 3000
- runFlow: assert_account_settings_screen.yaml
- tapOn: ".*(?i)Change Password.*"
- waitForAnimationToEnd:
    timeout: 3000
- runFlow: assert_change_password_screen.yaml
