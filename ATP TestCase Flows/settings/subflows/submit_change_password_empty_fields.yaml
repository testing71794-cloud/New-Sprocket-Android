# Tap Save on empty change password form — expect validation or disabled save.
appId: com.hp.impulse.sprocket
---
- runFlow: reach_change_password_screen.yaml
- tapOn: ".*(?i)Save.*"
- waitForAnimationToEnd:
    timeout: 2000
- assertVisible:
    text: ".*(?i)Change Password.*"
- assertVisible:
    text: ".*(?i)Current Password.*"
