# ATP Test Case ID: SE_14
# Excel: Hamburger Menu  14 | Module: UI/Layout
# Verify Header and Logo
# Expected: HP Sprocket logo and close control are visible on the Hamburger menu header.
appId: com.hp.impulse.sprocket
name: "SE_14 - Verify Header and Logo"
tags:
  - settings
  - atp-excel
---
- runFlow: subflows/reach_module_screen.yaml
- assertVisible:
    text: ".*(?i)sprocket.*"
- runFlow:
    when:
      visible: ".*(?i)Close.*"
    commands:
      - assertVisible:
          text: ".*(?i)Close.*"
