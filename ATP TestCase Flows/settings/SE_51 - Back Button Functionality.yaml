# ATP Test Case ID: SE_51
# Excel: Hamburger Menu 56 | Module: Navigation
# Back Button Functionality
# Expected: User successfully returns to Legal & Privacy main screen from all sub-pages.
appId: com.hp.impulse.sprocket
name: "SE_51 - Back Button Functionality"
tags:
  - settings
  - atp-excel
  - legal-privacy
---
- runFlow: subflows/reach_data_collection_settings_screen.yaml
- back
- waitForAnimationToEnd:
    timeout: 2500
- runFlow:
    when:
      visible: ".*(?i)Are you sure.*"
    commands:
      - tapOn: ".*(?i)(Yes, I'm Sure|Yes I.*Sure).*"
      - waitForAnimationToEnd:
          timeout: 2500
- extendedWaitUntil:
    visible: ".*(?i)Legal.*Privacy.*"
    timeout: 10000
- runFlow: subflows/assert_legal_privacy_screen.yaml
