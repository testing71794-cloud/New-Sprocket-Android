# ATP Test Case ID: SE_31
# Excel: Hamburger Menu 32 | Module: Account
# Cancel Account Deletion
# Expected: Popup closes successfully and account is not deleted.
# Note: Skips when Delete Account option is unavailable on device.
appId: com.hp.impulse.sprocket
name: "SE_31 - Cancel Account Deletion"
tags:
  - settings
  - atp-excel
---
- runFlow: subflows/reach_account_settings_screen.yaml
- swipe:
    start: "50%,85%"
    end: "50%,15%"
    duration: 500
- waitForAnimationToEnd:
    timeout: 1500
- runFlow:
    when:
      visible: ".*(?i)Delete Account.*"
    commands:
      - tapOn: ".*(?i)Delete Account.*"
      - waitForAnimationToEnd:
          timeout: 2000
      - tapOn: "No, Cancel"
      - waitForAnimationToEnd:
          timeout: 2000
      - runFlow: subflows/assert_account_settings_screen.yaml
- runFlow:
    when:
      notVisible: ".*(?i)Delete Account.*"
    commands:
      - assertVisible:
          text: ".*(?i)Account Settings.*"
