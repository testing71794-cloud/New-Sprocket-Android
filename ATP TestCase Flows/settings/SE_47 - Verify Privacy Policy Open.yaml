# ATP Test Case ID: SE_47
# Excel: Hamburger Menu 52 | Module: Privacy
# Verify Privacy Policy Open
# Expected: Privacy Policy opens correctly in in-app browser.
appId: com.hp.impulse.sprocket
name: "SE_47 - Verify Privacy Policy Open"
tags:
  - settings
  - atp-excel
