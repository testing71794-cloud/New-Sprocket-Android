# ATP Test Case ID: SE_19
# Excel: Humburger Menu 20 | Module: Change Password
# Verify Current Password Field
# Expected: Cursor becomes active, keyboard is displayed, entered text is masked/unmasked properly.
appId: com.hp.impulse.sprocket
name: "SE_19 - Verify Current Password Field"
tags:
  - settings
  - atp-excel
---
- runFlow: subflows/reach_change_password_screen.yaml
- tapOn: ".*(?i)Current Password.*"
- inputText: test
- hideKeyboard
- assertVisible:
    text: ".*(?i)Current Password.*"
