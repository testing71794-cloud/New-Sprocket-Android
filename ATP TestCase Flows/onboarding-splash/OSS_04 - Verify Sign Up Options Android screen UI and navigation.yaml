# ATP Test Case ID: OSS_04
# Excel: SU (Android) _01b | Module: ON_02B_Sign Up Options (Android)
# Verify Sign Up Options (Android) screen UI and navigation
# Expected: User is successfully redirected to ON_02B_Sign Up Options (Android). All UI elements are displayed correctly. Google, Facebook, and Email sign-up options are visible and clickable. Apple sign-up option is not displayed on Android. Tapping I
appId: com.hp.impulse.sprocket
name: "OSS_04 - Verify Sign Up Options Android screen UI and navigation"
tags:
  - onboarding-splash
  - atp-excel
---
- runFlow: subflows/reach_module_screen.yaml
- assertVisible:
    text: "Sign up"
    optional: true
- assertVisible:
    text: ".*(?i)(I.ll do it later|Sign Up Later).*"
    optional: true
- assertVisible:
    text: ".*(?i)(I already have (an )?account).*"
    optional: true
- assertVisible:
    text: "Log In"
    optional: true
