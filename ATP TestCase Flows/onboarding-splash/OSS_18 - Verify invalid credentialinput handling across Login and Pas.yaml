# ATP Test Case ID: OSS_18
# Excel: FP TC_E2E_02 | Module: Auth & Error
# Verify invalid credential/input handling across Login and Password Recovery
# Expected: System consistently displays correct error messages (ON_05F_Log In - Invalid Email/Password and "Please enter a valid email address").
appId: com.hp.impulse.sprocket
name: "OSS_18 - Verify invalid credentialinput handling across Login and Pas"
tags:
  - onboarding-splash
  - atp-excel
---
- runFlow: subflows/reach_module_screen.yaml
- assertVisible:
    text: "Please enter a valid email address"
    optional: true
- assertVisible:
    text: "Log In"
    optional: true
- assertVisible:
    text: "Invalid Email"
    optional: true
- assertVisible:
    text: "Invalid email"
    optional: true
- assertVisible:
    text: "password"
    optional: true
