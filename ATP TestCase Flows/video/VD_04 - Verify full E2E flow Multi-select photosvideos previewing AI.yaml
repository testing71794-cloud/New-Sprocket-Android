# ATP Test Case ID: VD_04
# Excel: Video frame 04 | Module: Video Frames & Selection Flow
# Verify full E2E: multi-select, Print Preview, AI restriction, playback, edit entry.
appId: com.hp.impulse.sprocket
name: "VD_04 - Verify full E2E flow Multi-select photosvideos previewing AI"
tags:
  - video
  - atp-excel
---
- launchApp:
    clearState: true
- runFlow: subflows/reach_quick_print_gallery.yaml
- runFlow: subflows/select_mixed_photo_and_video.yaml
- runFlow: subflows/open_print_preview.yaml
- runFlow: subflows/swipe_print_preview_carousel.yaml
- runFlow: subflows/assert_ai_unavailable_for_video.yaml
- runFlow: subflows/toggle_video_playback.yaml
- runFlow: subflows/scrub_video_playback_bar.yaml
- tapOn:
    point: "88%,88%"
    optional: true
- waitForAnimationToEnd:
    timeout: 2000
- back
- waitForAnimationToEnd:
    timeout: 2000
- runFlow: subflows/scrub_video_playback_bar.yaml
- assertVisible:
    text: ".*(?i)(Print|Copies|Tiles|of).*"
    optional: true
