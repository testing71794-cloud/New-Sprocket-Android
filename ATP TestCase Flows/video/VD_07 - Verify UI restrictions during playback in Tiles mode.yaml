# ATP Test Case ID: VD_07
# Excel: Video frame 07 | Module: CR_05E_Video Frames Tile Print
# Verify UI restrictions during playback in Tiles mode.
# Expected: Tiles/Copies changes restricted while playing; play hidden in Tiles; scrub still works.
appId: com.hp.impulse.sprocket
name: "VD_07 - Verify UI restrictions during playback in Tiles mode"
tags:
  - video
  - atp-excel
---
- launchApp:
    clearState: true
- runFlow: subflows/reach_quick_print_gallery.yaml
- runFlow: subflows/reach_video_frames_print_preview.yaml
- runFlow: subflows/toggle_video_playback.yaml
- runFlow: subflows/open_copies_and_tiles_tabs.yaml
- tapOn:
    text: "Copies"
    optional: true
- runFlow: subflows/toggle_video_playback.yaml
- runFlow: subflows/assert_tiles_mode_video_ui.yaml
- assertVisible:
    text: "Tiles"
    optional: true
