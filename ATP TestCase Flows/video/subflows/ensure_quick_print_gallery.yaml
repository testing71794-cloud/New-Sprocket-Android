# Reuse the Quick Print gallery when Recent is already open.
# Cold launch only when back navigation cannot reach it.
# https://docs.maestro.dev/maestro-flows/flow-control-and-logic/conditions
# https://docs.maestro.dev/reference/commands-available/presskey
appId: com.caglobal.hp.sprocket
---
- runFlow:
    when:
      visible: "(?i)Save as new photo.*"
    commands:
      - tapOn: ".*(?i)(Don.?t Save|Do Not Save).*"
      - waitForAnimationToEnd:
          timeout: 1500
- repeat:
    times: 4
    commands:
      - runFlow:
          when:
            visible: ".*(?i)(Save|Done|Apply).*"
            notVisible: "Recent"
          commands:
            - pressKey: back
            - waitForAnimationToEnd:
                timeout: 1500
      - runFlow:
          when:
            visible: ".*(?i)(Copies|Tiles).*"
            notVisible: "Recent"
          commands:
            - pressKey: back
            - waitForAnimationToEnd:
                timeout: 1500
      - runFlow:
          when:
            visible: "(?i)Save as new photo.*"
          commands:
            - tapOn: ".*(?i)(Don.?t Save|Do Not Save).*"
            - waitForAnimationToEnd:
                timeout: 1500
      - runFlow:
          when:
            visible: "Cancel"
          commands:
            - tapOn: "Cancel"
            - waitForAnimationToEnd:
                timeout: 1500
- runFlow:
    when:
      visible: ".*(?i)Quick Print.*"
      notVisible: "Recent"
    commands:
      - tapOn: ".*Quick Print.*"
      - runFlow: ../../permission/subflows/allow_photos_all_permission.yaml
      - extendedWaitUntil:
          visible: "Recent"
          timeout: 12000
          optional: true
- runFlow:
    when:
      notVisible: "Recent"
    commands:
      - launchApp:
          clearState: false
      - waitForAnimationToEnd:
          timeout: 3000
      - runFlow:
          when:
            visible: ".*(?i)Quick Print.*"
            notVisible: "Recent"
          commands:
            - tapOn: ".*Quick Print.*"
            - runFlow: ../../permission/subflows/allow_photos_all_permission.yaml
- runFlow:
    when:
      notVisible: "Recent"
    commands:
      - runFlow: reach_module_screen.yaml
- extendedWaitUntil:
    visible: "Recent"
    timeout: 20000
- assertVisible: "Recent"
