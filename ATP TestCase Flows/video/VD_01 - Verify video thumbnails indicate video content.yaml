# ATP Test Case ID: VD_01
# Excel: Video frame 01 | Module: CR_05A_Gallery with Videos
# Verify video thumbnails indicate video content.
# Expected: Video thumbnails display a play icon at the bottom-right indicating video content.
# Note: Play icon is visual-only; automation verifies a video cell enters Select Mode.
appId: com.hp.impulse.sprocket
name: "VD_01 - Verify video thumbnails indicate video content"
tags:
  - video
  - atp-excel
---
- launchApp:
    clearState: true
- runFlow: subflows/reach_quick_print_gallery.yaml
- assertVisible: "Recent"
- runFlow: subflows/long_press_video_thumbnail.yaml
- assertNotVisible: "1 Photo Selected"
- assertNotVisible: "Photos Selected"
- tapOn: "Cancel"
- waitForAnimationToEnd:
    timeout: 2000
- assertVisible: "Recent"
